(function() {
  const supabaseClient = supabase.createClient(
    'https://nhymadutuhpjgkiurify.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'

  const container = document.getElementById('cms-sections');
  let allTiers = [];

  // ─── RENDER HELPERS ─────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderHero(d) {
    return `
      <section class="relative py-24 px-6 text-center" style="${d.background_image ? `background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('${d.background_image}') center/cover;color:#fff;` : 'background:#fbf9f4;'}">

          <p style="font-size:1.125rem;margin-bottom:2rem;opacity:.9;">${esc(d.subheadline)}</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            ${d.cta_text ? `<a href="${esc(d.cta_link || '#')}" style="display:inline-block;padding:14px 28px;background:linear-gradient(135deg,#3d6285,#6b9bc3);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;">${esc(d.cta_text)}</a>` : ''}

          </div>
        </div>
      </section>`;
  }

  function renderFeatures(d) {
    return `
      <section style="padding:80px 24px;background:#fff;">
        <div style="max-width:1100px;margin:0 auto;text-align:center;">
          ${d.section_title ? `<h2 style="font-size:2rem;font-weight:800;margin-bottom:8px;font-family:'Plus Jakarta Sans',sans-serif;">${esc(d.section_title)}</h2>` : ''}
          ${d.section_subtitle ? `<p style="color:#5e6059;margin-bottom:48px;">${esc(d.section_subtitle)}</p>` : ''}
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;text-align:left;">
            ${(d.items || []).map(item => `
              <div style="padding:24px;background:#fbf9f4;border-radius:12px;">
                <span class="material-symbols-outlined" style="font-size:32px;color:#3d6285;">${esc(item.icon)}</span>
                <h3 style="font-weight:700;margin-top:12px;margin-bottom:6px;">${esc(item.title)}</h3>
                <p style="color:#5e6059;font-size:14px;">${esc(item.description)}</p>

          </div>
        </div>
      </section>`;
  }

  function renderAbout(d) {
    return `
      <section style="padding:80px 24px;background:#fbf9f4;">
        <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:${d.image ? '1fr 1fr' : '1fr'};gap:48px;align-items:center;">

            ${d.section_title ? `<h2 style="font-size:2rem;font-weight:800;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif;">${esc(d.section_title)}</h2>` : ''}
            <p style="color:#5e6059;line-height:1.7;margin-bottom:24px;">${esc(d.body_text)}</p>
            ${d.cta_text ? `<a href="${esc(d.cta_link || '#')}" style="display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#3d6285,#6b9bc3);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;">${esc(d.cta_text)}</a>` : ''}
          </div>
          ${d.image ? `<img src="${esc(d.image)}" style="width:100%;border-radius:16px;">` : ''}
        </div>
      </section>`;
  }

  function renderTestimonials(d) {
    return `
      <section style="padding:80px 24px;background:#fff;">
        <div style="max-width:1100px;margin:0 auto;text-align:center;">
          ${d.section_title ? `<h2 style="font-size:2rem;font-weight:800;margin-bottom:8px;font-family:'Plus Jakarta Sans',sans-serif;">${esc(d.section_title)}</h2>` : ''}
          ${d.section_subtitle ? `<p style="color:#5e6059;margin-bottom:48px;">${esc(d.section_subtitle)}</p>` : ''}
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;text-align:left;">
            ${(d.items || []).map(item => `
              <div style="padding:24px;background:#fbf9f4;border-radius:12px;">
                <p style="font-style:italic;color:#31332e;margin-bottom:16px;">"${esc(item.quote)}"</p>
                <div style="display:flex;align-items:center;gap:12px;">
                  ${item.avatar ? `<img src="${esc(item.avatar)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : ''}
                  <div>
                    <p style="font-weight:700;">${esc(item.author)}</p>
                    <p style="color:#7a7b75;font-size:12px;">${esc(item.role)}</p>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderPricing(d) {
    const tiers = (d.tier_ids || []).map(tid => allTiers.find(t => t.id === tid)).filter(Boolean);
    return `
      <section style="padding:80px 24px;background:#fbf9f4;">
        <div style="max-width:1100px;margin:0 auto;text-align:center;">
          ${d.section_title ? `<h2 style="font-size:2rem;font-weight:800;margin-bottom:8px;font-family:'Plus Jakarta Sans',sans-serif;">${esc(d.section_title)}</h2>` : ''}
          ${d.section_subtitle ? `<p style="color:#5e6059;margin-bottom:48px;">${esc(d.section_subtitle)}</p>` : ''}
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;">
            ${tiers.map(t => `
              <div style="padding:32px;background:#fff;border-radius:16px;border:1px solid #e9e8e1;text-align:left;">
                <h3 style="font-weight:800;font-size:1.25rem;margin-bottom:8px;">${esc(t.name)}</h3>
                <p style="font-size:2rem;font-weight:800;color:#3d6285;margin-bottom:16px;">${t.price ? '$' + t.price : 'Free'}</p>
                <p style="color:#5e6059;font-size:14px;">${esc(t.description || '')}</p>
              </div>`).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderCta(d) {
    return `
      <section style="padding:80px 24px;text-align:center;${d.background_image ? `background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('${d.background_image}') center/cover;color:#fff;` : 'background:linear-gradient(135deg,#3d6285,#6b9bc3);color:#fff;'}">

          <p style="opacity:.9;margin-bottom:24px;">${esc(d.subheadline)}</p>
          ${d.cta_text ? `<a href="${esc(d.cta_link || '#')}" style="display:inline-block;padding:14px 32px;background:#fff;color:#3d6285;border-radius:10px;font-weight:700;text-decoration:none;">${esc(d.cta_text)}</a>` : ''}
        </div>
      </section>`;
  }

  function renderFaq(d) {
    return `
      <section style="padding:80px 24px;background:#fff;">

              <p style="margin-top:12px;color:#5e6059;">${esc(item.answer)}</p>
            </details>`).join('')}
        </div>
      </section>`;
  }

  function renderGallery(d) {
    // Gallery images stored as IDs — for public page you'd need to also fetch media.
    // Simplified: assume image_ids are actually URLs OR fetch separately.
    return `
      <section style="padding:80px 24px;background:#fbf9f4;">
        <div style="max-width:1100px;margin:0 auto;text-align:center;">
          ${d.section_title ? `<h2 style="font-size:2rem;font-weight:800;margin-bottom:8px;font-family:'Plus Jakarta Sans',sans-serif;">${esc(d.section_title)}</h2>` : ''}
          ${d.section_subtitle ? `<p style="color:#5e6059;margin-bottom:32px;">${esc(d.section_subtitle)}</p>` : ''}

            ${(d._gallery_urls || []).map(url => `<img src="${esc(url)}" style="width:100%;height:200px;object-fit:cover;border-radius:10px;">`).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderCustom(d) {
    return `<section style="padding:40px 24px;">${d.html_content || ''}</section>`;
  }

  const RENDERERS = {
    hero: renderHero, features: renderFeatures, about: renderAbout,
    testimonials: renderTestimonials, pricing: renderPricing, cta: renderCta,
    faq: renderFaq, gallery: renderGallery, custom: renderCustom
  };

  function renderSections(sections) {
    const visible = sections.filter(s => s.is_visible !== false)
                            .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    container.innerHTML = visible.map(s => {
      const renderer = RENDERERS[s.section_type];
      return renderer ? renderer(s.data || {}) : '';
    }).join('');
  }

  // ─── LOAD FROM DB ────────────────────────────────────────
  async function loadPage() {
    // Load tiers (for pricing sections)
    const { data: tiers } = await supabaseClient.from('tiers').select('*');
    if (tiers) allTiers = tiers;

    // Load media (for gallery URL resolution)
    const { data: mediaRows } = await supabaseClient.from('media').select('id, url');
    const mediaMap = {};
    (mediaRows || []).forEach(m => mediaMap[m.id] = m.url);

    // Load sections
    const { data, error } = await supabaseClient
      .from('landing_sections')
      .select('*')
      .eq('is_visible', true)
      .order('sort_order', { ascending: true });

    if (error) { console.error('CMS load error:', error); return; }

    // Resolve gallery image IDs → URLs
    (data || []).forEach(s => {
      if (s.section_type === 'gallery' && s.data?.image_ids) {
        s.data._gallery_urls = s.data.image_ids.map(id => mediaMap[id]).filter(Boolean);
      }
    });

    renderSections(data || []);
  }

  // ─── PREVIEW MODE LISTENER ───────────────────────────────
  if (isPreview) {
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CMS_UPDATE') {
        const sections = event.data.sections || [];
        // Resolve gallery URLs from what we already loaded
        sections.forEach(s => {
          if (s.section_type === 'gallery' && s.data?.image_ids) {
            s.data._gallery_urls = s.data.image_ids; // In preview, IDs may already be URLs from editor
          }
        });
        renderSections(sections);
      }
    });
    // Signal ready
    window.parent?.postMessage({ type: 'PREVIEW_READY' }, '*');
  }

  loadPage();
})();
</script>

    else if (block.type === 'features') {
      html = `
        <section id="features" class="py-24 bg-white/50 scroll-mt">
          <div class="max-w-6xl mx-auto px-6 text-center mb-16">

              <span class="font-headline font-extrabold text-5xl text-primary/10 block mb-4">02</span>
              <h3 class="font-headline font-bold text-xl text-text-dark mb-2">Lock & Load</h3>
              <p class="font-body text-sm text-text-muted">Take a selfie or use our backgrounds. Make the Word impossible to scroll past.</p>
            </div>
            <div class="bg-white rounded-2xl p-8 border border-border-soft hover:shadow-lifted transition-all">
              <span class="font-headline font-extrabold text-5xl text-primary/10 block mb-4">03</span>
              <h3 class="font-headline font-bold text-xl text-text-dark mb-2">Deploy</h3>
              <p class="font-body text-sm text-text-muted">One tap sends it to Instagram, TikTok, and WhatsApp. Watch your impact grow.</p>
            </div>
          </div>
        </section>`;
    }

    else if (block.type === 'missions') {
      var missionCards = missions.map(m => {
        var pct = Math.min(Math.round((m.raised_amount / Math.max(m.goal_amount, 1)) * 100), 100);
        var typeStr = m.goal_type === 'shares' ? 'Shares' : m.goal_type === 'users' ? 'Warriors' : '$';
        return `
          <div class="bg-white rounded-2xl overflow-hidden shadow-natural border border-border-soft">
            <div class="h-44 relative"><img src="${m.image_url || '/images/og/social-sharing-1200x630.png'}" class="w-full h-full object-cover"></div>
            <div class="p-6">
              <h4 class="font-headline font-bold text-lg text-text-dark mb-2">${escapeHtml(m.title)}</h4>
              <p class="font-body text-sm text-text-muted mb-4 line-clamp-2">${escapeHtml(m.description)}</p>
              <div class="flex justify-between items-center mb-2"><span class="font-headline font-bold text-primary">${pct}%</span><span class="font-body text-xs font-bold text-text-muted">${typeStr}${m.raised_amount.toLocaleString()} Raised</span></div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full tactical-gradient" style="width: ${pct}%"></div></div>
            </div>
          </div>`;
      }).join('');

      // Build Live Ticker HTML
      var tickerHtml = '';
      if (updates.length > 0) {
        var tickerItems = updates.map(u => `<span class="inline-block mx-8"><span class="text-gold mr-2">LIVE:</span> <span class="font-bold text-white/90">${escapeHtml(u.projects?.title)}</span> — ${escapeHtml(u.message)}</span>`).join('');
        tickerHtml = `
          <div class="w-full bg-dark text-white/70 font-body text-sm py-3 overflow-hidden border-y border-white/10 mb-12 shadow-inner">
            <div class="flex whitespace-nowrap animate-[marquee_25s_linear_infinite]">
              ${tickerItems} ${tickerItems}
            </div>
          </div>
        `;
      }

      html = `
        <section id="missions" class="py-24 scroll-mt">
          ${tickerHtml}
          <div class="max-w-6xl mx-auto px-6 text-center mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${c.eyebrow}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${c.heading}</h2>
            <p class="font-body text-lg text-text-muted max-w-2xl mx-auto">${c.subheading}</p>
          </div>
          <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-6">
            ${missionCards}
          </div>
        </section>`;
    }

    else if (block.type === 'pricing') {
      var tierCards = tiers.map(t => {
        var isFeatured = t.price > 0;
        var features = (t.features || []).map(f => `<li class="flex gap-2 text-sm mb-2"><span class="${isFeatured?'text-gold':'text-primary'}">✓</span> ${escapeHtml(f.label || f)}</li>`).join('');
        return `
          <div class="rounded-2xl p-8 ${isFeatured ? 'tactical-gradient text-white shadow-lifted transform md:-translate-y-4 border-2 border-gold/30' : 'bg-white text-text-dark border border-border-soft'}">
            <h3 class="font-headline font-bold text-2xl mb-1">${escapeHtml(t.name)}</h3>
            <p class="text-sm ${isFeatured?'text-white/60':'text-text-muted'} mb-6">${escapeHtml(t.description)}</p>
            <div class="mb-6"><span class="font-headline font-extrabold text-4xl ${isFeatured?'text-gold':'text-primary'}">${t.price == 0 ? 'Free' : '$'+t.price}</span>${t.price > 0 ? '<span class="text-sm">/mo</span>':''}</div>
            <ul class="mb-8 font-body text-left opacity-90">${features}</ul>
            <a href="app/signup.html${t.price>0?'?plan='+t.id:''}" class="block text-center w-full py-4 rounded-xl font-bold uppercase tracking-wider text-sm transition-transform hover:scale-[1.02] ${isFeatured ? 'bg-gold text-dark' : 'bg-slate-100 text-primary hover:bg-slate-200'}">Enlist</a>
          </div>`;
      }).join('');

      html = `
        <section id="pricing" class="py-24 bg-white scroll-mt text-center border-y border-border-soft">
          <div class="max-w-6xl mx-auto px-6 mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${c.eyebrow}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${c.heading}</h2>
            <p class="font-body text-lg text-text-muted">${c.subheading}</p>
          </div>
          <div class="max-w-4xl mx-auto px-6 grid md:grid-cols-2 gap-8 items-center">
            ${tierCards}
          </div>
        </section>`;
    }

    else if (block.type === 'cta') {
      html = `
        <section class="py-24 tactical-gradient relative overflow-hidden text-center">
          <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\\'60\\' height=\\'60\\' viewBox=\\'0 0 60 60\\' xmlns=\\'http://www.w3.org/2000/svg\\'%3E%3Cpath d=\\'M54.627 0l.83.83v58.34l-.83.83H5.373l-.83-.83V.83l.83-.83h49.254zM53.797 1.66H6.203v56.68h47.594V1.66zM27 10h6v40h-6V10z\\' fill=\\'%23ffffff\\' fill-opacity=\\'1\\' fill-rule=\\'evenodd\\'/%3E%3C/svg%3E');"></div>
          <div class="relative z-10 max-w-3xl mx-auto px-6">
            <p class="font-body font-bold text-xs text-gold uppercase tracking-widest mb-4">${c.eyebrow}</p>
            <h2 class="font-headline font-extrabold text-4xl md:text-5xl text-white mb-6">${c.heading}</h2>
            <p class="font-body text-lg text-white/70 mb-10 max-w-xl mx-auto">${c.subheading}</p>
            <a href="${c.btn_link}" class="inline-block bg-action text-white font-headline font-bold text-sm uppercase tracking-wider px-10 py-4 rounded-xl shadow-action-glow hover:bg-action-dim transition-colors">${c.btn_text}</a>
          </div>
        </section>`;
    }

    container.innerHTML += html;
  });
}

function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

initLandingPage();
</script>
</body>
</html>
