<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Call to Arms. Become a digital soldier for the Great Commission.">
  <title>Go Spread The Word — A Call to Arms</title>
  
  <link rel="icon" type="image/png" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">

  <!-- Tailwind & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#1E4060', 'primary-dim': '#152E45', 'primary-light': '#2B5780',
            'action': '#E25B4D', 'action-dim': '#C84A3E',
            'gold': '#D4A24C', 'gold-dim': '#B88A3D',
            'cream': '#F7F4ED', 'cream-warm': '#FBF8F2',
            'dark': '#16202A', 'dark-soft': '#1F2A35',
            'text-dark': '#1A1A1A', 'text-muted': '#5C6B7A', 'text-light': '#8E9AA8',
            'border-soft': 'rgba(92, 107, 122, 0.15)',
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans', 'sans-serif'],
            'body': ['Manrope', 'sans-serif'],
          },
          boxShadow: {
            'natural': '0 4px 16px rgba(26, 32, 42, 0.06)',
            'lifted': '0 8px 32px rgba(26, 32, 42, 0.10)',
            'action-glow': '0 4px 20px rgba(226, 91, 77, 0.35)',
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background-color: #F7F4ED; color: #1A1A1A; -webkit-font-smoothing: antialiased; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tactical-gradient { background: linear-gradient(145deg, #152E45, #1E4060); }
    .action-gradient { background: linear-gradient(145deg, #E25B4D, #C84A3E); }
    .ghost-border { border: 1px solid rgba(92, 107, 122, 0.15); }
    .scripture-mark { font-family: Georgia, 'Times New Roman', serif; }
    html { scroll-behavior: smooth; }
    .scroll-mt { scroll-margin-top: 80px; }
  </style>
</head>
<body>

<!-- STATIC HEADER -->
<header class="fixed top-0 left-0 w-full z-50 bg-cream/90 backdrop-blur-xl ghost-border border-t-0 border-l-0 border-r-0">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-[72px] flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <img src="/icons/icon-512.png" alt="GSTW" class="h-10 w-10 object-contain rounded-xl">
      <span class="font-headline font-extrabold text-primary text-xl tracking-tight hidden sm:block">GO SPREAD THE WORD</span>
    </a>
    <nav class="hidden lg:flex items-center gap-8">
      <a href="#features" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">How It Works</a>
      <a href="#missions" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Missions</a>
      <a href="#pricing" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Enlist</a>
      <a href="app/login.html" class="font-body font-semibold text-sm text-primary px-4 py-2 border border-primary/20 rounded-lg hover:bg-primary hover:text-white transition-all">Sign In</a>
    </nav>
  </div>
</header>

<!-- DYNAMIC PAGE BLOCKS INJECTED HERE -->
<main id="page-renderer"></main>

<!-- STATIC FOOTER -->
<footer class="bg-dark py-16 px-6 lg:px-8 border-t border-white/5">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
    <div>
      <div class="flex items-center justify-center md:justify-start gap-2.5 mb-2">
        <img src="/icons/icon-512.png" class="w-8 h-8 rounded-lg grayscale opacity-70">
        <span class="font-headline font-bold text-lg text-white/90">Go Spread The Word</span>
      </div>
      <p class="font-body text-xs text-white/40">Made for the Great Commission.</p>
    </div>
    <div class="flex gap-6">
      <a href="Admin/login.html" class="font-body text-xs text-white/40 hover:text-white transition-colors">Command Center (Admin)</a>
      <a href="app/privacy.html" class="font-body text-xs text-white/40 hover:text-white transition-colors">Privacy</a>
    </div>
  </div>
</footer>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

// ─── RENDER ENGINE ──────────────────────────────────────────────
async function initLandingPage() {
  var res = await Promise.allSettled([
    supabaseClient.from('page_blocks').select('*').eq('is_visible', true).order('sort_order'),
    supabaseClient.from('profiles').select('id', { count: 'exact', head: true }),
    supabaseClient.from('shares').select('id', { count: 'exact', head: true }),
    supabaseClient.from('projects').select('*').eq('status', 'active').order('created_at', { ascending: false }).limit(3),
    supabaseClient.from('subscription_tiers').select('*').eq('is_active', true).eq('is_public', true).order('sort_order'),
    supabaseClient.from('site_settings').select('value').eq('id', 'page_bg_color').single() // ← Add this!
  ]);

  var blocks = res[0].status === 'fulfilled' ? res[0].value.data : [];
  var stats = {
    warriors: res[1].status === 'fulfilled' ? res[1].value.count || 0 : 0,
    shares: res[2].status === 'fulfilled' ? res[2].value.count || 0 : 0,
    countries: 42
  };
  var missions = res[3].status === 'fulfilled' ? res[3].value.data : [];
  var tiers = res[4].status === 'fulfilled' ? res[4].value.data : [];
  
  // Set Body Background Color dynamically!
  var bgColor = (res[5].status === 'fulfilled' && res[5].value.data) ? res[5].value.data.value : '#eef4f9';
  document.body.style.backgroundColor = bgColor;

  var container = document.getElementById('page-renderer');
  container.innerHTML = '';

  // ... (rest of render code)
  // Render blocks in order
  blocks.forEach(block => {
    var c = block.content;
    var html = '';

    if (block.type === 'hero') {
      html = `
        <section id="home" class="relative min-h-screen flex flex-col justify-end overflow-hidden pt-[72px]">
          <div class="absolute inset-0 z-0"><img src="${c.bg_image}" class="w-full h-full object-cover"></div>
          <div class="absolute inset-0 z-[1] bg-gradient-to-t from-black/80 via-black/40 to-black/10"></div>
          <div class="relative z-10 w-full max-w-3xl mx-auto px-6 pb-24 pt-32 text-center">
            <h1 class="font-headline font-extrabold text-4xl md:text-6xl text-white leading-tight mb-5 drop-shadow-2xl">${c.headline}</h1>
            <p class="font-body font-medium text-base md:text-lg text-white/90 leading-relaxed max-w-xl mx-auto mb-10 italic drop-shadow-lg">${c.subheadline}</p>
            <a href="${c.cta_link}" class="inline-block bg-gold text-dark font-headline font-bold text-sm uppercase tracking-wider px-10 py-4 rounded-xl shadow-action-glow hover:scale-[1.02] transition-transform">${c.cta_text}</a>
          </div>
        </section>`;
    }
    
    else if (block.type === 'stats') {
      html = `
        <section class="bg-dark py-10 relative z-20 shadow-2xl border-t border-white/10">
          <div class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="text-center"><span class="font-headline font-extrabold text-4xl text-gold block">${stats.warriors.toLocaleString()}</span><span class="font-body font-bold text-xs tracking-widest uppercase text-white/60">Warriors Enlisted</span></div>
            <div class="text-center md:border-x md:border-white/10"><span class="font-headline font-extrabold text-4xl text-gold block">${stats.shares.toLocaleString()}</span><span class="font-body font-bold text-xs tracking-widest uppercase text-white/60">Words Shared</span></div>
            <div class="text-center"><span class="font-headline font-extrabold text-4xl text-gold block">${stats.countries}</span><span class="font-body font-bold text-xs tracking-widest uppercase text-white/60">Countries Reached</span></div>
          </div>
        </section>`;
    }

    else if (block.type === 'features') {
      html = `
        <section id="features" class="py-24 bg-white scroll-mt">
          <div class="max-w-6xl mx-auto px-6 text-center mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${c.eyebrow}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${c.heading}</h2>
            <p class="font-body text-lg text-text-muted">${c.subheading}</p>
          </div>
          <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-8">
            <div class="bg-cream rounded-2xl p-8 border border-border-soft hover:shadow-lifted transition-all">
              <span class="font-headline font-extrabold text-5xl text-primary/10 block mb-4">01</span>
              <h3 class="font-headline font-bold text-xl text-text-dark mb-2">Receive Orders</h3>
              <p class="font-body text-sm text-text-muted">A daily scripture drops into your briefing. Hand-picked for the season.</p>
            </div>
            <div class="bg-cream rounded-2xl p-8 border border-border-soft hover:shadow-lifted transition-all">
              <span class="font-headline font-extrabold text-5xl text-primary/10 block mb-4">02</span>
              <h3 class="font-headline font-bold text-xl text-text-dark mb-2">Lock & Load</h3>
              <p class="font-body text-sm text-text-muted">Take a selfie or use our backgrounds. Make the Word impossible to scroll past.</p>
            </div>
            <div class="bg-cream rounded-2xl p-8 border border-border-soft hover:shadow-lifted transition-all">
              <span class="font-headline font-extrabold text-5xl text-primary/10 block mb-4">03</span>
              <h3 class="font-headline font-bold text-xl text-text-dark mb-2">Deploy</h3>
              <p class="font-body text-sm text-text-muted">One tap sends it to Instagram, TikTok, and WhatsApp. Watch your impact grow.</p>
            </div>
          </div>
        </section>`;
    }

    else if (block.type === 'missions') {
      var missionCards = missions.map(m => {
        var pct = Math.min(Math.round((m.raised_amount / Math.max(m.goal_amount, 1)) * 100), 100);
        var typeStr = m.goal_type === 'shares' ? 'Shares' : m.goal_type === 'users' ? 'Warriors' : '$';
        return `
          <div class="bg-white rounded-2xl overflow-hidden shadow-natural ghost-border">
            <div class="h-44 relative"><img src="${m.image_url || '/images/og/social-sharing-1200x630.png'}" class="w-full h-full object-cover"></div>
            <div class="p-6">
              <h4 class="font-headline font-bold text-lg text-text-dark mb-2">${m.title}</h4>
              <p class="font-body text-sm text-text-muted mb-4 line-clamp-2">${m.description}</p>
              <div class="flex justify-between items-center mb-2"><span class="font-headline font-bold text-primary">${pct}%</span><span class="font-body text-xs text-text-muted">${typeStr}${m.raised_amount.toLocaleString()} Raised</span></div>
              <div class="w-full h-2 bg-cream rounded-full overflow-hidden"><div class="h-full tactical-gradient" style="width: ${pct}%"></div></div>
            </div>
          </div>`;
      }).join('');

      html = `
        <section id="missions" class="py-24 bg-cream scroll-mt">
          <div class="max-w-6xl mx-auto px-6 text-center mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${c.eyebrow}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${c.heading}</h2>
            <p class="font-body text-lg text-text-muted max-w-2xl mx-auto">${c.subheading}</p>
          </div>
          <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-6">
            ${missionCards}
          </div>
        </section>`;
    }

    else if (block.type === 'pricing') {
      var tierCards = tiers.map(t => {
        var isFeatured = t.price > 0;
        var features = (t.features || []).map(f => `<li class="flex gap-2 text-sm mb-2"><span class="${isFeatured?'text-gold':'text-primary'}">✓</span> ${f.label || f}</li>`).join('');
        return `
          <div class="rounded-2xl p-8 ${isFeatured ? 'tactical-gradient text-white shadow-lifted transform md:-translate-y-4 border-2 border-gold/30' : 'bg-white text-text-dark border border-border-soft'}">
            <h3 class="font-headline font-bold text-2xl mb-1">${t.name}</h3>
            <p class="text-sm ${isFeatured?'text-white/60':'text-text-muted'} mb-6">${t.description}</p>
            <div class="mb-6"><span class="font-headline font-extrabold text-4xl ${isFeatured?'text-gold':'text-primary'}">${t.price == 0 ? 'Free' : '$'+t.price}</span>${t.price > 0 ? '<span class="text-sm">/mo</span>':''}</div>
            <ul class="mb-8 font-body text-left opacity-90">${features}</ul>
            <a href="app/signup.html${t.price>0?'?plan='+t.id:''}" class="block text-center w-full py-4 rounded-xl font-bold uppercase tracking-wider text-sm transition-transform hover:scale-[1.02] ${isFeatured ? 'bg-gold text-dark' : 'bg-cream text-primary'}">Enlist</a>
          </div>`;
      }).join('');

      html = `
        <section id="pricing" class="py-24 bg-white scroll-mt text-center">
          <div class="max-w-6xl mx-auto px-6 mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${c.eyebrow}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${c.heading}</h2>
            <p class="font-body text-lg text-text-muted">${c.subheading}</p>
          </div>
          <div class="max-w-4xl mx-auto px-6 grid md:grid-cols-2 gap-8 items-center">
            ${tierCards}
          </div>
        </section>`;
    }

    else if (block.type === 'cta') {
      html = `
        <section class="py-24 tactical-gradient relative overflow-hidden text-center">
          <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\\'60\\' height=\\'60\\' viewBox=\\'0 0 60 60\\' xmlns=\\'http://www.w3.org/2000/svg\\'%3E%3Cpath d=\\'M54.627 0l.83.83v58.34l-.83.83H5.373l-.83-.83V.83l.83-.83h49.254zM53.797 1.66H6.203v56.68h47.594V1.66zM27 10h6v40h-6V10z\\' fill=\\'%23ffffff\\' fill-opacity=\\'1\\' fill-rule=\\'evenodd\\'/%3E%3C/svg%3E');"></div>
          <div class="relative z-10 max-w-3xl mx-auto px-6">
            <p class="font-body font-bold text-xs text-gold uppercase tracking-widest mb-4">${c.eyebrow}</p>
            <h2 class="font-headline font-extrabold text-4xl md:text-5xl text-white mb-6">${c.heading}</h2>
            <p class="font-body text-lg text-white/70 mb-10 max-w-xl mx-auto">${c.subheading}</p>
            <a href="${c.btn_link}" class="inline-block bg-action text-white font-headline font-bold text-sm uppercase tracking-wider px-10 py-4 rounded-xl shadow-action-glow hover:bg-action-dim transition-colors">${c.btn_text}</a>
          </div>
        </section>`;
    }

    container.innerHTML += html;
  });
}

initLandingPage();
</script>
</body>
</html>
