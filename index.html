<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Call to Arms. Become a digital soldier for the Great Commission.">
  <title>Go Spread The Word — A Call to Arms</title>

  <!-- Tailwind CSS & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind Configuration (From Old Design) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#1E4060', 'primary-dim': '#152E45', 'primary-light': '#2B5780',
            'action': '#E25B4D', 'action-dim': '#C84A3E',
            'gold': '#D4A24C', 'gold-dim': '#B88A3D',
            'cream': '#F7F4ED', 'cream-warm': '#FBF8F2',
            'dark': '#16202A', 'dark-soft': '#1F2A35',
            'text-dark': '#1A1A1A', 'text-muted': '#5C6B7A', 'text-light': '#8E9AA8',
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans', 'sans-serif'],
            'body': ['Manrope', 'sans-serif'],
          },
          boxShadow: {
            'natural': '0 4px 16px rgba(26, 32, 42, 0.06)',
            'lifted': '0 8px 32px rgba(26, 32, 42, 0.10)',
            'ambient': '0 20px 40px rgba(26, 32, 42, 0.05)',
            'tactical': '0 4px 20px rgba(30, 64, 96, 0.25)',
            'action-glow': '0 4px 20px rgba(226, 91, 77, 0.35)',
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background-color: #F7F4ED; color: #1A1A1A; -webkit-font-smoothing: antialiased; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tactical-gradient { background: linear-gradient(145deg, #152E45, #1E4060); }
    .action-gradient { background: linear-gradient(145deg, #E25B4D, #C84A3E); }
    .ghost-border { border: 1px solid rgba(92, 107, 122, 0.15); }
    .scripture-mark { font-family: Georgia, 'Times New Roman', serif; }
    html { scroll-behavior: smooth; }
    .scroll-mt { scroll-margin-top: 80px; }
  </style>
</head>
<body>

<!-- STATIC HEADER -->
<header class="fixed top-0 left-0 w-full z-50 bg-cream/90 backdrop-blur-xl ghost-border border-t-0 border-l-0 border-r-0">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-[72px] flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 flex-shrink-0">
      <img src="/images/logo/logo-full-dark.png" alt="GSTW" class="h-10 object-contain" style="mix-blend-mode:multiply;">
      <span class="font-headline font-bold text-primary">GSTW</span>
    </a>
    <nav class="hidden lg:flex items-center gap-8">
      <a href="#home" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Home</a>
      <a href="#features" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Mission</a>
      <a href="#pricing" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Enlist</a>
      <a href="Admin/login.html" class="font-body font-semibold text-sm text-text-muted hover:text-primary transition-colors">Admin</a>
    </nav>
  </div>
</header>

<!-- DYNAMIC CMS CONTAINER -->
<div id="cms-sections"></div>

<!-- STATIC FOOTER -->
<footer class="bg-dark py-16 px-6 lg:px-8">
  <div class="max-w-7xl mx-auto text-center">
    <div class="flex justify-center items-center gap-4 mb-8" id="footer-socials">
      <!-- Live Social Icons will inject here -->
    </div>
    <div class="h-px bg-white/10 mb-6 max-w-lg mx-auto"></div>
    <p class="font-body text-xs text-white/40">© 2024 Go Spread The Word. Made for the Great Commission.</p>
  </div>
</footer>
<script>
  // ─── INIT SUPABASE ───
  const supabaseClient = supabase.createClient(
    'https://nhymadutuhpjgkiurify.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
  );

  const container = document.getElementById('cms-sections');
  const isPreview = new URLSearchParams(location.search).get('preview') === '1';
  let allTiers = [];

  // Enable visual feedback in preview mode
  if (isPreview) {
    document.body.classList.add('cms-preview-mode');
    const style = document.createElement('style');
    style.textContent = `
      .cms-preview-mode section[data-cms-id] { position: relative; transition: all 0.2s; cursor: pointer; }
      .cms-preview-mode section[data-cms-id]:hover::after {
        content: 'Click to Edit'; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(30, 64, 96, 0.1); border: 2px dashed #D4A24C; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        color: #1E4060; font-weight: bold; font-family: sans-serif; font-size: 1.5rem; text-transform: uppercase;
      }
    `;
    document.head.appendChild(style);
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  // ─── DYNAMIC RENDERERS (TACTICAL DESIGN) ───

  function renderHero(d, id) {
    const bg = d.background_image || 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80';
    return `
      <section data-cms-id="${id}" class="relative min-h-[90vh] flex flex-col justify-end overflow-hidden pt-[72px]">
        <div class="absolute inset-0 z-0">
          <img src="${esc(bg)}" class="w-full h-full object-cover">
        </div>
        <div class="absolute inset-0 z-[1] bg-gradient-to-t from-black/80 via-black/40 to-black/10"></div>
        <div class="relative z-10 w-full max-w-3xl mx-auto px-6 pb-20 pt-32 text-center">
          <h1 class="font-headline font-extrabold text-4xl md:text-6xl text-white leading-tight tracking-tight mb-5" style="text-shadow:0 2px 20px rgba(0,0,0,0.6);">
            ${d.headline ? d.headline.replace(/\|/g, '<br>') : 'Spread the Word.<br>Change the World.'}
          </h1>
          <p class="font-body font-medium text-base md:text-lg text-white/85 leading-relaxed max-w-lg mx-auto mb-10 italic">
            "${esc(d.scripture_quote || 'Go therefore and make disciples of all nations.')}" — ${esc(d.scripture_ref || 'Matthew 28:19')}
          </p>
          <div>
            <a href="${esc(d.cta_link || '#pricing')}" class="inline-block bg-gold text-dark font-headline font-bold text-sm uppercase tracking-wider px-10 py-4 rounded-xl shadow-action-glow hover:bg-gold-dim hover:scale-[1.02] transition-all relative z-20">
              ${esc(d.cta_text || 'Enlist in the Mission')}
            </a>
          </div>
        </div>
      </section>`;
  }

  function renderStats(d, id) {
    const items = Array.isArray(d.items) && d.items.length ? d.items : [
      { metric: 'warriors', label: 'Warriors Enlisted', fallback: '1248' },
      { metric: 'shares', label: 'Words Deployed', fallback: '47892' },
      { metric: 'countries', label: 'Countries Reached', fallback: '38' }
    ];
    return `
      <section data-cms-id="${id}" class="bg-dark py-10 border-y border-white/5">
        <div class="max-w-5xl mx-auto px-6">
          <div class="grid grid-cols-1 md:grid-cols-${Math.min(items.length, 4)} gap-5">
            ${items.map((item, i) => `
              <div class="text-center ${i > 0 ? 'md:border-l md:border-white/10' : ''}">
                <span class="font-headline font-extrabold text-4xl text-gold block" data-stat-metric="${esc(item.metric)}" data-stat-fallback="${esc(item.fallback)}">—</span>
                <span class="font-body font-semibold text-sm text-white/70 uppercase tracking-widest mt-1 block">${esc(item.label)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderFeatures(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-cream scroll-mt">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            ${(d.items || []).map((item, i) => `
              <article class="bg-white rounded-2xl overflow-hidden shadow-natural ghost-border hover:shadow-lifted hover:-translate-y-1 transition-all ${i === 1 ? 'border-2 border-gold shadow-lifted' : ''}">
                ${item.image ? `<div class="h-48 overflow-hidden"><img src="${esc(item.image)}" class="w-full h-full object-cover"></div>` : ''}
                <div class="p-6">
                  <h3 class="font-headline font-bold text-xl text-text-dark mb-3">${esc(item.title)}</h3>
                  <p class="font-body text-sm text-text-muted leading-relaxed">${esc(item.description)}</p>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderSteps(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-white scroll-mt">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="space-y-16 lg:space-y-20 mb-16">
            ${(d.items || []).map((item, i) => `
              <div class="grid md:grid-cols-2 gap-8 lg:gap-12 items-center">
                <div class="${i % 2 !== 0 ? 'md:order-2' : ''} rounded-2xl overflow-hidden shadow-lifted">
                  <img src="${esc(item.image)}" class="w-full h-72 object-cover bg-cream">
                </div>
                <div class="${i % 2 !== 0 ? 'md:order-1' : ''}">
                  <span class="font-headline font-extrabold text-6xl text-gold/40 leading-none block mb-2">0${i+1}</span>
                  <h3 class="font-headline font-bold text-2xl md:text-3xl text-text-dark mb-3">${esc(item.title)}</h3>
                  <p class="font-body text-base text-text-muted leading-relaxed">${esc(item.description)}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </section>`;
  }

  // --- MISSING SECTION: Text / About Block ---
  function renderTextBlock(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-cream scroll-mt">
        <div class="max-w-4xl mx-auto px-6 text-center">
          <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
          <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-8">${esc(d.section_subtitle)}</h2>
          <div class="font-body text-base md:text-lg text-text-muted leading-relaxed space-y-6 text-left max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-natural ghost-border">
            ${(d.body_text || '').split('\n').map(p => p.trim() ? `<p>${esc(p)}</p>` : '').join('')}
          </div>
          ${d.cta_text ? `
          <div class="mt-10">
            <a href="${esc(d.cta_link || '#')}" class="action-gradient text-white font-headline font-bold text-sm uppercase tracking-wider px-10 py-4 rounded-xl shadow-action-glow hover:scale-[1.02] transition-transform inline-block relative z-20">
              ${esc(d.cta_text)}
            </a>
          </div>` : ''}
        </div>
      </section>`;
  }

  // --- MISSING SECTION: Testimonials / Field Report ---
  function renderTestimonials(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-dark scroll-mt">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-12">
            <span class="font-body font-bold text-xs text-gold uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-white mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${(d.items || []).map((item) => `
              <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-8 hover:bg-white/10 hover:border-gold/30 transition-all">
                <div class="scripture-mark text-gold/40 text-5xl leading-none mb-2">"</div>
                <p class="font-body italic text-white/90 text-base leading-relaxed mb-6">${esc(item.quote)}</p>
                <div class="flex items-center gap-4">
                  ${item.avatar ? `<img src="${esc(item.avatar)}" class="w-12 h-12 rounded-full object-cover border-2 border-gold">` : `<div class="w-12 h-12 rounded-full border-2 border-gold bg-primary flex items-center justify-center text-white font-bold">${esc((item.author||'A')[0])}</div>`}
                  <div>
                    <span class="block font-headline font-semibold text-sm text-white">${esc(item.author)}</span>
                    <span class="block font-body text-xs text-white/50">${esc(item.role)}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </section>`;
  }

  // --- MISSING SECTION: PWA Install Guide ---
  function renderPwaInstall(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-white scroll-mt">
        <div class="max-w-5xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-12">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
            <div class="bg-cream rounded-2xl p-8 border-t-4 border-primary shadow-natural">
              <h4 class="font-headline font-bold text-xl text-text-dark mb-4 flex items-center gap-3">
                <span class="text-2xl">🍎</span> iOS (iPhone/iPad)
              </h4>
              <p class="font-body text-text-muted leading-relaxed text-sm">${(d.ios_text || '1. Open in Safari\\n2. Tap Share\\n3. Add to Home Screen').replace(/\n/g, '<br>')}</p>
            </div>
            <div class="bg-cream rounded-2xl p-8 border-t-4 border-gold shadow-natural">
              <h4 class="font-headline font-bold text-xl text-text-dark mb-4 flex items-center gap-3">
                <span class="text-2xl">🤖</span> Android
              </h4>
              <p class="font-body text-text-muted leading-relaxed text-sm">${(d.android_text || '1. Open in Chrome\\n2. Tap Menu (⋮)\\n3. Install App').replace(/\n/g, '<br>')}</p>
            </div>
          </div>
        </div>
      </section>`;
  }

  function renderPricing(d, id) {
    const activeTiers = (d.tier_ids || []).map(tid => {
      const key = String(tid).toLowerCase().trim();
      return allTiers.find(t => String(t.id) === String(tid) || String(t.name||'').toLowerCase().trim() === key || String(t.slug||'').toLowerCase().trim() === key);
    }).filter(Boolean);

    if (activeTiers.length === 0) return '';

    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-cream scroll-mt">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid md:grid-cols-${Math.min(activeTiers.length, 3)} gap-6 max-w-5xl mx-auto items-stretch">
            ${activeTiers.map((t, idx) => {
              const isPopular = activeTiers.length > 1 && idx === 1;
              const isFree = !t.price || Number(t.price) === 0;
              
              // Robust Feature Parser
              let features = [];
              try {
                if (Array.isArray(t.features)) features = t.features;
                else if (typeof t.features === 'string') {
                  const parsed = JSON.parse(t.features);
                  features = Array.isArray(parsed) ? parsed : [];
                } else if (t.features && typeof t.features === 'object') {
                  features = Object.values(t.features);
                }
              } catch(e) {
                features = typeof t.features === 'string' ? t.features.split(',').map(s=>s.trim()) : [];
              }

              return `
                <div class="bg-white rounded-2xl p-8 shadow-lifted flex flex-col justify-between border-2 ${isPopular ? 'border-gold shadow-action-glow relative' : 'border-transparent ghost-border'}">
                  ${isPopular ? `<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-gold text-dark text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full">Recommended</div>` : ''}
                  <div>
                    <h3 class="font-headline font-extrabold text-2xl text-text-dark text-center mb-2">${esc(t.name)}</h3>
                    <div class="text-center mb-5">
                      <span class="font-headline font-extrabold text-5xl ${isPopular ? 'text-primary' : 'text-text-dark'}">${isFree ? 'Free' : '$' + t.price}</span>
                      ${!isFree ? `<span class="font-body text-base text-text-muted">/${t.interval||'month'}</span>` : ''}
                    </div>
                    <div class="h-px bg-cream mb-5"></div>
                    <ul class="space-y-3 mb-8">
                      ${features.map(f => {
                        const txt = typeof f === 'string' ? f : (f.text || f.label || '');
                        if(!txt) return '';
                        return `
                        <li class="flex items-start gap-2.5">
                          <span class="text-gold font-bold flex-shrink-0">✓</span>
                          <span class="font-body text-sm text-text-dark leading-snug">${esc(txt)}</span>
                        </li>`;
                      }).join('')}
                    </ul>
                  </div>
                  <a href="${isFree ? '/app/signup.html' : (t.checkout_url || '/app/signup.html')}" class="${isPopular ? 'action-gradient text-white' : 'tactical-gradient text-white'} block text-center font-headline font-bold text-sm uppercase tracking-wider px-6 py-4 rounded-xl shadow-natural hover:scale-[1.02] transition-transform relative z-20">
                    ${isFree ? 'Get Started' : 'Enlist Now'}
                  </a>
                </div>`;
            }).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderWaitlist(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-primary relative overflow-hidden scroll-mt">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full opacity-30" style="background: radial-gradient(circle, rgba(212,162,76,0.15) 0%, transparent 70%);"></div>
        <div class="relative max-w-3xl mx-auto px-6 lg:px-8 text-center z-10">
          <span class="inline-block font-body font-bold text-xs text-gold uppercase tracking-widest bg-gold/10 px-3 py-1.5 rounded-full mb-5">${esc(d.section_title)}</span>
          <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-white mb-4">${esc(d.section_subtitle)}</h2>
          <p class="font-body text-base md:text-lg text-white/85 leading-relaxed max-w-xl mx-auto mb-10">${esc(d.body_text)}</p>
          <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto relative z-20" onsubmit="event.preventDefault(); this.innerHTML = '<p class=\\'font-body text-gold font-bold w-full p-4 bg-gold/10 rounded-xl\\'>Received. You are on the list.</p>';">
            <input type="email" placeholder="Your email address" required class="flex-1 h-12 px-5 bg-white/10 rounded-xl border border-white/20 font-body text-sm text-white focus:outline-none focus:border-gold transition-colors">
            <button type="submit" class="h-12 px-6 bg-gold text-primary font-headline font-bold text-sm rounded-xl hover:bg-gold-dim transition-colors whitespace-nowrap">${esc(d.button_text || 'Join')}</button>
          </form>
        </div>
      </section>`;
  }

  // Define Renderer Map
  const RENDERERS = { 
    hero: renderHero, 
    stats: renderStats, 
    features: renderFeatures, 
    steps: renderSteps, 
    text_block: renderTextBlock,       // <-- Added
    testimonials: renderTestimonials,  // <-- Added
    pwa_install: renderPwaInstall,     // <-- Added
    pricing: renderPricing, 
    waitlist: renderWaitlist, 
    socials: () => '', 
    custom: (d, id) => `<section data-cms-id="${id}">${d.html_content || ''}</section>` 
  };

  // ─── CORE RENDERING LOGIC ───

  function renderSections(sectionsList) {
    const visible = sectionsList.filter(s => s.is_visible !== false).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    const pageSections = visible.filter(s => s.section_type !== 'socials');
    
    container.innerHTML = pageSections.map(s => {
      const renderer = RENDERERS[s.section_type] || RENDERERS.custom;
      return renderer(s.data || {}, s.id);
    }).join('');
    
    if(document.querySelector('[data-stat-metric]')) loadLiveStats();
  }

  async function loadPage() {
    const { data: tiers } = await supabaseClient.from('subscription_tiers').select('*').order('sort_order', { ascending: true });
    if (tiers) allTiers = tiers;

    const { data, error } = await supabaseClient.from('landing_sections').select('*').order('sort_order', { ascending: true });
    if (!error && data) renderSections(data);
  }

  // ─── CLICK TO EDIT (PREVIEW MODE) ───
  if (isPreview) {
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CMS_UPDATE') {
        allTiers = event.data.tiers || allTiers;
        renderSections(event.data.sections || []);
      }
    });

    // Enforce capture phase to guarantee clicks are intercepted
    window.addEventListener('click', (e) => {
      const sectionEl = e.target.closest('section[data-cms-id]');
      if (sectionEl) {
        e.preventDefault();
        e.stopPropagation();
        const cmsId = sectionEl.getAttribute('data-cms-id');
        window.parent.postMessage({ type: 'CMS_SELECT_SECTION', id: cmsId }, '*');
      }
    }, true); 

    window.parent?.postMessage({ type: 'PREVIEW_READY' }, '*');
  }

  // ─── LIVE STATS LOGIC ───
  async function loadLiveStats() {
    const nodes = document.querySelectorAll('[data-stat-metric]');
    if (!nodes.length) return;
    
    let warriors = 0, shares = 0, countries = 0;
    try {
      const [pRes, sRes, cRes] = await Promise.all([
        supabaseClient.from('profiles').select('id', { count: 'exact', head: true }),
        supabaseClient.from('shares').select('id', { count: 'exact', head: true }),
        supabaseClient.from('profiles').select('country').not('country', 'is', null)
      ]);
      warriors = pRes.count || 0;
      shares = sRes.count || 0;
      const countrySet = new Set();
      (cRes.data || []).forEach(r => { if (r.country) countrySet.add(r.country); });
      countries = countrySet.size;
    } catch (e) { console.error(e); }

    const map = { warriors, shares, countries };

    nodes.forEach(el => {
      const metric = el.getAttribute('data-stat-metric');
      const fallback = parseInt(el.getAttribute('data-stat-fallback') || '0', 10);
      let value = map[metric];
      if (!value || value === 0) value = fallback;
      animateStat(el, Number(value) || 0, 1500);
    });
  }

  function animateStat(el, target, duration) {
    if (!el) return;
    let start = 0; const step = Math.max(target / (duration / 16), 1);
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { start = target; clearInterval(timer); }
      el.textContent = Math.floor(start).toLocaleString();
    }, 16);
  }

  loadPage();
</script>

</body>
