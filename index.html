  // ─── HEADER / FOOTER RENDERERS ───

  // ─── PAGE SECTION RENDERERS (unchanged logic) ───

      <section data-cms-id="${id}" id="home" class="relative min-h-[90vh] flex flex-col justify-end overflow-hidden pt-[72px]">

        <div class="relative z-10 w-full max-w-3xl mx-auto px-6 pb-20 pt-32 text-center">
          <h1 class="font-headline font-extrabold text-4xl md:text-6xl text-white leading-tight tracking-tight mb-5" style="text-shadow:0 2px 20px rgba(0,0,0,0.6);">

  function renderStats(d, id) {

          <div class="grid grid-cols-1 md:grid-cols-${Math.min(items.length, 4)} gap-5">

  function renderSteps(d, id) {

      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-white scroll-mt">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="space-y-16 lg:space-y-20 mb-16">
            ${(d.items || []).map((item, i) => `
              <div class="grid md:grid-cols-2 gap-8 lg:gap-12 items-center">
                <div class="${i % 2 !== 0 ? 'md:order-2' : ''} rounded-[28px] overflow-hidden shadow-lifted">
                  <img src="${esc(item.image)}" class="w-full h-72 object-cover bg-cream">

                <div class="${i % 2 !== 0 ? 'md:order-1' : ''}">
                  <span class="font-headline font-extrabold text-6xl text-primary/30 leading-none block mb-2">0${i+1}</span>
                  <h3 class="font-headline font-bold text-2xl md:text-3xl text-text-dark mb-3">${esc(item.title)}</h3>
                  <p class="font-body text-base text-text-muted leading-relaxed">${esc(item.description)}</p>
                </div>

        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-12">
            <span class="font-body font-bold text-xs text-primary-light uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-white mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${(d.items || []).map((item) => `
              <div class="bg-white/[0.06] border border-white/10 rounded-[28px] p-8 hover:bg-white/10 hover:border-primary/30 transition-all">

  function renderPwaInstall(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-white scroll-mt">
        <div class="max-w-5xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-12">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>

              <h4 class="font-headline font-bold text-xl text-text-dark mb-4 flex items-center gap-3">

              </h4>
              <p class="font-body text-text-muted leading-relaxed text-sm">${(d.ios_text || '1. Open in Safari\\n2. Tap Share\\n3. Add to Home Screen').replace(/\n/g, '<br>')}</p>
            </div>
            <div class="bg-cream rounded-[28px] p-8 border-t-4 border-action shadow-natural">
              <h4 class="font-headline font-bold text-xl text-text-dark mb-4 flex items-center gap-3">
                <span class="text-2xl">🤖</span> Android
              </h4>
              <p class="font-body text-text-muted leading-relaxed text-sm">${(d.android_text || '1. Open in Chrome\\n2. Tap Menu (⋮)\\n3. Install App').replace(/\n/g, '<br>')}</p>
            </div>
          </div>
        </div>
      </section>`;
  }

  function parseFeatures(features) {
    let raw = [];
    if (Array.isArray(features)) raw = features;
    else if (typeof features === 'string') {
      const t = features.trim();
      if (t.startsWith('[') || t.startsWith('{')) {
        try { raw = JSON.parse(t); } catch (e) { raw = []; }
      } else if (t) {
        raw = t.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      }
    }
    if (!Array.isArray(raw)) raw = [raw];
    return raw.map(f => {
      if (!f) return null;
      if (typeof f === 'string') return f.trim();
      if (typeof f === 'number') return String(f);
      if (f.included === false || f.is_included === false || f.active === false || f.checked === false) return null;
      const txt = f.text || f.label || f.name || f.title || f.feature || f.description || '';
      return typeof txt === 'string' ? txt.trim() : String(txt);
    }).filter(Boolean);
  }

  function renderPricing(d, id) {
    const activeTiers = (d.tier_ids || []).map(tid => {
      const key = String(tid).toLowerCase().trim();
      return allTiers.find(t => String(t.id) === String(tid) || String(t.name||'').toLowerCase().trim() === key || String(t.slug||'').toLowerCase().trim() === key);
    }).filter(Boolean);

    if (activeTiers.length === 0) return '';

    return `
      <section data-cms-id="${id}" id="pricing" class="py-20 lg:py-24 bg-cream scroll-mt">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <span class="font-body font-bold text-xs text-primary uppercase tracking-widest mb-3 block">${esc(d.section_title)}</span>
            <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-text-dark mb-4">${esc(d.section_subtitle)}</h2>
          </div>
          <div class="grid md:grid-cols-${Math.min(activeTiers.length, 3)} gap-8 max-w-5xl mx-auto items-stretch">
            ${activeTiers.map((t, idx) => {
              const isPopular = activeTiers.length > 1 && idx === 1;
              const isFree = !t.price || Number(t.price) === 0;
              const nameLower = String(t.name || '').toLowerCase();
              const isComingSoon = nameLower.includes('commander') || nameLower.includes('coming');
              const tierImg = t.image_url || t.tier_image || t.image;
              const validFeatures = parseFeatures(t.features);

              if (isPopular) {
                return `
                <div class="bg-primary text-white rounded-[32px] p-8 sm:p-9 flex flex-col justify-between shadow-lifted relative transform md:-translate-y-2">
                  <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-action text-white text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full">Most Popular</div>
                  <div>
                    <div class="flex items-center justify-center gap-3 mb-2 mt-2">
                      ${tierImg ? `<img src="${esc(tierImg)}" class="w-8 h-8 rounded-full object-cover ring-2 ring-white/30">` : ''}
                      <h3 class="font-headline font-extrabold text-2xl text-white text-center">${esc(t.name)}</h3>
                    </div>
                    <p class="font-body text-sm text-white/80 text-center mb-6">${esc(t.description || '')}</p>
                    <div class="text-center mb-6">
                      <span class="font-headline font-extrabold text-5xl text-white">${isFree ? '$0' : '$' + Number(t.price).toFixed(2)}</span>
                      <span class="font-body text-base text-white/80">/${t.interval || t.billing_interval || 'month'}</span>
                    </div>
                    <ul class="space-y-3.5 mb-8">
                      ${validFeatures.map(fText => `
                        <li class="flex items-center gap-3">
                          <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold text-white flex-shrink-0">✓</span>
                          <span class="font-body text-sm text-white leading-snug">${esc(fText)}</span>
                        </li>`).join('')}
                    </ul>
                  </div>
                  <a href="${isFree ? '/app/signup.html' : (t.checkout_url || '/app/signup.html')}" class="block text-center bg-white hover:bg-slate-50 text-primary font-headline font-bold text-sm px-6 py-3.5 rounded-full shadow-sm hover:scale-[1.02] transition-all relative z-20">
                    ${isFree ? 'Get started free' : 'Start with ' + esc(t.name)}
                  </a>
                </div>`;
              }

              return `
                <div class="bg-white text-text-dark rounded-[32px] p-8 sm:p-9 flex flex-col justify-between border border-[#ECE9E0] shadow-natural hover:shadow-lifted transition-shadow">
                  <div>
                    <div class="flex items-center justify-center gap-3 mb-2 relative">
                      ${tierImg ? `<img src="${esc(tierImg)}" class="w-8 h-8 rounded-full object-cover">` : ''}
                      <h3 class="font-headline font-extrabold text-2xl text-text-dark text-center">${esc(t.name)}</h3>
                      ${isComingSoon ? `<span class="absolute -top-1 right-0 bg-[#D7E6F3] text-[#2B5876] text-[10px] font-bold px-3 py-1 rounded-full">Coming Soon</span>` : ''}
                    </div>
                    <p class="font-body text-sm text-text-muted text-center mb-6">${esc(t.description || '')}</p>
                    <div class="text-center mb-6">
                      <span class="font-headline font-extrabold text-5xl text-text-dark">${isFree ? '$0' : '$' + Number(t.price).toFixed(2)}</span>
                      <span class="font-body text-base text-text-muted">/${t.interval || t.billing_interval || 'month'}</span>
                    </div>
                    <ul class="space-y-3.5 mb-8">
                      ${validFeatures.map(fText => `
                        <li class="flex items-center gap-3">
                          <span class="w-5 h-5 rounded-full bg-[#ECE9E0] flex items-center justify-center text-xs font-bold text-text-dark flex-shrink-0">✓</span>
                          <span class="font-body text-sm text-text-dark leading-snug">${esc(fText)}</span>
                        </li>`).join('')}
                    </ul>
                  </div>
                  <a href="${isComingSoon ? '#' : (isFree ? '/app/signup.html' : (t.checkout_url || '/app/signup.html'))}"
                     class="block text-center font-headline font-bold text-sm px-6 py-3.5 rounded-full transition-all relative z-20 ${
                       isComingSoon ? 'bg-[#F6F5F0] text-[#A1A1AA] cursor-not-allowed' : 'bg-[#EFEEE7] hover:bg-[#E5E3D8] text-text-dark hover:scale-[1.02]'
                     }">
                    ${isComingSoon ? 'Notify me when ready' : (isFree ? 'Get started free' : 'Start with ' + esc(t.name))}
                  </a>
                </div>`;
            }).join('')}
          </div>
          <p class="text-center text-xs font-semibold text-text-light mt-12">
            All paid plans include a 7-day free trial. No credit card required for Free tier.
          </p>
        </div>
      </section>`;
  }

  function renderWaitlist(d, id) {
    return `
      <section data-cms-id="${id}" class="py-20 lg:py-24 bg-primary relative overflow-hidden scroll-mt">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] rounded-full opacity-30" style="background: radial-gradient(circle, rgba(244,103,83,0.15) 0%, transparent 70%);"></div>
        <div class="relative max-w-3xl mx-auto px-6 lg:px-8 text-center z-10">
          <span class="inline-block font-body font-bold text-xs text-white uppercase tracking-widest bg-white/10 px-3 py-1.5 rounded-full mb-5">${esc(d.section_title)}</span>
          <h2 class="font-headline font-extrabold text-3xl md:text-5xl text-white mb-4">${esc(d.section_subtitle)}</h2>
          <p class="font-body text-base md:text-lg text-white/85 leading-relaxed max-w-xl mx-auto mb-10">${esc(d.body_text)}</p>
          <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto relative z-20" onsubmit="event.preventDefault(); this.innerHTML = '<p class=\\'font-body text-white font-bold w-full p-4 bg-white/10 rounded-full\\'>Received. You are on the list.</p>';">
            <input type="email" placeholder="Your email address" required class="flex-1 h-12 px-5 bg-white/10 rounded-full border border-white/20 font-body text-sm text-white focus:outline-none focus:border-white transition-colors">
            <button type="submit" class="h-12 px-6 bg-white text-primary font-headline font-bold text-sm rounded-full hover:bg-cream transition-colors whitespace-nowrap">${esc(d.button_text || 'Join')}</button>
          </form>
        </div>
      </section>`;
  }

  const RENDERERS = {
    header: renderHeader,
    footer: renderFooter,
    hero: renderHero,
    stats: renderStats,
    features: renderFeatures,
    steps: renderSteps,
    text_block: renderTextBlock,
    testimonials: renderTestimonials,
    pwa_install: renderPwaInstall,
    pricing: renderPricing,
    waitlist: renderWaitlist,
    socials: () => '',
    custom: (d, id) => `<section data-cms-id="${id}">${d.html_content || ''}</section>`
  };

  function renderAll(sectionsList) {
    allSections = sectionsList || [];
    const visible = allSections.filter(s => s.is_visible !== false).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

    const headerSec = visible.find(s => s.section_type === 'header');
    const footerSec = visible.find(s => s.section_type === 'footer');
    const pageSections = visible.filter(s => !['header', 'footer', 'socials'].includes(s.section_type));

    // Header
    if (headerSec && headerSec.is_visible !== false) {
      headerMount.innerHTML = renderHeader(headerSec.data || {}, headerSec.id);
    } else {
      headerMount.innerHTML = renderHeader({}, 'header-fallback');
    }

    // Main page sections
    container.innerHTML = pageSections.map(s => {
      const renderer = RENDERERS[s.section_type] || RENDERERS.custom;
      return renderer(s.data || {}, s.id);
    }).join('');

    // Footer
    if (footerSec && footerSec.is_visible !== false) {
      footerMount.innerHTML = renderFooter(footerSec.data || {}, footerSec.id);
    } else {
      footerMount.innerHTML = renderFooter({}, 'footer-fallback');
    }

    loadFooterSocials();
    if (document.querySelector('[data-stat-metric]')) loadLiveStats();
  }

  async function loadFooterSocials() {
    const el = document.getElementById('footer-socials');
    if (!el) return;
    try {
      const { data: platforms } = await supabaseClient
        .from('platforms')
        .select('name, url')
        .eq('is_active', true);
      if (!platforms || !platforms.length) return;
      el.innerHTML = platforms.filter(p => p.url).map(p => `
        <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"
           class="w-9 h-9 rounded-full bg-white/10 border border-white/15 flex items-center justify-center text-white/70 hover:text-white hover:bg-white/20 transition-all"
           aria-label="${esc(p.name)}">
          <span class="text-xs font-bold">${esc((p.name || '?').slice(0, 2).toUpperCase())}</span>
        </a>
      `).join('');
    } catch (e) {}
  }

  async function loadPage() {
    const { data: tiers } = await supabaseClient.from('subscription_tiers').select('*').order('sort_order', { ascending: true });
    if (tiers) allTiers = tiers;

    const { data, error } = await supabaseClient.from('landing_sections').select('*').order('sort_order', { ascending: true });
    if (!error && data) renderAll(data);
    else renderAll([]);
  }

  if (isPreview) {
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CMS_UPDATE') {
        allTiers = event.data.tiers || allTiers;
        renderAll(event.data.sections || []);
      }
    });

    window.addEventListener('click', (e) => {
      const sectionEl = e.target.closest('[data-cms-id]');
      if (sectionEl) {
        e.preventDefault();
        e.stopPropagation();
        window.parent.postMessage({ type: 'CMS_SELECT_SECTION', id: sectionEl.getAttribute('data-cms-id') }, '*');
      }
    }, true);

    window.parent?.postMessage({ type: 'PREVIEW_READY' }, '*');
  }

  async function loadLiveStats() {
    const nodes = document.querySelectorAll('[data-stat-metric]');
    if (!nodes.length) return;
    const statsMap = {};
    try {
      const { data: dbStats, error } = await supabaseClient.from('analytics').select('id, value');
      if (!error && dbStats) dbStats.forEach(row => { statsMap[row.id] = Number(row.value) || 0; });
    } catch (e) {}
    nodes.forEach(el => {
      const metric = el.getAttribute('data-stat-metric');
      const fallback = parseInt(el.getAttribute('data-stat-fallback') || '0', 10);
      let value = statsMap[metric];
      if (value === undefined || value === null) value = fallback;
      animateStat(el, Number(value) || 0, 1500);
    });
  }

  function animateStat(el, target, duration) {
    if (!el) return;
    let start = 0; const step = Math.max(target / (duration / 16), 1);
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { start = target; clearInterval(timer); }
      el.textContent = Math.floor(start).toLocaleString();
    }, 16);
  }

  loadPage();
</script>
</body>
</html>
