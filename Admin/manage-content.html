<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Builder — GSTW Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','surface-chigh':'#e9e8e1','surface-chighest':'#e3e3db',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'inverse-surface':'#0e0e0c','inverse-on-surface':'#9e9d99',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'secondary':'#41637c','on-secondary':'#f6f9ff',
            'secondary-container':'#cae6ff',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'primary-dim':'#305678','secondary-dim':'#355670','tertiary-dim':'#9d2621',
            'sidebar-bg':'#0e0e0c','sidebar-hover':'#1a1a18','sidebar-active':'#3d6285',
          },
          fontFamily:{ 'headline':['Plus Jakarta Sans','sans-serif'], 'body':['Manrope','sans-serif'] },
          boxShadow:{ 'ambient':'0 20px 40px rgba(49,51,46,0.05)', 'ambient-sm':'0 8px 24px rgba(49,51,46,0.04)', 'float':'0 20px 40px rgba(49,51,46,0.08)' },
        },
      },
    }
  </script>
  <style>
    body{font-family:'Manrope',sans-serif;background:#fbf9f4;color:#31332e;letter-spacing:-0.005em}
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(49,51,46,0.15);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(49,51,46,0.3)}
    .sidebar{background:#0e0e0c;color:#f7f9ff}
    .sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:rgba(247,249,255,0.6);font-size:13px;font-weight:600;transition:all 0.15s ease;text-decoration:none}
    .sidebar-item:hover{background:#1a1a18;color:#f7f9ff}
    .sidebar-item.active{background:#3d6285;color:#f7f9ff}
    .sidebar-item .material-symbols-outlined{font-size:20px}
    .section-card{background:#fff;border:1px solid #e9e8e1;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all 0.15s ease;position:relative}
    .section-card:hover{border-color:#b2b2ab;box-shadow:0 4px 12px rgba(49,51,46,0.04)}
    .section-card.active{border-color:#3d6285;box-shadow:0 0 0 2px rgba(61,98,133,0.15)}
    .section-card.hidden-section{opacity:0.45}
    .section-card .drag-handle{cursor:grab;color:#b2b2ab;transition:color 0.15s}
    .section-card .drag-handle:hover{color:#5e6059}
    .section-card .drag-handle:active{cursor:grabbing}
    .field-group{margin-bottom:16px}
    .field-label{display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#5e6059;margin-bottom:6px}
    .field-input{width:100%;padding:9px 12px;background:#fbf9f4;border:1px solid #e3e3db;border-radius:8px;font-family:'Manrope',sans-serif;font-size:13px;color:#31332e;transition:border-color 0.15s}
    .field-input:focus{outline:none;border-color:#3d6285;background:#fff}
    .field-textarea{width:100%;padding:9px 12px;background:#fbf9f4;border:1px solid #e3e3db;border-radius:8px;font-family:'Manrope',sans-serif;font-size:13px;color:#31332e;resize:vertical;min-height:80px;transition:border-color 0.15s}
    .field-textarea:focus{outline:none;border-color:#3d6285;background:#fff}
    .field-hint{font-size:11px;color:#7a7b75;margin-top:4px}
    .modal-overlay{position:fixed;inset:0;background:rgba(14,14,12,0.5);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
    .modal-overlay.open{opacity:1;pointer-events:auto}
    .modal-box{background:#fff;border-radius:16px;width:90%;max-width:640px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(12px);transition:transform 0.2s}
    .modal-overlay.open .modal-box{transform:translateY(0)}
    .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.03em}
    .chip-hero{background:#b0d5fe33;color:#234a6c}
    .chip-features{background:#cae6ff33;color:#355670}
    .chip-about{background:#d4edda33;color:#155724}
    .chip-testimonials{background:#fff3cd33;color:#856404}
    .chip-pricing{background:#f8d7da33;color:#721c24}
    .chip-cta{background:#e2d9f333;color:#4a2d7a}
    .chip-faq{background:#d1ecf133;color:#0c5460}
    .chip-gallery{background:#fde2e233;color:#9d2621}
    .chip-custom{background:#e9e8e133;color:#5e6059}
    .img-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid #e9e8e1;cursor:pointer;transition:border-color 0.15s}
    .img-thumb:hover{border-color:#3d6285}
    .img-thumb.selected{border-color:#3d6285;box-shadow:0 0 0 2px rgba(61,98,133,0.3)}
    .repeater-item{background:#fbf9f4;border:1px solid #e9e8e1;border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
    .repeater-item .remove-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#7a7b75;cursor:pointer;transition:all 0.15s}
    .repeater-item .remove-btn:hover{background:#f8d7da;color:#ad332b}
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all 0.3s ease}
    .toast.show{transform:translateY(0);opacity:1}
    .toast-success{background:#31332e;color:#f7f9ff}
    .toast-error{background:#ad332b;color:#fff7f6}
    .spin{animation:spin 1s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#7a7b75}
  </style>
</head>

<body class="min-h-screen flex">

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar fixed left-0 top-0 h-screen w-64 flex flex-col p-4 z-40 hidden md:flex">
  <div class="mb-6 px-2 pt-2">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl overflow-hidden flex-shrink-0">
        <img src="/images/icon/icon-light-512.png" alt="GSTW" class="w-full h-full object-contain">
      </div>
      <div>
        <h1 class="font-headline font-bold text-white" style="font-size:15px;letter-spacing:-0.02em;">Command</h1>
        <p class="text-white/40 font-body" style="font-size:9px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;">Admin Panel</p>
      </div>
    </div>
  </div>
  <nav class="flex flex-col gap-1 flex-1 overflow-y-auto">
    <a href="index.html" class="sidebar-item"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>

  </nav>

<div id="sidebarOverlay" class="fixed inset-0 bg-inverse-surface/60 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<main class="flex-1 md:ml-64 min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 bg-surface/85 backdrop-blur-xl border-b border-surface-chigh">
    <div class="flex items-center gap-4 px-6 lg:px-8 py-4">
      <button onclick="toggleSidebar()" class="md:hidden text-on-surface"><span class="material-symbols-outlined">menu</span></button>
      <div class="flex-1 min-w-0">
        <h2 class="font-headline font-bold text-on-surface" style="font-size:22px;">Page Builder</h2>
        <p class="font-body text-on-surface-variant" style="font-size:12px;">Manage landing page sections & styles</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="togglePreview()" id="previewToggleBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-surface-cl border border-surface-chigh text-on-surface-variant hover:text-on-surface font-body font-semibold transition-all" style="font-size:12px;">
          <span class="material-symbols-outlined" style="font-size:16px;">visibility</span><span id="previewToggleText">Show Preview</span>
        </button>
        <button onclick="openLivePage()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-surface-cl border border-surface-chigh text-on-surface-variant hover:text-on-surface font-body font-semibold transition-all" style="font-size:12px;">
          <span class="material-symbols-outlined" style="font-size:16px;">open_in_new</span>Open Live
        </button>
        <button onclick="saveAllSections()" id="saveBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-lg signature-gradient text-on-primary font-headline font-semibold hover:shadow-ambient-sm transition-all" style="font-size:13px;">
          <span class="material-symbols-outlined" style="font-size:16px;">save</span><span id="saveBtnText">Save Changes</span>
        </button>
      </div>
    </div>
  </header>

  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <!-- LEFT PANEL: Sections -->
    <div class="w-full lg:w-80 xl:w-96 flex-shrink-0 border-r border-surface-chigh bg-surface-clow/50 flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-surface-chigh">
        <h3 class="font-headline font-bold text-on-surface" style="font-size:14px;">Active Sections</h3>
        <button onclick="openAddSectionModal()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary text-on-primary font-body font-semibold" style="font-size:11px;">
          <span class="material-symbols-outlined" style="font-size:14px;">add</span>Add
        </button>
      </div>
      <div id="sectionList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>

    <!-- MIDDLE PANEL: Editor -->
    <div class="flex-1 min-w-0 overflow-y-auto bg-surface">
      <div id="editorPanel">
        <div class="empty-state h-full min-h-[400px]">
          <span class="material-symbols-outlined text-outline-variant" style="font-size:48px;">web</span>
          <p class="font-headline font-bold text-on-surface-variant mt-4" style="font-size:16px;">Select a section to edit</p>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Preview -->
    <div id="previewPanel" class="hidden lg:w-[45%] xl:w-[50%] flex-shrink-0 border-l border-surface-chigh bg-surface-clow flex-col overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-surface-chigh bg-surface-cl">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size:18px;">devices</span>
          <span class="font-headline font-bold text-on-surface" style="font-size:13px;">Live Preview</span>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="setPreviewSize('mobile')" id="previewMobile" class="w-8 h-8 rounded-md hover:bg-surface-c text-outline"><span class="material-symbols-outlined" style="font-size:16px;">smartphone</span></button>
          <button onclick="setPreviewSize('desktop')" id="previewDesktop" class="w-8 h-8 rounded-md bg-primary/10 text-primary"><span class="material-symbols-outlined" style="font-size:16px;">desktop_windows</span></button>
          <button onclick="refreshPreview()" class="w-8 h-8 rounded-md hover:bg-surface-c text-outline"><span class="material-symbols-outlined" style="font-size:16px;">refresh</span></button>
        </div>
      </div>
      <div class="flex-1 overflow-auto bg-surface-c p-4 flex items-start justify-center">
        <iframe id="previewFrame" src="about:blank" class="bg-white shadow-float rounded-lg transition-all duration-300" style="width:100%;height:100%;min-height:600px;border:none;"></iframe>
      </div>
    </div>
  </div>
</main>

<!-- MODALS -->
<div id="addSectionModal" class="modal-overlay" onclick="if(event.target===this)closeAddSectionModal()">
  <div class="modal-box">
    <div class="flex items-center justify-between px-6 py-4 border-b border-surface-chigh">
      <h3 class="font-headline font-bold text-on-surface" style="font-size:16px;">Add Component</h3>
      <button onclick="closeAddSectionModal()" class="w-8 h-8 rounded-lg hover:bg-surface-c text-outline"><span class="material-symbols-outlined" style="font-size:20px;">close</span></button>
    </div>
    <div class="p-6 overflow-y-auto"><div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="sectionTypeGrid"></div></div>
  </div>
</div>

<div id="imagePickerModal" class="modal-overlay" onclick="if(event.target===this)closeImagePicker()">
  <div class="modal-box" style="max-width:720px">
    <div class="flex items-center justify-between px-6 py-4 border-b border-surface-chigh">
      <h3 class="font-headline font-bold text-on-surface" style="font-size:16px;">Pick Media</h3>
      <button onclick="closeImagePicker()" class="w-8 h-8 rounded-lg hover:bg-surface-c text-outline"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-6 overflow-y-auto"><div id="imagePickerGrid" class="grid grid-cols-4 sm:grid-cols-6 gap-3"></div></div>
    <div class="px-6 py-4 border-t border-surface-chigh flex justify-end gap-2">
      <button onclick="closeImagePicker()" class="px-4 py-2 rounded-lg bg-surface-c text-on-surface font-body font-semibold text-xs">Cancel</button>
      <button onclick="confirmImagePick()" class="px-4 py-2 rounded-lg signature-gradient text-on-primary font-body font-semibold text-xs">Use Selection</button>
    </div>
  </div>
</div>

<div id="tierPickerModal" class="modal-overlay" onclick="if(event.target===this)closeTierPicker()">
  <div class="modal-box" style="max-width:560px">
    <div class="flex items-center justify-between px-6 py-4 border-b border-surface-chigh">
      <h3 class="font-headline font-bold text-on-surface" style="font-size:16px;">Select Tiers</h3>
      <button onclick="closeTierPicker()" class="w-8 h-8 rounded-lg hover:bg-surface-c text-outline"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-6 overflow-y-auto"><div id="tierPickerList" class="space-y-2"></div></div>
    <div class="px-6 py-4 border-t flex justify-end gap-2">
      <button onclick="closeTierPicker()" class="px-4 py-2 rounded-lg bg-surface-c text-xs font-semibold">Cancel</button>
      <button onclick="confirmTierPick()" class="px-4 py-2 rounded-lg signature-gradient text-white text-xs font-semibold">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" class="toast toast-success"></div>

<script>
// ─── INIT SUPABASE & STATE ──────────────────────────────────
const supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

let sections = [], activeSectionId = null, mediaLibrary = [], allTiers = [];
let imagePickerTarget = null, tierPickerTarget = null, selectedImageId = null, selectedTierIds = [];
let previewOpen = false, previewLoaded = false, previewTimer = null;

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function markDirty() { const b = $('saveBtnText'); if(b) b.textContent = 'Save Changes *'; clearTimeout(previewTimer); previewTimer = setTimeout(pushPreviewUpdate, 400); }
let toastTimer=null; function showToast(m,t='success'){const x=$('toast');if(!x)return;x.textContent=m;x.className='toast toast-'+t+' show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),3500);}

// ─── NAVIGATION & PREVIEW HANDLERS ─────────────────────────
function toggleSidebar() {
  const sidebar = $('sidebar');
  const overlay = $('sidebarOverlay');
  if (sidebar) sidebar.classList.toggle('hidden');
  if (overlay) overlay.classList.toggle('hidden');
}

function handleLogout() {
  supabaseClient.auth.signOut().then(() => {
    window.location.href = '/login.html';
  });
}

function openLivePage() {
  window.open('/index.html', '_blank');
}

function togglePreview() {
  previewOpen = !previewOpen;
  const panel = $('previewPanel');
  const text  = $('previewToggleText');
  if (!panel) return;

  if (previewOpen) {
    panel.classList.remove('hidden');
    panel.classList.add('flex');
    if (text) text.textContent = 'Hide Preview';

    const frame = $('previewFrame');
    if (frame && !previewLoaded) {
      previewLoaded = true;
      frame.addEventListener('load', () => setTimeout(pushPreviewUpdate, 200));
      frame.src = '/index.html?preview=1';
    } else {
      setTimeout(pushPreviewUpdate, 150);
    }
  } else {
    panel.classList.add('hidden');
    panel.classList.remove('flex');
    if (text) text.textContent = 'Show Preview';
  }
}

function setPreviewSize(size) {
  const frame = $('previewFrame');
  if (!frame) return;
  ['previewMobile', 'previewDesktop'].forEach(id => {
    const btn = $(id);
    if (!btn) return;
    btn.classList.remove('bg-primary/10', 'text-primary');
    btn.classList.add('text-outline');
  });
  const active = $('preview' + size.charAt(0).toUpperCase() + size.slice(1));
  if (active) {
    active.classList.add('bg-primary/10', 'text-primary');
    active.classList.remove('text-outline');
  }

  if (size === 'mobile') { frame.style.width = '390px'; frame.style.maxWidth = '390px'; }
  else { frame.style.width = '100%'; frame.style.maxWidth = 'none'; }
}

function refreshPreview() {
  const frame = $('previewFrame');
  if (!frame) return;
  frame.src = '/index.html?preview=1&t=' + Date.now();
}

function pushPreviewUpdate() {
  if (!previewOpen) return;
  collectEditorData();
  const frame = $('previewFrame');
  if (frame && frame.contentWindow) {
    const mediaMap = {};
    mediaLibrary.forEach(m => mediaMap[m.id] = m.url);
    frame.contentWindow.postMessage({
      type: 'CMS_UPDATE',
      sections: JSON.parse(JSON.stringify(sections)),
      mediaMap: mediaMap,
      tiers: allTiers
    }, '*');
  }
}

window.addEventListener('message', (event) => {
  if (event.data?.type === 'CMS_SELECT_SECTION') {
    const id = event.data.id;
    if (id) {
      selectSection(id);
      const card = document.querySelector(`.section-card[onclick*="${id}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }
});

// ─── DYNAMIC STYLE ENGINE UI ────────────────────────────────
function fieldStyleHTML(d, prefix, type = 'text') {
  const val = (k) => d[prefix+'_'+k] || '';
  const sel = (k, v) => val(k) === v ? 'selected' : '';
  
  if (type === 'text') {
    return `
      <div class="mt-2 p-3 bg-surface-c rounded-lg grid grid-cols-2 md:grid-cols-4 gap-2 hidden border border-surface-chigh" id="style_${prefix}">
        <select class="field-input text-xs !py-1.5" data-field="${prefix}_size" onchange="markDirty()">
          <option value="">Auto Size</option><option value="sm" ${sel('size','sm')}>Small</option><option value="base" ${sel('size','base')}>Base</option><option value="lg" ${sel('size','lg')}>Large</option><option value="2xl" ${sel('size','2xl')}>XL</option><option value="4xl" ${sel('size','4xl')}>2XL</option><option value="6xl" ${sel('size','6xl')}>Huge</option>
        </select>
        <select class="field-input text-xs !py-1.5" data-field="${prefix}_color" onchange="markDirty()">
          <option value="">Auto Color</option><option value="primary" ${sel('color','primary')}>Primary Blue</option><option value="tertiary" ${sel('color','tertiary')}>Tertiary Red</option><option value="white" ${sel('color','white')}>White</option><option value="on-surface-variant" ${sel('color','on-surface-variant')}>Muted</option>
        </select>
        <select class="field-input text-xs !py-1.5" data-field="${prefix}_font" onchange="markDirty()">
          <option value="">Auto Font</option><option value="headline" ${sel('font','headline')}>Sans (Bold)</option><option value="quote" ${sel('font','quote')}>Serif (Lora)</option><option value="body" ${sel('font','body')}>Body (Manrope)</option>
        </select>
        <select class="field-input text-xs !py-1.5" data-field="${prefix}_align" onchange="markDirty()">
          <option value="">Auto Align</option><option value="left" ${sel('align','left')}>Left</option><option value="center" ${sel('align','center')}>Center</option><option value="right" ${sel('align','right')}>Right</option>
        </select>
      </div>`;
  } else {
    return `
      <div class="mt-2 p-3 bg-surface-c rounded-lg grid grid-cols-2 gap-2 hidden border border-surface-chigh" id="style_${prefix}">
        <select class="field-input text-xs !py-1.5" data-field="${prefix}_variant" onchange="markDirty()">
          <option value="">Gradient (Default)</option><option value="primary" ${sel('variant','primary')}>Solid Primary</option><option value="tertiary" ${sel('variant','tertiary')}>Solid Red</option><option value="outline" ${sel('variant','outline')}>Outline</option><option value="ghost" ${sel('variant','ghost')}>Ghost Base</option>

function fieldText(label, field, d, hint = '') {

}

function fieldCta(label, field, d) {

function fieldImage(label, field, d) {

// ─── INITIALIZATION ────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await loadMediaLibrary();
  await loadTiers();
  await loadSections();
});

async function loadSections() {
  const { data, error } = await supabaseClient.from('landing_sections').select('*').order('sort_order', { ascending: true });
  if (error) return;
  sections = (data || []).map(s => ({ ...s, data: s.data || {} }));
  renderSectionList();
}

async function loadMediaLibrary() {
  try {
    let { data } = await supabaseClient.from('media').select('*').eq('type', 'landing page').order('created_at', { ascending: false }).limit(200);
    if (!data || data.length === 0) {
      const all = await supabaseClient.from('media').select('*').order('created_at', { ascending: false }).limit(200);
      data = all.data;
    }
    mediaLibrary = (data || []).map(m => ({ ...m, url: m.url || m.thumbnail_url || '', name: m.label || m.name || 'image', type: m.type || '' }))
      .filter(m => !!m.url);
  } catch (err) { mediaLibrary = []; }
}
async function loadTiers() {
  const { data } = await supabaseClient.from('tiers').select('*').order('sort_order', { ascending: true });
  if (data) allTiers = data;
}

// ─── CMS RENDERERS ─────────────────────────────────────────
function renderSectionList() {
  const container = $('sectionList');
  if (!container) return;
  container.innerHTML = sections.map((s, i) => {
    const t = SECTION_TYPES[s.section_type] || SECTION_TYPES.custom;
    return `
      <div class="section-card ${s.id === activeSectionId ? 'active' : ''} ${!s.is_visible ? 'hidden-section' : ''}" onclick="selectSection('${s.id}')" draggable="true" ondragstart="dragIndex=${i}" ondragover="event.preventDefault()" ondrop="onDrop(event, ${i})">
        <div class="flex items-center gap-2.5">
          <span class="material-symbols-outlined drag-handle" style="font-size:18px;">drag_indicator</span>
          <span class="material-symbols-outlined text-on-surface-variant" style="font-size:18px;">${t.icon}</span>
          <div class="flex-1 min-w-0"><p class="font-headline font-bold text-[13px]">${escapeHtml(s.title||t.label)}</p><span class="chip ${t.chipClass} mt-0.5">${t.label}</span></div>
          <div class="flex items-center gap-1">
            <button onclick="event.stopPropagation(); toggleVisibility('${s.id}')" class="w-7 h-7 rounded-md hover:bg-surface-c"><span class="material-symbols-outlined" style="font-size:16px">${!s.is_visible?'visibility_off':'visibility'}</span></button>
            <button onclick="event.stopPropagation(); deleteSection('${s.id}')" class="w-7 h-7 rounded-md hover:bg-red-50 text-outline-variant hover:text-tertiary"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function selectSection(id) { activeSectionId = id; renderSectionList(); renderEditor(); }

  const panel = $('editorPanel');
  if (!panel) return;
  const s = sections.find(x => x.id === activeSectionId);

  const type = SECTION_TYPES[s.section_type] || SECTION_TYPES.custom;
  const d = s.data || {};
  let fieldsHTML = '';

  switch (s.section_type) {
    case 'hero':
      fieldsHTML = `
        <div class="grid grid-cols-2 gap-4">
          <div class="field-group"><label class="field-label">Layout</label><select class="field-input" data-field="layout" onchange="markDirty()"><option value="right-aligned" ${(d.layout||'right-aligned')==='right-aligned'?'selected':''}>Right-Aligned (Editorial)</option><option value="centered" ${d.layout==='centered'?'selected':''}>Centered (Bold)</option></select></div>
          <div class="field-group"><label class="field-label">Overlay</label><select class="field-input" data-field="overlay_style" onchange="markDirty()"><option value="light" ${(d.overlay_style||'light')==='light'?'selected':''}>Light Wash (Pastel)</option><option value="dark" ${d.overlay_style==='dark'?'selected':''}>Dark Gradient</option></select></div>
        </div>
        ${fieldText('Main Headline', 'headline', d)}
        ${fieldText('Subheadline line', 'subheadline', d)}
        <hr class="border-surface-chigh my-5"><p class="field-label font-bold text-primary mb-2">Scripture Focus Block</p>
        ${fieldText('Intro Line', 'scripture_intro', d)}
        ${fieldTextarea('Quote Text', 'scripture_quote', d, '', 2)}
        ${fieldText('Reference', 'scripture_ref', d)}
        <hr class="border-surface-chigh my-5">
        <div class="grid grid-cols-2 gap-4">${fieldCta('Primary', 'cta', d)} ${fieldCta('Secondary', 'secondary_cta', d)}</div>
        ${fieldImage('Background Image', 'background_image', d)}`; break;
    case 'stats': fieldsHTML = `${fieldText('Stat 1 Label', 'label_1', d)} ${fieldText('Stat 2 Label', 'label_2', d)} ${fieldText('Stat 3 Label', 'label_3', d)}`; break;
    case 'features':
    case 'steps':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)}
        <div class="field-group"><label class="field-label">Cards/Steps</label><div id="repeater-${s.section_type}-items">${(d.items||[]).map((item, i) => cardItemHTML(s.section_type, i, item)).join('')}</div><button onclick="addRepeaterItem('${s.section_type}','items',cardItemHTML)" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-surface-c text-[11px] font-bold"><span class="material-symbols-outlined text-[14px]">add</span>Add Block</button></div>`; break;
    case 'text_block':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)} ${fieldTextarea('Body Paragraphs', 'body_text', d, 'Use Enter for new paragraphs', 6)} ${fieldCta('Action', 'cta', d)}`; break;
    case 'testimonials':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)}
        <div class="field-group"><label class="field-label">Testimonials</label><div id="repeater-testimonials-items">${(d.items||[]).map((item, i) => testimonialItemHTML(i, item)).join('')}</div><button onclick="addRepeaterItem('testimonials','items',testimonialItemHTML)" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-surface-c text-[11px] font-bold"><span class="material-symbols-outlined text-[14px]">add</span>Add Witness</button></div>`; break;
    case 'pricing':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)}
        <div class="field-group"><label class="field-label">Tiers</label><button onclick="openTierPicker()" class="px-3 py-1.5 rounded-lg bg-surface-c text-[11px] font-bold">Select Tiers</button></div>`; break;
    case 'pwa_install':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)} ${fieldTextarea('iOS Instructions', 'ios_text', d, '', 2)} ${fieldTextarea('Android Instructions', 'android_text', d, '', 2)}`; break;
    case 'waitlist':
      fieldsHTML = `${fieldText('Section Eyebrow', 'section_title', d)} ${fieldText('Main Headline', 'section_subtitle', d)} ${fieldTextarea('Body', 'body_text', d, '', 3)} ${fieldText('Button Text', 'button_text', d)}`; break;
    case 'socials':
      fieldsHTML = `<div class="field-group"><label class="field-label">Footer Socials</label><div id="repeater-socials-items">${(d.items||[]).map((item, i) => socialItemHTML(i, item)).join('')}</div><button onclick="addSocialItem()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-surface-c text-[11px] font-bold"><span class="material-symbols-outlined text-[14px]">add</span>Add Platform</button></div>`; break;
    case 'custom': fieldsHTML = `${fieldTextarea('HTML', 'html_content', d, '', 8)}`; break;
  }

  panel.innerHTML = `<div class="p-6 lg:p-8 max-w-3xl"><div class="flex items-center gap-3 mb-6"><span class="material-symbols-outlined text-primary text-[24px]">${type.icon}</span><div><h3 class="font-headline font-bold text-[18px]">${escapeHtml(s.title||type.label)}</h3><span class="chip ${type.chipClass}">${type.label}</span></div></div><div class="bg-surface-cl rounded-2xl p-6 shadow-ambient-sm">${fieldText('Admin Label', 'title', s)}<hr class="border-surface-chigh my-5">${fieldsHTML}</div></div>`;

// ─── REPEATERS & HELPERS ───────────────────────────────────
function cardItemHTML(type, i, item = {}) {
  return `<div class="repeater-item" data-index="${i}"><div class="remove-btn" onclick="removeRepeaterItem('${type}','items',${i})"><span class="material-symbols-outlined text-[14px]">close</span></div><div class="field-group"><label class="field-label">Image URL</label><div class="flex gap-2"><input type="text" class="field-input flex-1" data-repeater="${type}-items-${i}-image" value="${escapeAttr(item.image||'')}" oninput="markDirty()"><button onclick="openImagePicker('${type}-items-${i}-image', true)" class="px-3 py-2 bg-surface-chigh rounded-lg text-xs font-bold">Pick</button></div></div><div class="grid grid-cols-2 gap-3"><input type="text" class="field-input" data-repeater="${type}-items-${i}-title" value="${escapeAttr(item.title||'')}" placeholder="Title" oninput="markDirty()"><input type="text" class="field-input" data-repeater="${type}-items-${i}-description" value="${escapeAttr(item.description||'')}" placeholder="Description" oninput="markDirty()"></div></div>`;
}

function testimonialItemHTML(i, item = {}) {
  return `<div class="repeater-item" data-index="${i}"><div class="remove-btn" onclick="removeRepeaterItem('testimonials','items',${i})"><span class="material-symbols-outlined text-[14px]">close</span></div><textarea class="field-textarea mb-2" data-repeater="testimonials-items-${i}-quote" rows="2" placeholder="Quote..." oninput="markDirty()">${escapeHtml(item.quote||'')}</textarea><div class="grid grid-cols-3 gap-3"><input type="text" class="field-input" data-repeater="testimonials-items-${i}-author" value="${escapeAttr(item.author||'')}" placeholder="Author" oninput="markDirty()"><input type="text" class="field-input" data-repeater="testimonials-items-${i}-role" value="${escapeAttr(item.role||'')}" placeholder="Role" oninput="markDirty()"><input type="text" class="field-input" data-repeater="testimonials-items-${i}-avatar" value="${escapeAttr(item.avatar||'')}" placeholder="Avatar URL" oninput="markDirty()"></div></div>`;
}

function socialItemHTML(i, item = {}) {
  const p = item.platform || 'instagram';
  const opts = ['instagram','facebook','x','youtube','tiktok','linkedin','whatsapp','telegram','threads','snapchat','truthsocial'].map(x => `<option value="${x}" ${p===x?'selected':''}>${x}</option>`).join('');
  return `<div class="repeater-item" data-index="${i}"><div class="remove-btn" onclick="removeRepeaterItem('socials','items',${i})"><span class="material-symbols-outlined text-[14px]">close</span></div><div class="grid grid-cols-3 gap-3"><select class="field-input" data-repeater="socials-items-${i}-platform" onchange="markDirty()">${opts}</select><input type="text" class="field-input" data-repeater="socials-items-${i}-label" value="${escapeAttr(item.label||'')}" placeholder="Label" oninput="markDirty()"><input type="url" class="field-input" data-repeater="socials-items-${i}-url" value="${escapeAttr(item.url||'')}" placeholder="https://" oninput="markDirty()"></div></div>`;
}

function addRepeaterItem(type, key, fn) {
  const s = sections.find(x => x.id === activeSectionId);
  if(!s||!s.data)return; if(!s.data[key])s.data[key]=[];
  const i = s.data[key].length; s.data[key].push({});
  const c = $(`repeater-${type}-${key}`);
  if(c){ try { c.insertAdjacentHTML('beforeend', fn(type, i, {})); } catch(e) { c.insertAdjacentHTML('beforeend', fn(i, {})); } }
  markDirty();
}

function addSocialItem() {
  const s = sections.find(x => x.id === activeSectionId);
  if(!s)return; if(!s.data)s.data={}; if(!s.data.items)s.data.items=[];
  s.data.items.push({ platform: 'instagram', label: 'Instagram', url: '' });
  renderEditor(); markDirty();
}

function removeRepeaterItem(type, key, i) {
  const s = sections.find(x => x.id === activeSectionId);
  if(s&&s.data&&s.data[key]){ s.data[key].splice(i,1); renderEditor(); markDirty(); }
}

function collectEditorData() {
  const s = sections.find(x => x.id === activeSectionId);
  if(!s||!s.data)return;
  document.querySelectorAll('[data-field]').forEach(el => { if(el.dataset.field==='title') s.title=el.value; else s.data[el.dataset.field]=el.value; });
  const reps = document.querySelectorAll('[data-repeater]');
  if(reps.length > 0){
    const g = {};
    reps.forEach(el => {
      const p = el.dataset.repeater.split('-');
      const type = p[0], key = p[1], idx = p[2], f = p.slice(3).join('-');
      if(!g[key]) g[key]={}; if(!g[key][idx]) g[key][idx]={};
      g[key][idx][f] = el.value;
    });
    Object.keys(g).forEach(k => s.data[k] = Object.values(g[k]));
  }
}

// ─── CRUD & SYSTEM ─────────────────────────────────────────
function openAddSectionModal() { $('sectionTypeGrid').innerHTML = Object.entries(SECTION_TYPES).map(([k,t])=>`<button onclick="addSection('${k}')" class="flex flex-col items-center p-4 border rounded-xl hover:border-primary text-center"><span class="material-symbols-outlined text-primary text-[28px]">${t.icon}</span><span class="font-headline font-bold text-xs mt-2">${t.label}</span></button>`).join(''); $('addSectionModal').classList.add('open'); }
function closeAddSectionModal() { $('addSectionModal').classList.remove('open'); }
function addSection(type) { const t=SECTION_TYPES[type]; const id='temp-'+Date.now(); sections.push({id, section_type:type, title:t.label, data:JSON.parse(JSON.stringify(t.defaultData)), sort_order:sections.length, is_visible:true}); selectSection(id); closeAddSectionModal(); markDirty(); }
function toggleVisibility(id) { const s=sections.find(x=>x.id===id); if(s){ s.is_visible=!s.is_visible; renderSectionList(); markDirty(); } }
function deleteSection(id) { if(!confirm('Delete section?'))return; sections=sections.filter(x=>x.id!==id); if(activeSectionId===id){ activeSectionId=null; renderEmptyEditor(); } renderSectionList(); markDirty(); }
function onDrop(e, tIdx) { e.preventDefault(); if(dragIndex===null||dragIndex===tIdx)return; const [m]=sections.splice(dragIndex,1); sections.splice(tIdx,0,m); sections.forEach((x,i)=>x.sort_order=i); renderSectionList(); markDirty(); }

function openImagePicker(field, isRep=false) { imagePickerTarget={field, isRep}; $('imagePickerGrid').innerHTML=mediaLibrary.map(m=>`<div onclick="selectImage('${m.id}')" class="cursor-pointer group"><img src="${escapeAttr(m.url)}" class="img-thumb w-full h-20" id="imgpick-${m.id}"><p class="text-[9px] truncate mt-1">${escapeHtml(m.name)}</p></div>`).join(''); $('imagePickerModal').classList.add('open'); }
function selectImage(id) { selectedImageId=id; document.querySelectorAll('.img-thumb').forEach(e=>e.classList.remove('selected')); $(`imgpick-${id}`).classList.add('selected'); }
function confirmImagePick() {
  if(!selectedImageId||!imagePickerTarget)return; const m=mediaLibrary.find(x=>x.id===selectedImageId); if(!m)return;
  if(imagePickerTarget.isRep) { const i=document.querySelector(`input[data-repeater="${imagePickerTarget.field}"]`); if(i){ i.value=m.url; collectEditorData(); renderEditor(); markDirty(); } }
  else { const s=sections.find(x=>x.id===activeSectionId); if(s){ s.data[imagePickerTarget.field]=m.url; renderEditor(); markDirty(); } }
  closeImagePicker();
}
function closeImagePicker() { $('imagePickerModal').classList.remove('open'); }

function openTierPicker() {
  const s=sections.find(x=>x.id===activeSectionId); selectedTierIds=[...(s?.data?.tier_ids||[])];
  $('tierPickerList').innerHTML=allTiers.map(t=>`<label class="flex items-center gap-3 p-3 border rounded-lg"><input type="checkbox" value="${t.id}" ${selectedTierIds.includes(t.id)?'checked':''} onchange="toggleTierSelection('${t.id}')"><div><p class="font-bold text-[13px]">${escapeHtml(t.name)}</p></div></label>`).join('');
  $('tierPickerModal').classList.add('open');
}
function toggleTierSelection(id) { if(selectedTierIds.includes(id)) selectedTierIds=selectedTierIds.filter(x=>x!==id); else selectedTierIds.push(id); }
function confirmTierPick() { const s=sections.find(x=>x.id===activeSectionId); if(s){ s.data.tier_ids=[...selectedTierIds]; renderEditor(); markDirty(); } closeTierPicker(); }
function closeTierPicker() { $('tierPickerModal').classList.remove('open'); }
function removeTierFromSection(tid) { const s=sections.find(x=>x.id===activeSectionId); if(s){ s.data.tier_ids=(s.data.tier_ids||[]).filter(x=>x!==tid); renderEditor(); markDirty(); } }

async function saveAllSections() {
  collectEditorData(); $('saveBtn').disabled=true; $('saveBtnText').textContent='Saving...';
  try {
    for(let i=0;i<sections.length;i++){
      const s=sections[i]; s.sort_order=i; const p={section_type:s.section_type, title:s.title, data:s.data, sort_order:s.sort_order, is_visible:s.is_visible};
      if(String(s.id).startsWith('temp-')){ const {data}=await supabaseClient.from('landing_sections').insert(p).select().single(); s.id=data.id; }
      else { await supabaseClient.from('landing_sections').update(p).eq('id', s.id); }
    }
    const {data:dbSec}=await supabaseClient.from('landing_sections').select('id');
    if(dbSec){ const loc=new Set(sections.map(x=>x.id)); const del=dbSec.filter(x=>!loc.has(x.id)).map(x=>x.id); if(del.length) await supabaseClient.from('landing_sections').delete().in('id', del); }
    isDirty=false; $('saveBtnText').textContent='Save Changes'; renderSectionList(); showToast('Saved', 'success');
  } catch(e) { showToast(e.message, 'error'); $('saveBtnText').textContent='Save Changes *'; }
  finally { $('saveBtn').disabled=false; }
}

let dragIndex=null;
</script>
