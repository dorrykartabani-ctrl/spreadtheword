<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Quotes — GSTW Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'tertiary-container':'#fe6d60',
            'outline':'#7a7b75',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background: #fbf9f4; color: #31332e; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .filled { font-variation-settings: 'FILL' 1; }
    .signature-gradient { background: linear-gradient(135deg, #3d6285, #6b9bc3); }

    .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: rgba(247,249,255,0.6); font-size: 13px; font-weight: 600; text-decoration: none; }
    .sidebar-item:hover { background: #1a1a18; color: #f7f9ff; }
    .sidebar-item.active { background: #3d6285; color: #f7f9ff; }

    /* Quote Card - Z-Index Fix */
    .quote-card { background: #ffffff; border-radius: 16px; padding: 16px; display: flex; gap: 14px; transition: all 0.2s ease; position: relative; z-index: 1; overflow: visible; }
    .quote-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 50; }
    .quote-card.is-live { background: linear-gradient(135deg, #ffffff, #f5f4ed); box-shadow: 0 0 0 2px rgba(61,98,133,0.2); }
    
    .quote-thumb { width: 80px; height: 80px; border-radius: 12px; background: #efeee7; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .quote-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .quote-text-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }

    /* Action Menu - Z-Index Fix */
    .action-menu { position: absolute; top: 100%; right: 0; margin-top: 6px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); min-width: 200px; padding: 6px; z-index: 100; }
    .action-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: #31332e; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .action-item:hover { background: #f5f4ed; }
    .action-item.danger { color: #ad332b; }

    /* Badges & Chips */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge-live { background: rgba(61,98,133,0.15); color: #3d6285; }
    .badge-scheduled { background: rgba(65,99,124,0.12); color: #41637c; }
    .badge-library { background: #dcecff; color: #305678; }
    .badge-draft { background: #fff2cc; color: #8a6500; }
    .badge-archived { background: #e9e8e1; color: #7a7b75; }
    
    .meta-chip { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 99px; font-size: 10px; font-weight: 600; background: #f5f4ed; color: #5e6059; }
    .campaign-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; font-size: 10px; font-weight: 700; color: #ffffff; }
  </style>
</head>

<body class="min-h-screen flex">

<!-- SIDEBAR -->
<aside class="fixed left-0 top-0 h-screen w-64 flex flex-col p-4 z-40 hidden lg:flex" style="background:#0e0e0c;">
  <div class="mb-6 px-2 pt-2 flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl overflow-hidden bg-white"><img src="/images/icon/icon-light-512.png" class="w-full h-full object-contain"></div>
    <div>
      <h1 class="font-headline font-bold text-white text-[15px]">Command</h1>
      <p class="text-white/40 font-body text-[9px] font-bold tracking-widest uppercase">Admin Panel</p>
    </div>
  </div>
  <nav class="flex flex-col gap-1 flex-1 overflow-y-auto">
    <a href="index.html" class="sidebar-item"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
    <a href="quotes.html" class="sidebar-item"><span class="material-symbols-outlined">add_circle</span>Create Quote</a>
    <a href="manage-quotes.html" class="sidebar-item active"><span class="material-symbols-outlined">format_quote</span>Manage Quotes</a>
    <a href="schedule.html" class="sidebar-item"><span class="material-symbols-outlined">calendar_today</span>Schedule</a>
    <a href="campaigns.html" class="sidebar-item"><span class="material-symbols-outlined">campaign</span>Campaigns</a>
  </nav>
</aside>

<!-- MAIN CONTENT -->
<div class="flex-1 lg:ml-64 flex flex-col min-h-screen">
  <header class="sticky top-0 z-20 bg-surface/90 backdrop-blur-md border-b border-surface-c px-6 lg:px-8 py-4 flex items-center justify-between">
    <h2 class="font-headline font-bold text-on-surface text-2xl">Manage Quotes</h2>
    <a href="quotes.html" class="signature-gradient text-white font-headline font-bold rounded-xl px-4 py-2 flex items-center gap-2 text-sm shadow-sm hover:opacity-90">
      <span class="material-symbols-outlined text-[18px]">add</span>Create Quote
    </a>
  </header>

  <main class="p-6 lg:p-8 flex-1">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- FILTER BAR -->
      <section>
        <div class="bg-white rounded-xl p-4 flex flex-wrap items-center gap-3 border border-surface-c shadow-sm">
          <span class="font-bold text-[11px] text-outline uppercase tracking-widest">Filter:</span>
          
          <select id="filterStatus" class="form-input border border-surface-c rounded-lg px-3 py-2 text-sm w-36 bg-surface-clow" onchange="applyFilters()">
            <option value="">All Statuses</option>
            <option value="live">🚀 Live Now</option>
            <option value="scheduled">📅 Scheduled</option>
            <option value="library">📚 Library</option>
            <option value="draft">📝 Drafts</option>
            <option value="archived">📦 Archived</option>
          </select>

          <select id="filterCampaign" class="form-input border border-surface-c rounded-lg px-3 py-2 text-sm w-36 bg-surface-clow" onchange="applyFilters()">
            <option value="">All Campaigns</option>
          </select>

          <select id="filterCategory" class="form-input border border-surface-c rounded-lg px-3 py-2 text-sm w-36 bg-surface-clow" onchange="applyFilters()">
            <option value="">All Categories</option>
          </select>

          <button onclick="clearFilters()" class="px-3 py-2 text-xs font-bold text-tertiary hover:bg-tertiary/10 rounded-lg ml-auto">Clear Filters</button>
        </div>
      </section>

      <!-- LIVE SECTION -->
      <section id="liveSection">
        <h3 class="font-headline font-bold text-sm mb-3">Live Now</h3>
        <div id="liveContainer" class="space-y-3"></div>
      </section>

      <!-- DRAFTS SECTION -->
      <section id="draftsSection">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-headline font-bold text-sm">Drafts <span id="draftsBadge" class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full ml-1 hidden">0</span></h3>
        </div>
        <div id="draftsContainer" class="space-y-3"></div>
      </section>

      <!-- SCHEDULED SECTION -->
      <section id="scheduledSection">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-headline font-bold text-sm">Scheduled</h3>
          <span id="scheduledCount" class="text-xs font-bold text-outline"></span>
        </div>
        <div id="scheduledContainer" class="space-y-3"></div>
      </section>

      <!-- LIBRARY SECTION -->
      <section id="librarySection">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-headline font-bold text-sm">Library</h3>
          <span id="libraryCount" class="text-xs font-bold text-outline"></span>
        </div>
        <div id="libraryContainer" class="space-y-3"></div>
      </section>

      <!-- ARCHIVED SECTION -->
      <section class="pt-6 border-t border-surface-c text-center">
        <button onclick="toggleArchived()" id="archivedToggleBtn" class="px-5 py-2.5 bg-white border border-surface-c text-outline font-bold rounded-xl text-xs hover:bg-surface-clow transition-colors">
          <span id="archivedToggleLabel">Show Archived Quotes</span>
        </button>
      </section>

      <section id="archivedSection" class="hidden pb-10">
        <h3 class="font-headline font-bold text-sm text-outline mb-3">Archived</h3>
        <div id="archivedContainer" class="space-y-3"></div>
      </section>

    </div>
  </main>
</div>

<!-- TOAST & CONFIRM MODAL (Simplified for brevity) -->
<div id="toast" class="hidden fixed top-6 right-6 z-[200] bg-inverse-surface/90 backdrop-blur-md text-white font-body font-semibold px-5 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm transition-opacity">
  <span id="toastIcon" class="material-symbols-outlined text-emerald-400 text-lg filled">check_circle</span>
  <span id="toastMsg"></span>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

let allQuotes = [];
let campaignsMap = {};
let toastTimer;

async function init() {
  await loadCampaigns();
  await loadQuotes();
}

async function loadCampaigns() {
  const { data } = await supabaseClient.from('campaigns').select('*');
  const sel = document.getElementById('filterCampaign');
  if (data) {
    data.forEach(c => {
      campaignsMap[c.id] = c;
      sel.innerHTML += `<option value="${c.id}">${escapeHtml(c.name)}</option>`;
    });
  }
}

async function loadQuotes() {
  const { data, error } = await supabaseClient.from('quotes').select('*').order('updated_at', { ascending: false });
  if (error) return showToast('Failed to load quotes', true);
  allQuotes = data || [];
  populateCategories();
  applyFilters();
}

function populateCategories() {
  const sel = document.getElementById('filterCategory');
  const current = sel.value;
  let cats = [...new Set(allQuotes.map(q => q.category).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  sel.value = current;
}

function applyFilters() {
  const status = document.getElementById('filterStatus').value;
  const campaign = document.getElementById('filterCampaign').value;
  const category = document.getElementById('filterCategory').value;

  let filtered = allQuotes.filter(q => {
    if (status && q.status !== status) return false;
    if (campaign && q.campaign_id !== campaign) return false;
    if (category && q.category !== category) return false;
    return true;
  });

  const live = filtered.filter(q => q.status === 'live');
  const drafts = filtered.filter(q => (q.status || 'draft') === 'draft');
  const scheduled = filtered.filter(q => q.status === 'scheduled').sort((a,b) => new Date(a.scheduled_for||0) - new Date(b.scheduled_for||0));
  const library = filtered.filter(q => q.status === 'library');
  const archived = filtered.filter(q => q.status === 'archived');

  renderList('liveContainer', live, 'live', 'No quote is currently live');
  renderList('draftsContainer', drafts, 'draft', 'No drafts saved');
  renderList('scheduledContainer', scheduled, 'scheduled', 'No quotes scheduled');
  renderList('libraryContainer', library, 'library', 'No quotes in library');
  renderList('archivedContainer', archived, 'archived', 'No archived quotes');

  document.getElementById('draftsBadge').textContent = drafts.length;
  document.getElementById('draftsBadge').classList.toggle('hidden', drafts.length === 0);
  document.getElementById('scheduledCount').textContent = scheduled.length ? `${scheduled.length} queued` : '';
  document.getElementById('libraryCount').textContent = library.length ? `${library.length} saved` : '';

  showSection('liveSection', !status || status === 'live');
  showSection('draftsSection', !status || status === 'draft');
  showSection('scheduledSection', !status || status === 'scheduled');
  showSection('librarySection', !status || status === 'library');
  
  if(status === 'archived') {
    document.getElementById('archivedSection').classList.remove('hidden');
    document.getElementById('archivedToggleLabel').textContent = 'Hide Archived Quotes';
  }
}

function showSection(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

function renderList(containerId, quotes, type, emptyMsg) {
  const el = document.getElementById(containerId);
  if (!quotes.length) { el.innerHTML = `<div class="bg-white rounded-xl p-6 text-center border border-dashed border-surface-c text-xs text-outline">${emptyMsg}</div>`; return; }
  el.innerHTML = quotes.map(q => buildQuoteCard(q, type)).join('');
}

function buildQuoteCard(q, type) {
  const bg = q.background_url ? `<img src="${q.background_url}" class="w-full h-full object-cover">` : `<span class="material-symbols-outlined text-outline text-[24px]">image</span>`;
  
  const badges = {
    live: `<span class="badge badge-live"><span class="material-symbols-outlined filled text-[10px]">radio_button_checked</span> Live</span>`,
    scheduled: `<span class="badge badge-scheduled"><span class="material-symbols-outlined text-[10px]">schedule</span> Scheduled</span>`,
    draft: `<span class="badge badge-draft"><span class="material-symbols-outlined text-[10px]">draft</span> Draft</span>`,
    library: `<span class="badge badge-library"><span class="material-symbols-outlined text-[10px]">library_books</span> Library</span>`,
    archived: `<span class="badge badge-archived"><span class="material-symbols-outlined text-[10px]">archive</span> Archived</span>`
  };
  
  let info = '';
  if (type === 'live' && q.published_at) info = `Since ${new Date(q.published_at).toLocaleDateString()}`;
  else if (type === 'scheduled' && q.scheduled_for) info = new Date(q.scheduled_for).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  else if (q.updated_at || q.created_at) info = `${type==='archived'?'Archived':'Saved'} ${new Date(q.updated_at || q.created_at).toLocaleDateString()}`;

  let campHtml = '';
  if (q.campaign_id && campaignsMap[q.campaign_id]) {
    const c = campaignsMap[q.campaign_id];
    campHtml = `<span class="campaign-chip" style="background:${c.color||'#3d6285'}"><span class="material-symbols-outlined filled text-[11px]">${c.icon||'campaign'}</span>${escapeHtml(c.name)}</span>`;
  }

  // Z-Index fix applied to inline styles here to guarantee it doesn't get overwritten
  return `
    <div class="quote-card border border-surface-c ${type==='live'?'is-live':''}">
      <div class="quote-thumb">${bg}</div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-center mb-2">
          <div class="flex gap-2 items-center">${badges[type]} <span class="text-[11px] font-bold text-outline">${info}</span></div>
          <div class="relative">
            <button onclick="toggleMenu('${q.id}', event)" class="w-8 h-8 rounded-lg hover:bg-surface-clow text-outline flex items-center justify-center"><span class="material-symbols-outlined text-[18px]">more_vert</span></button>
            <div id="menu-${q.id}" class="action-menu hidden">
              <a href="quotes.html?edit=${q.id}" class="action-item"><span class="material-symbols-outlined">edit</span> Edit & Recall</a>
              ${type !== 'live' ? `<div class="action-item" onclick="changeStatus('${q.id}', 'live')"><span class="material-symbols-outlined">bolt</span> Publish Live</div>` : ''}
              ${type !== 'library' ? `<div class="action-item" onclick="changeStatus('${q.id}', 'library')"><span class="material-symbols-outlined">library_books</span> Send to Library</div>` : ''}
              ${type !== 'draft' ? `<div class="action-item" onclick="changeStatus('${q.id}', 'draft')"><span class="material-symbols-outlined">draft</span> Revert to Draft</div>` : ''}
              <div class="action-item danger" onclick="deleteQuote('${q.id}')"><span class="material-symbols-outlined">delete</span> Delete</div>
            </div>
          </div>
        </div>
        <p class="font-headline font-bold text-[14px] quote-text-clamp mb-1">"${escapeHtml(q.text)}"</p>
        <p class="font-body font-bold text-[12px] text-primary mb-2">— ${escapeHtml(q.source)}</p>
        <div class="flex gap-2 items-center">
          ${q.category ? `<span class="meta-chip">${escapeHtml(q.category)}</span>` : ''}
          ${campHtml}
        </div>
      </div>
    </div>`;
}

function toggleMenu(id, e) {
  e.stopPropagation();
  document.querySelectorAll('.action-menu').forEach(m => { if(m.id !== 'menu-'+id) m.classList.add('hidden') });
  const m = document.getElementById('menu-'+id);
  if(m) {
    m.classList.toggle('hidden');
    // Elevate z-index of parent card when menu opens
    const card = m.closest('.quote-card');
    document.querySelectorAll('.quote-card').forEach(c => c.style.zIndex = '1');
    if(!m.classList.contains('hidden')) card.style.zIndex = '50';
  }
}
document.addEventListener('click', () => { 
  document.querySelectorAll('.action-menu').forEach(m => m.classList.add('hidden')); 
  document.querySelectorAll('.quote-card').forEach(c => c.style.zIndex = '1');
});

function toggleArchived() {
  const s = document.getElementById('archivedSection');
  const isHidden = s.classList.contains('hidden');
  s.classList.toggle('hidden');
  document.getElementById('archivedToggleLabel').textContent = isHidden ? 'Hide Archived Quotes' : 'Show Archived Quotes';
}

async function changeStatus(id, newStatus) {
  try {
    if(newStatus === 'live') {
      await supabaseClient.from('quotes').update({status:'library'}).eq('status','live');
    }
    const payload = { status: newStatus, updated_at: new Date().toISOString() };
    if(newStatus === 'live') payload.published_at = new Date().toISOString();
    
    await supabaseClient.from('quotes').update(payload).eq('id', id);
    showToast(`Moved to ${newStatus}`);
    loadQuotes();
  } catch (e) { showToast('Error updating status', true); }
}

async function deleteQuote(id) {
  if(!confirm('Delete this quote permanently?')) return;
  await supabaseClient.from('quotes').delete().eq('id', id);
  showToast('Quote deleted');
  loadQuotes();
}

function clearFilters() {
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterCampaign').value = '';
  document.getElementById('filterCategory').value = '';
  applyFilters();
}

function escapeHtml(str) { return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#039;'}[m])); }
function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = isErr ? 'error' : 'check_circle';
  document.getElementById('toastIcon').className = `material-symbols-outlined text-lg filled ${isErr?'text-red-400':'text-emerald-400'}`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}

init();
</script>
</body>
</html>
