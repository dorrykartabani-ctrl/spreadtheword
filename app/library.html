<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f6fa">
  <title>Library — Go Spread The Word</title>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','surface-chigh':'#e9e8e1','surface-chighest':'#e3e3db',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'inverse-surface':'#0e0e0c','inverse-on-surface':'#9e9d99',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'secondary':'#41637c','secondary-container':'#cae6ff',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'primary-dim':'#305678','secondary-dim':'#355670','tertiary-dim':'#9d2621',
            'background':'#fbf9f4','on-background':'#31332e',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
            'quote':['Lora','serif'],
          },
          boxShadow:{
            'ambient':'0 20px 40px rgba(49,51,46,0.05)',
            'ambient-sm':'0 8px 24px rgba(49,51,46,0.04)',
            'float':'0 20px 40px rgba(49,51,46,0.08)',
          },
        },
      },
    }
  </script>

  <style>
    *{box-sizing:border-box}
    body{
      font-family:'Manrope',sans-serif;background:#f2f6fa;color:#31332e;
      -webkit-tap-highlight-color:transparent;overflow-y:auto;
      min-height:100dvh;user-select:none;margin:0;letter-spacing:-0.005em;
    }
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .font-quote{font-family:'Lora',serif}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}

    ::-webkit-scrollbar{display:none}
    body{-ms-overflow-style:none;scrollbar-width:none}

    .glass-header{
      background:rgba(242,246,250,0.92);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    .header-btn{
      width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
      justify-content:center;color:#5e6059;transition:all 0.15s ease;
    }
    .header-btn:hover{background:#f5f4ed}
    .header-btn:active{transform:scale(0.9)}

    .filter-scroll{
      display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;-ms-overflow-style:none;padding:0 16px;
    }
    .filter-scroll::-webkit-scrollbar{display:none}

    .filter-chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 16px;border-radius:99px;
      font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;
      white-space:nowrap;flex-shrink:0;
      transition:all 0.2s ease;
      background:#ffffff;color:#5e6059;
      border:1.5px solid #e9e8e1;
    }
    .filter-chip:active{transform:scale(0.95)}
    .filter-chip.active{
      background:#3d6285;color:#f7f9ff;border-color:#3d6285;
    }
    .filter-chip .material-symbols-outlined{font-size:16px}

    .quote-card{
      background:#ffffff;border-radius:20px;padding:16px;
      box-shadow:0 4px 12px rgba(49,51,46,0.06);
      transition:all 0.2s ease;position:relative;
    }
    .quote-card:active{transform:scale(0.98)}

    .quote-badge{
      display:inline-flex;align-items:center;gap:4px;
      padding:4px 10px;border-radius:99px;
      font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.03em;
    }
    .badge-live{background:rgba(61,98,133,0.12);color:#234a6c}
    .badge-scheduled{background:rgba(201,162,39,0.12);color:#8a6e1f}
    .badge-archived{background:rgba(122,123,117,0.12);color:#5e6059}

    .campaign-badge{
      background:linear-gradient(135deg,rgba(61,98,133,0.15),rgba(107,155,195,0.15));
      border:1px solid rgba(61,98,133,0.2);
      padding:6px 12px;border-radius:99px;
      font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;
      color:#234a6c;display:inline-flex;align-items:center;gap:5px;
      margin-top:8px;
    }

    .reward-badge{
      background:linear-gradient(135deg,#F0C55A,#D4AF37);
      padding:4px 10px;border-radius:99px;
      font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;
      color:#31332e;display:inline-flex;align-items:center;gap:4px;
      margin-top:6px;
    }

    .quote-actions{
      display:flex;align-items:center;gap:8px;margin-top:12px;
      padding-top:12px;border-top:1px solid #f5f4ed;
    }

    .action-btn{
      display:flex;align-items:center;gap:6px;
      padding:8px 14px;border-radius:12px;
      font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;
      transition:all 0.15s ease;flex:1;justify-content:center;
    }
    .action-btn:active{transform:scale(0.95)}
    .action-btn-primary{background:#3d6285;color:#f7f9ff}
    .action-btn-secondary{background:#f5f4ed;color:#31332e}
    .action-btn-disabled{background:#e9e8e1;color:#b2b2ab;pointer-events:none}

    .like-btn{
      width:36px;height:36px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:#f5f4ed;color:#5e6059;transition:all 0.2s ease;
    }
    .like-btn:active{transform:scale(0.9)}
    .like-btn.liked{background:#fdeaee;color:#ad332b}
    .like-btn.liked .material-symbols-outlined{font-variation-settings:'FILL' 1}

    .empty-state{
      text-align:center;padding:60px 20px;
    }
    .empty-state-icon{
      width:80px;height:80px;border-radius:20px;
      background:linear-gradient(135deg,#f5f4ed,#efeee7);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 16px;
    }

    .scheduled-overlay{
      position:absolute;top:0;left:0;right:0;bottom:0;
      background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);
      border-radius:20px;display:flex;align-items:center;justify-content:center;
      z-index:10;
    }

    .scheduled-notice{
      background:#ffffff;border-radius:16px;padding:16px 20px;
      box-shadow:0 8px 24px rgba(49,51,46,0.12);
      max-width:280px;text-align:center;
    }

    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .quote-card{animation:fadeIn 0.3s ease-out both}
    .quote-card:nth-child(1){animation-delay:0s}
    .quote-card:nth-child(2){animation-delay:0.05s}
    .quote-card:nth-child(3){animation-delay:0.1s}
    .quote-card:nth-child(4){animation-delay:0.15s}
    .quote-card:nth-child(5){animation-delay:0.2s}
  </style>
</head>

<body>

<!-- HEADER -->
<header class="glass-header fixed top-0 w-full z-50">
  <div class="max-w-[430px] mx-auto px-4 pt-10 pb-3 flex items-center justify-between">
    <button onclick="goBack()" class="header-btn">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </button>
    <span class="font-headline font-bold text-on-surface" style="font-size:15px;">Library</span>
    <div class="w-10"></div>
  </div>

  <!-- FILTERS -->
  <div class="pb-3">
    <div class="filter-scroll" id="filterScroll">
      <button onclick="filterBy('all')" class="filter-chip active" data-filter="all">
        <span class="material-symbols-outlined">grid_view</span>
        All
      </button>
      <button onclick="filterBy('shared')" class="filter-chip" data-filter="shared">
        <span class="material-symbols-outlined">share</span>
        Shared
      </button>
      <button onclick="filterBy('liked')" class="filter-chip" data-filter="liked">
        <span class="material-symbols-outlined">favorite</span>
        Liked
      </button>
      <!-- Campaign filters added dynamically -->
      <button onclick="filterBy('archived')" class="filter-chip" data-filter="archived">
        <span class="material-symbols-outlined">inventory_2</span>
        Archives
      </button>
    </div>
  </div>
</header>

<!-- CONTENT -->
<div class="max-w-[430px] mx-auto pt-32 pb-24 px-4">
  
  <!-- Loading State -->
  <div id="loadingState" class="empty-state">
    <div class="empty-state-icon">
      <span class="material-symbols-outlined text-primary text-[36px]">history_edu</span>
    </div>
    <p class="font-body text-on-surface-variant" style="font-size:14px;">Loading your library...</p>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state hidden">
    <div class="empty-state-icon">
      <span class="material-symbols-outlined text-outline text-[36px]">auto_stories</span>
    </div>
    <h3 class="font-headline font-bold text-on-surface mb-2" style="font-size:18px;">No quotes found</h3>
    <p class="font-body text-on-surface-variant" style="font-size:14px;">Try a different filter or check back later</p>
  </div>

  <!-- Quotes Grid -->
  <div id="quotesGrid" class="space-y-3"></div>

</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var currentUser = null
var allQuotes = []
var userShares = []
var userLikes = []
var activeCampaigns = []
var campaignRewards = {}
var currentFilter = 'all'

function haptic(type){
  if(!navigator.vibrate) return
  try{
    if(type==='light') navigator.vibrate(10)
    else if(type==='medium') navigator.vibrate(20)
    else if(type==='success') navigator.vibrate([15,40,15])
  }catch(e){}
}

async function init(){
  var session = await supabaseClient.auth.getSession()
  if(!session.data.session){
    window.location.href = 'login.html'
    return
  }
  currentUser = session.data.session.user
  
  await Promise.all([
    loadQuotes(),
    loadUserData(),
    loadCampaigns()
  ])
  
  renderCampaignFilters()
  renderQuotes()
}

async function loadQuotes(){
  try{
    // Get ALL quotes (past, present, scheduled)
    var {data, error} = await supabaseClient
      .from('quotes')
      .select('*')
      .order('published_at', {ascending: false})
    
    if(error) throw error
    allQuotes = data || []
  }catch(e){
    console.error('Load quotes error:', e)
    allQuotes = []
  }
}

async function loadUserData(){
  if(!currentUser) return
  
  try{
    // Load shares
    var {data: shares} = await supabaseClient
      .from('shares')
      .select('quote_id')
      .eq('user_id', currentUser.id)
    userShares = shares ? shares.map(s => s.quote_id) : []
    
    // Load likes
    var {data: likes} = await supabaseClient
      .from('likes')
      .select('quote_id')
      .eq('user_id', currentUser.id)
    userLikes = likes ? likes.map(l => l.quote_id) : []
  }catch(e){
    console.error('Load user data error:', e)
  }
}

async function loadCampaigns(){
  try{
    var now = new Date().toISOString()
    
    // Get active campaigns or campaigns with scheduled quotes
    var {data: campaigns} = await supabaseClient
      .from('campaigns')
      .select('*')
      .or('status.eq.active,status.eq.scheduled')
    
    if(!campaigns) return
    
    // Filter to only show campaigns that are:
    // 1. Currently active, OR
    // 2. Have quotes scheduled in the future
    var validCampaigns = []
    
    for(var camp of campaigns){
      var isActive = camp.status === 'active' && 
                     new Date(camp.start_date) <= new Date(now) && 
                     new Date(camp.end_date) >= new Date(now)
      
      if(isActive){
        validCampaigns.push(camp)
        continue
      }
      
      // Check if has scheduled quotes
      var hasScheduled = allQuotes.some(q => 
        q.campaign_id === camp.id && 
        q.status === 'scheduled' &&
        new Date(q.published_at) > new Date(now)
      )
      
      if(hasScheduled){
        validCampaigns.push(camp)
      }
    }
    
    activeCampaigns = validCampaigns
    
    // Load rewards for each campaign
    for(var c of activeCampaigns){
      await loadCampaignRewards(c.id)
    }
  }catch(e){
    console.error('Load campaigns error:', e)
  }
}

async function loadCampaignRewards(campaignId){
  if(!currentUser) return
  
  try{
    var {data} = await supabaseClient
      .from('campaign_rewards')
      .select('*')
      .eq('campaign_id', campaignId)
      .eq('user_id', currentUser.id)
    
    if(data && data.length > 0){
      campaignRewards[campaignId] = data
    }
  }catch(e){
    console.error('Load rewards error:', e)
  }
}

function renderCampaignFilters(){
  if(activeCampaigns.length === 0) return
  
  var filterScroll = document.getElementById('filterScroll')
  var archiveBtn = filterScroll.querySelector('[data-filter="archived"]')
  
  activeCampaigns.forEach(function(camp){
    var btn = document.createElement('button')
    btn.className = 'filter-chip'
    btn.setAttribute('data-filter', 'campaign-' + camp.id)
    btn.onclick = function(){ filterBy('campaign-' + camp.id) }
    btn.innerHTML = '<span class="material-symbols-outlined">campaign</span>' + camp.name
    
    filterScroll.insertBefore(btn, archiveBtn)
  })
}

function getQuoteStatus(quote){
  var now = new Date()
  var pubDate = new Date(quote.published_at)
  
  if(quote.status === 'archived') return 'archived'
  if(pubDate > now) return 'scheduled'
  return 'live'
}

function isQuoteShareable(quote){
  var status = getQuoteStatus(quote)
  return status === 'live'
}

function filterQuotes(){
  var now = new Date().toISOString()
  
  if(currentFilter === 'all'){
    return allQuotes
  }
  
  if(currentFilter === 'shared'){
    return allQuotes.filter(q => userShares.includes(q.id))
  }
  
  if(currentFilter === 'liked'){
    return allQuotes.filter(q => userLikes.includes(q.id))
  }
  
  if(currentFilter === 'archived'){
    return allQuotes.filter(q => q.status === 'archived')
  }
  
  if(currentFilter.startsWith('campaign-')){
    var campId = currentFilter.replace('campaign-', '')
    return allQuotes.filter(q => q.campaign_id === campId)
  }
  
  return allQuotes
}

function renderQuotes(){
  var grid = document.getElementById('quotesGrid')
  var loading = document.getElementById('loadingState')
  var empty = document.getElementById('emptyState')
  
  loading.classList.add('hidden')
  
  var filtered = filterQuotes()
  
  if(filtered.length === 0){
    grid.innerHTML = ''
    empty.classList.remove('hidden')
    return
  }
  
  empty.classList.add('hidden')
  grid.innerHTML = ''
  
  filtered.forEach(function(quote){
    var card = createQuoteCard(quote)
    grid.appendChild(card)
  })
}

function createQuoteCard(quote){
  var card = document.createElement('div')
  card.className = 'quote-card'
  
  var status = getQuoteStatus(quote)
  var isLiked = userLikes.includes(quote.id)
  var isShared = userShares.includes(quote.id)
  var isShareable = isQuoteShareable(quote)
  
  var badgeHTML = ''
  if(status === 'live'){
    badgeHTML = '<span class="quote-badge badge-live"><span class="material-symbols-outlined filled" style="font-size:12px;">play_circle</span>Live</span>'
  }else if(status === 'scheduled'){
    badgeHTML = '<span class="quote-badge badge-scheduled"><span class="material-symbols-outlined" style="font-size:12px;">schedule</span>Scheduled</span>'
  }else if(status === 'archived'){
    badgeHTML = '<span class="quote-badge badge-archived"><span class="material-symbols-outlined" style="font-size:12px;">inventory_2</span>Archived</span>'
  }
  
  var campaignHTML = ''
  if(quote.campaign_id){
    var campaign = activeCampaigns.find(c => c.id === quote.campaign_id)
    if(campaign){
      campaignHTML = '<div class="campaign-badge"><span class="material-symbols-outlined filled" style="font-size:14px;">campaign</span>' + campaign.name + '</div>'
      
      // Add rewards if any
      var rewards = campaignRewards[campaign.id]
      if(rewards && rewards.length > 0){
        var totalPoints = rewards.reduce((sum, r) => sum + (r.points || 0), 0)
        if(totalPoints > 0){
          campaignHTML += '<div class="reward-badge"><span class="material-symbols-outlined filled" style="font-size:12px;">stars</span>+' + totalPoints + ' points earned</div>'
        }
      }
    }
  }
  
  var scheduledHTML = ''
  if(status === 'scheduled' && !isShareable){
    var schedDate = new Date(quote.published_at)
    var dateStr = schedDate.toLocaleDateString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})
    scheduledHTML = '<div class="scheduled-overlay"><div class="scheduled-notice"><span class="material-symbols-outlined text-primary text-[28px] mb-2">schedule</span><p class="font-headline font-bold text-on-surface mb-1" style="font-size:14px;">Coming Soon</p><p class="font-body text-on-surface-variant" style="font-size:12px;">Available ' + dateStr + '</p></div></div>'
  }
  
  card.innerHTML = 
    scheduledHTML +
    '<div class="flex items-start justify-between mb-3">' +
      '<div class="flex-1">' + badgeHTML + campaignHTML + '</div>' +
      '<button onclick="toggleLike(\'' + quote.id + '\')" class="like-btn ' + (isLiked ? 'liked' : '') + '" data-quote-id="' + quote.id + '"><span class="material-symbols-outlined text-[18px]">favorite</span></button>' +
    '</div>' +
    '<p class="font-quote text-on-surface leading-relaxed mb-2" style="font-size:15px;">' + escapeHtml(quote.text) + '</p>' +
    '<p class="font-body font-semibold text-on-surface-variant" style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">— ' + escapeHtml(quote.source || 'GSTW') + '</p>' +
    '<div class="quote-actions">' +
      '<button onclick="shareQuote(\'' + quote.id + '\')" class="action-btn ' + (isShareable ? 'action-btn-primary' : 'action-btn-disabled') + '"><span class="material-symbols-outlined text-[16px]">share</span>' + (isShared ? 'Share again' : 'Share') + '</button>' +
      '<button onclick="viewQuote(\'' + quote.id + '\')" class="action-btn action-btn-secondary"><span class="material-symbols-outlined text-[16px]">visibility</span>View</button>' +
    '</div>'
  
  return card
}

function escapeHtml(text){
  var div = document.createElement('div')
  div.textContent = text
  return div.innerHTML
}

async function toggleLike(quoteId){
  haptic('light')
  
  var isLiked = userLikes.includes(quoteId)
  var btn = document.querySelector('.like-btn[data-quote-id="' + quoteId + '"]')
  
  try{
    if(isLiked){
      // Unlike
      await supabaseClient
        .from('likes')
        .delete()
        .eq('user_id', currentUser.id)
        .eq('quote_id', quoteId)
      
      userLikes = userLikes.filter(id => id !== quoteId)
      if(btn) btn.classList.remove('liked')
    }else{
      // Like
      await supabaseClient
        .from('likes')
        .insert({user_id: currentUser.id, quote_id: quoteId})
      
      userLikes.push(quoteId)
      if(btn) btn.classList.add('liked')
      haptic('success')
    }
  }catch(e){
    console.error('Like error:', e)
    showToast('Could not update like')
  }
}

function shareQuote(quoteId){
  var quote = allQuotes.find(q => q.id === quoteId)
  if(!quote) return
  
  if(!isQuoteShareable(quote)){
    showToast('This quote is not available yet')
    return
  }
  
  haptic('medium')
  
  // Store quote data for editor
  sessionStorage.setItem('gstw_selected_quote_id', quote.id)
  sessionStorage.setItem('gstw_selected_quote_text', quote.text)
  sessionStorage.setItem('gstw_selected_quote_source', quote.source || 'GSTW')
  
  window.location.href = 'create.html'
}

function viewQuote(quoteId){
  var quote = allQuotes.find(q => q.id === quoteId)
  if(!quote) return
  
  haptic('light')
  
  // Store for viewing
  sessionStorage.setItem('gstw_view_quote_id', quote.id)
  sessionStorage.setItem('gstw_view_quote_text', quote.text)
  sessionStorage.setItem('gstw_view_quote_source', quote.source || 'GSTW')
  sessionStorage.setItem('gstw_view_quote_bg', quote.background_url || '')
  
  // For now, just go to create page in view mode
  // You can create a dedicated view page later if needed
  sessionStorage.setItem('gstw_selected_quote_id', quote.id)
  sessionStorage.setItem('gstw_selected_quote_text', quote.text)
  sessionStorage.setItem('gstw_selected_quote_source', quote.source || 'GSTW')
  
  window.location.href = 'create.html'
}

function filterBy(filter){
  haptic('light')
  currentFilter = filter
  
  // Update active state
  var chips = document.querySelectorAll('.filter-chip')
  chips.forEach(function(chip){
    if(chip.getAttribute('data-filter') === filter){
      chip.classList.add('active')
    }else{
      chip.classList.remove('active')
    }
  })
  
  renderQuotes()
}

function showToast(msg){
  var existing = document.getElementById('libToast')
  if(existing) existing.remove()
  
  var toast = document.createElement('div')
  toast.id = 'libToast'
  toast.className = 'fixed top-20 left-1/2 z-[200] bg-inverse-surface/90 backdrop-blur-md text-inverse-on-surface font-body font-semibold px-5 py-2.5 rounded-full whitespace-nowrap flex items-center gap-2 shadow-float'
  toast.style.transform = 'translateX(-50%)'
  toast.style.fontSize = '13px'
  toast.innerHTML = '<span class="material-symbols-outlined text-primary-container text-[14px] filled">info</span>' + msg
  
  document.body.appendChild(toast)
  setTimeout(function(){
    if(toast.parentNode) toast.remove()
  }, 2500)
}

function goBack(){
  window.location.href = 'index.html'
}

document.addEventListener('DOMContentLoaded', init)
</script>
