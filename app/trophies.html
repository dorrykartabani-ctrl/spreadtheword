<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Grand Sanctum — Trophy Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="badges-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#0f172a',
            'glass': 'rgba(255, 255, 255, 0.03)',
            'glass-edge': 'rgba(255, 255, 255, 0.1)',
            'mythic-gold': '#FFD700',
            'epic-purple': '#A35FD1'
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
    
    /* The Cabinet Look */
    .cabinet-shelf {
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border-top: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }
    
    .trophy-pedestal {
      perspective: 1000px;
      transition: all 0.4s ease;
    }
    
    .trophy-item {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
    }
    
    .trophy-item:hover { transform: rotateY(10deg) translateY(-10px); }

    /* Rarity Glows (God Rays) */
    .glow-common { filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
    .glow-rare { filter: drop-shadow(0 0 15px rgba(59,130,246,0.3)); }
    .glow-epic { filter: drop-shadow(0 0 20px rgba(163,95,209,0.4)); }
    .glow-mythic { 
      filter: drop-shadow(0 0 25px rgba(255,215,0,0.5));
      animation: mythic-float 3s ease-in-out infinite alternate;
    }

    @keyframes mythic-float {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Glass Panels */
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
    }

    /* Sub Badges (Hanging Medals) */
    .hanging-medal {
      position: relative;
      transition: all 0.3s ease;
    }
    .hanging-medal::before {
      content: ''; position: absolute; top: -20px; left: 50%; width: 2px; height: 20px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2));
    }

    .fade-up { opacity: 0; transform: translateY(30px); transition: 0.8s all ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="pb-32">

<!-- TOP HEADER -->
<header class="fixed top-0 w-full z-50 bg-dark-bg/80 backdrop-blur-lg border-b border-white/5">
  <div class="max-w-lg mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-2 h-2 rounded-full bg-mythic-gold animate-pulse"></div>
      <h1 class="font-headline font-extrabold text-xl tracking-tight">The Sanctum</h1>
    </div>
    <span id="masteryHUD" class="text-[9px] font-black border border-white/20 px-3 py-1 rounded-full uppercase tracking-widest text-white/60">
      Mastery: 0%
    </span>
  </div>
</header>

<main class="pt-28 px-6 max-w-lg mx-auto space-y-12">

  <!-- 1. HANGING SUBSCRIPTION MEDALS -->
  <section class="fade-up">
    <p class="text-[10px] font-bold text-white/40 uppercase tracking-[0.3em] mb-8 text-center">Your Covenant Rank</p>
    <div id="subscriptionMedals" class="flex justify-around items-start gap-4 h-32">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- 2. THE MAIN CABINET (Evolving Trophies) -->
  <section class="fade-up">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-headline font-bold text-lg text-white/90">Trophy Cabinet</h3>
      <span class="text-[10px] text-white/30 font-bold uppercase tracking-widest">Glass Shelving V.1</span>
    </div>

    <div id="achievementsGrid" class="cabinet-shelf rounded-3xl p-8 grid grid-cols-2 gap-8">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- 3. EXPEDITIONS (New Missions Section) -->
  <section class="fade-up">
    <div class="glass-panel p-6 border-mythic-gold/20">
      <div class="flex items-start justify-between mb-6">
        <div>
          <h3 class="font-headline font-bold text-lg text-white">Scout Expeditions</h3>
          <p class="text-xs text-white/50 mt-1">Deploy on new missions to upgrade your armor.</p>
        </div>
        <span class="material-symbols-outlined text-mythic-gold filled">explore</span>
      </div>
      
      <div id="expeditionList" class="space-y-3">
        <!-- New Mission CTA -->
        <a href="cause.html" class="flex items-center gap-4 p-4 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors group">
          <div class="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center">
            <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">add_task</span>
          </div>
          <div class="flex-1">
            <p class="text-sm font-bold">Search Active Missions</p>
            <p class="text-[10px] text-white/40">Find new territories to reach.</p>
          </div>
          <span class="material-symbols-outlined text-white/20 text-sm">chevron_right</span>
        </a>
      </div>
    </div>
  </section>

</main>

<!-- DETAIL VIEW (Museum Placard style) -->
<div id="detailOverlay" class="fixed inset-0 z-[100] hidden">
  <div class="absolute inset-0 bg-dark-bg/90 backdrop-blur-md" onclick="closeDetail()"></div>
  <div id="detailSheet" class="absolute bottom-0 inset-x-0 bg-slate-900 rounded-t-[40px] detail-sheet p-10 max-w-lg mx-auto border-t border-white/10 shadow-2xl">
    <div class="w-16 h-1 bg-white/10 rounded-full mx-auto mb-10"></div>
    
    <div class="text-center mb-10">
      <div id="detailIconWrap" class="w-28 h-28 mx-auto mb-6 rounded-3xl flex items-center justify-center shadow-inner relative overflow-hidden">
        <div class="absolute inset-0 bg-white/5 animate-pulse"></div>
        <span id="detailIcon" class="material-symbols-outlined text-[56px] text-white z-10"></span>
      </div>
      <h2 id="detailTitle" class="font-headline font-black text-3xl mb-2 tracking-tight text-white">---</h2>
      <p id="detailDesc" class="text-sm text-white/50 leading-relaxed px-6">---</p>
    </div>

    <div id="detailTierList" class="space-y-3 mb-10">
      <!-- Roadmap -->
    </div>

    <button onclick="closeDetail()" class="w-full py-5 bg-white text-dark-bg font-headline font-black rounded-2xl shadow-xl active:scale-95 transition-all">
      CLOSE VAULT
    </button>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser, userProfile, trophyDefinitions;
var userStats = { shares: 0, recruits_paid: 0, countries_paid: 0 };
var observer = new IntersectionObserver(e => e.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible') }));

async function init() {
  const s = await supabaseClient.auth.getSession();
  if (!s.data.session) { window.location.href = 'login.html'; return; }
  currentUser = s.data.session.user;
  await loadData();
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
}

async function loadData() {
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
  userProfile = profile;

  const results = await Promise.allSettled([
    supabaseClient.from('trophy_definitions').select('*').eq('is_active', true).order('sort_order'),
    supabaseClient.from('shares').select('id', { count: 'exact' }).eq('user_id', currentUser.id),
    supabaseClient.from('profiles').select('country, subscription_tier').eq('referred_by', userProfile.invite_code)
  ]);

  trophyDefinitions = results[0].value.data || [];
  userStats.shares = results[1].value.count || 0;
  
  const recruits = results[2].value.data || [];
  const paidRecruits = recruits.filter(r => r.subscription_tier !== 'free');
  userStats.recruits_paid = paidRecruits.length;
  userStats.countries_paid = new Set(paidRecruits.map(r => r.country).filter(c => c)).size;

  render();
}

function render() {
  renderSubscriptionMedals();
  renderCabinet();
}

function renderSubscriptionMedals() {
  const container = document.getElementById('subscriptionMedals');
  const userTier = (userProfile.subscription_tier || 'free').toLowerCase();
  container.innerHTML = '';

  SUBSCRIPTION_ROADMAP.forEach(badge => {
    const isActive = badge.key === userTier;
    const div = document.createElement('div');
    div.className = `hanging-medal flex flex-col items-center transition-all ${isActive ? 'scale-110 opacity-100' : 'opacity-20 grayscale scale-90'}`;
    div.innerHTML = `
      <div class="w-14 h-14 rounded-full border-2 ${isActive ? 'border-mythic-gold shadow-lg shadow-mythic-gold/20' : 'border-white/10'} mb-2 p-1">
        <img src="${badge.image}" class="w-full h-full object-contain">
      </div>
      <p class="text-[8px] font-black uppercase tracking-widest ${isActive ? 'text-mythic-gold' : 'text-white/40'}">${badge.name}</p>
    `;
    container.appendChild(div);
  });
}

function renderCabinet() {
  const container = document.getElementById('achievementsGrid');
  container.innerHTML = '';
  
  let totalTiers = trophyDefinitions.length * 5;
  let earnedTiers = 0;

  trophyDefinitions.forEach(trophy => {
    const state = getTrophyState(trophy, userStats);
    const rarity = state.activeTier.rarity;
    
    // Progress calculation for Mastery HUD
    trophy.tiers.forEach(t => { if(state.count >= t.req) earnedTiers++; });

    const tile = document.createElement('div');
    tile.className = `trophy-pedestal text-center cursor-pointer group`;
    tile.innerHTML = `
      <div class="trophy-item relative mb-4">
        <div class="w-20 h-28 mx-auto bg-white/5 rounded-xl border border-white/10 flex items-center justify-center glow-${state.isUnlocked ? rarity : 'common'} ${!state.isUnlocked ? 'opacity-20 grayscale' : ''}">
           <span class="material-symbols-outlined text-[48px] ${state.isUnlocked ? 'text-white' : 'text-white/20'}">${trophy.icon}</span>
           <!-- Rarity Shine -->
           <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        </div>
      </div>
      <h4 class="font-headline font-extrabold text-xs tracking-tight text-white/90">${trophy.title}</h4>
      <p class="text-[8px] font-black uppercase tracking-[0.2em] mt-1 ${state.isUnlocked ? 'text-mythic-gold' : 'text-white/20'}">
        ${state.isUnlocked ? rarity : 'Locked'}
      </p>
    `;
    tile.onclick = () => openDetail(trophy, state);
    container.appendChild(tile);
  });

  const masteryPct = Math.round((earnedTiers / totalTiers) * 100);
  document.getElementById('masteryHUD').textContent = `Mastery: ${masteryPct}%`;
}

function openDetail(trophy, state) {
  const colors = RARITY_COLORS[state.activeTier.rarity];
  
  document.getElementById('detailIcon').textContent = trophy.icon;
  document.getElementById('detailIconWrap').className = `w-28 h-28 mx-auto mb-6 rounded-3xl flex items-center justify-center ${colors.bg} shadow-2xl`;
  document.getElementById('detailTitle').textContent = trophy.title;
  document.getElementById('detailDesc').textContent = trophy.description;

  const tierList = document.getElementById('detailTierList');
  tierList.innerHTML = '';

  trophy.tiers.forEach(tier => {
    const isDone = state.count >= tier.req;
    const div = document.createElement('div');
    div.className = `tier-item ${isDone ? 'completed bg-white/5' : 'opacity-20'}`;
    div.innerHTML = `
      <div class="w-3 h-3 rounded-full ${RARITY_COLORS[tier.rarity].bg}"></div>
      <div class="flex-1 text-left">
        <p class="text-[11px] font-black text-white">${tier.name}</p>
        <p class="text-[9px] text-white/40">${tier.desc || ''}</p>
      </div>
      <p class="text-[9px] font-black text-white/60">${tier.req} ${trophy.type.split('_')[0].toUpperCase()}</p>
    `;
    tierList.appendChild(div);
  });

  document.getElementById('detailOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('detailSheet').classList.add('open'), 10);
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open');
  setTimeout(() => document.getElementById('detailOverlay').classList.add('hidden'), 400);
}

init();
</script>
</body>
</html>
