<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Sanctum Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="badges-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">

  <style>
    body { 
      font-family: 'Manrope', sans-serif; 
      background: #0a0a0b; 
      color: #f8fafc; 
      margin: 0; padding: 0;
      overflow-x: hidden;
    }

    /* The Realistic Cabinet Container */
.cabinet-container {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  aspect-ratio: 1 / 1; 
  background-image: url('images/cabinet.jpg'); /* Updated path */
  background-size: cover;
  background-position: center;
  box-shadow: 0 50px 100px rgba(0,0,0,0.8);
  border-bottom: 10px solid #1a1a1a;
}

    /* Positioning Trophies on Shelves */
    .shelf-layer {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      pointer-events: none;
    }
    .shelf-layer > * { pointer-events: auto; }

    /* Vertical alignment for shelves in your image */
    .shelf-1 { top: 38%; } /* Top glass shelf */
    .shelf-2 { top: 58%; } /* Middle glass shelf */
    .shelf-3 { top: 78%; } /* Bottom wooden shelf */

    /* The Trophy Look (Physical Plaque) */
    .trophy-physical {
      width: 70px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
    }
    .trophy-physical:hover { transform: scale(1.1) translateY(-5px); }
    .trophy-physical.locked { opacity: 0.15; filter: grayscale(1) blur(1px); }

    .medal-icon {
      width: 50px; height: 60px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      position: relative;
      background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(0,0,0,0.2));
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* God-Ray Lighting from Cabinet Spotlights */
    .spotlight-effect {
      position: absolute;
      top: 15%; width: 100%; height: 40%;
      background: radial-gradient(circle at 50% 0%, rgba(212, 162, 76, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Legendary Brass Plaque (Legend) */
    .brass-plaque {
      background: linear-gradient(145deg, #3d3d3d, #1a1a1a);
      border: 1px solid #444;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 16px;
    }

    .modal-sheet { transform: translateY(100%); transition: transform 0.4s ease; background: #1a1a1c; }
    .modal-sheet.open { transform: translateY(0); }
  </style>
</head>
<body>

<header class="p-6 flex justify-between items-center bg-black/40 backdrop-blur-md sticky top-0 z-50">
  <h1 class="font-headline font-black text-xl tracking-tight text-gold">THE SANCTUM</h1>
  <div class="text-right">
    <p id="masteryHUD" class="text-[10px] font-black text-white/40 uppercase tracking-widest">Mastery: 0%</p>
  </div>
</header>

<main class="pb-20">

  <!-- THE CABINET -->
  <div class="cabinet-container">
    <div class="spotlight-effect"></div>
    
    <!-- Shelf 1: Evolving Trophies -->
    <div id="shelf1" class="shelf-layer shelf-1">
      <!-- Trophies will be placed here by JS -->
    </div>

    <!-- Shelf 2: Evolving Trophies -->
    <div id="shelf2" class="shelf-layer shelf-2">
      <!-- Trophies will be placed here by JS -->
    </div>

    <!-- Shelf 3: Subscription Medals -->
    <div id="shelf3" class="shelf-layer shelf-3">
      <!-- Medals will be placed here by JS -->
    </div>
  </div>

  <!-- THE LEGEND & EXPEDITIONS -->
  <div class="px-6 -mt-10 relative z-10 space-y-6">
    
    <!-- Brass Plaque Legend -->
    <section class="brass-plaque">
      <p class="text-[9px] font-black text-gold/60 uppercase tracking-[0.2em] mb-4 text-center">Rarity Hierarchy</p>
      <div class="flex flex-wrap justify-center gap-3">
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-common"></div><span class="text-[10px] font-bold">Common</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-uncommon"></div><span class="text-[10px] font-bold">Uncommon</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-rare"></div><span class="text-[10px] font-bold text-blue-400">Rare</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-epic"></div><span class="text-[10px] font-bold text-purple-400">Epic</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-mythic animate-pulse"></div><span class="text-[10px] font-bold text-gold">Mythic</span></div>
      </div>
    </section>

    <!-- Expedition Button -->
    <a href="cause.html" class="flex items-center justify-between p-5 rounded-2xl bg-gold text-black font-headline font-black text-sm shadow-xl">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined filled">explore</span>
        SEARCH MISSIONS
      </div>
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
  </div>
</main>

<!-- DETAIL MODAL -->
<div id="detailOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden" onclick="closeDetail()">
  <div id="detailSheet" class="absolute bottom-0 inset-x-0 modal-sheet p-10 max-w-lg mx-auto rounded-t-[40px] border-t border-white/10" onclick="event.stopPropagation()">
    <div class="w-12 h-1 bg-white/20 mx-auto mb-8 rounded-full"></div>
    <div id="modalContent" class="text-center">
      <div id="modalIconWrap" class="w-20 h-20 mx-auto mb-4 flex items-center justify-center rounded-2xl shadow-2xl">
        <span id="modalIcon" class="material-symbols-outlined text-[40px] text-white"></span>
      </div>
      <h2 id="modalTitle" class="font-headline font-black text-2xl text-white mb-2">---</h2>
      <p id="modalDesc" class="text-sm text-white/50 mb-8">---</p>
      
      <div id="modalRoadmap" class="space-y-3 text-left">
        <!-- Tiers -->
      </div>
    </div>
    <button onclick="closeDetail()" class="w-full mt-10 py-4 bg-white text-black font-headline font-black rounded-xl">CLOSE VAULT</button>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser, userProfile, trophyDefinitions;
var userStats = { shares: 0, recruits_paid: 0, countries_paid: 0 };

async function init() {
  const s = await supabaseClient.auth.getSession();
  if (!s.data.session) { window.location.href = 'login.html'; return; }
  currentUser = s.data.session.user;
  await loadData();
}

async function loadData() {
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
  userProfile = profile || {};

  const res = await Promise.allSettled([
    supabaseClient.from('trophy_definitions').select('*').order('sort_order'),
    supabaseClient.from('shares').select('id', { count: 'exact' }).eq('user_id', currentUser.id),
    supabaseClient.from('profiles').select('country, subscription_tier').eq('referred_by', userProfile.invite_code)
  ]);

  trophyDefinitions = res[0].value.data || [];
  userStats.shares = res[1].value.count || 0;
  
  const paid = (res[2].value.data || []).filter(r => r.subscription_tier !== 'free');
  userStats.recruits_paid = paid.length;
  userStats.countries_paid = new Set(paid.map(r => r.country).filter(c => c)).size;

  render();
}

function render() {
  // 1. Trophies on Shelves
  const shelf1 = document.getElementById('shelf1');
  const shelf2 = document.getElementById('shelf2');
  shelf1.innerHTML = ''; shelf2.innerHTML = '';
  
  let earnedCount = 0;

  trophyDefinitions.forEach((trophy, index) => {
    const state = getTrophyState(trophy, userStats);
    if(state.isUnlocked && state.activeTier.rarity === 'mythic') earnedCount++;

    const div = document.createElement('div');
    div.className = `trophy-physical ${state.isUnlocked ? '' : 'locked'}`;
    const color = state.isUnlocked ? RARITY_COLORS[state.activeTier.rarity].bg : 'bg-white/5';
    
    div.innerHTML = `
      <div class="medal-icon ${color}">
        <span class="material-symbols-outlined text-white text-[24px]">${trophy.icon}</span>
      </div>
      <p class="text-[8px] font-black mt-2 text-white/80 uppercase tracking-tighter">${trophy.title}</p>
    `;
    div.onclick = () => openDetail(trophy, state);
    
    // Distribute across shelves
    if(index < 2) shelf1.appendChild(div);
    else shelf2.appendChild(div);
  });

  // 2. Subscription Medals (Bottom Shelf)
  const shelf3 = document.getElementById('shelf3');
  shelf3.innerHTML = '';
  const currentTier = (userProfile.subscription_tier || 'free').toLowerCase();

  SUBSCRIPTION_ROADMAP.forEach(badge => {
    const active = badge.key === currentTier;
    const div = document.createElement('div');
    div.className = `trophy-physical ${active ? '' : 'opacity-20 grayscale'}`;
    div.innerHTML = `
      <div class="w-10 h-10 rounded-full border border-gold/30 p-1 mx-auto">
        <img src="${badge.image}" class="w-full h-full object-contain">
      </div>
      <p class="text-[7px] font-bold mt-1 text-gold uppercase">${badge.name}</p>
    `;
    shelf3.appendChild(div);
  });

  document.getElementById('masteryHUD').textContent = `Mastery: ${Math.round((earnedCount/trophyDefinitions.length)*100)}%`;
}

function openDetail(trophy, state) {
  const colors = RARITY_COLORS[state.activeTier.rarity];
  document.getElementById('modalIcon').textContent = trophy.icon;
  document.getElementById('modalIconWrap').className = `w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center ${colors.bg}`;
  document.getElementById('modalTitle').textContent = trophy.title;
  document.getElementById('modalDesc').textContent = trophy.description;

  const roadmap = document.getElementById('modalRoadmap');
  roadmap.innerHTML = '';

  trophy.tiers.forEach(tier => {
    const isDone = state.count >= tier.req;
    const div = document.createElement('div');
    div.className = `p-3 rounded-xl flex items-center gap-3 ${isDone ? 'bg-white/10 border border-white/10' : 'opacity-20'}`;
    div.innerHTML = `
      <div class="w-2 h-2 rounded-full ${RARITY_COLORS[tier.rarity].bg}"></div>
      <div class="flex-1">
        <p class="text-xs font-bold text-white">${tier.name}</p>
        <p class="text-[10px] text-white/40">Target: ${tier.req}</p>
      </div>
      ${isDone ? '<span class="material-symbols-outlined text-gold text-sm">check_circle</span>' : ''}
    `;
    roadmap.appendChild(div);
  });

  document.getElementById('detailOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('detailSheet').classList.add('open'), 10);
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open');
  setTimeout(() => document.getElementById('detailOverlay').classList.add('hidden'), 400);
}

init();
</script>
</body>
</html>
