<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trophy Locker — Go Spread The Word</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="badges-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#f2f6fa', 'on-surface':'#31332e', 'primary':'#3d6285', 'gold':'#D4A24C',
            'common':'#8A8C85', 'uncommon':'#3A8759', 'rare':'#3d6285', 'epic':'#7B3F9C', 'mythic':'#E38C1F'
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background: #f2f6fa; color: #31332e; }
    .glass-header { background: rgba(242,246,250,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    
    /* Rarity Legend */
    .rarity-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: white; border: 1px solid #eef2f6; }
    .rarity-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Locker Cards */
    .card-common { background: linear-gradient(180deg, #fff 0%, #f9fafb 100%); border: 1px solid #e5e7eb; }
    .card-uncommon { background: linear-gradient(180deg, #fff 0%, #f0fdf4 100%); border: 1px solid #bbf7d0; }
    .card-rare { background: linear-gradient(180deg, #fff 0%, #eff6ff 100%); border: 1px solid #bfdbfe; }
    .card-epic { background: linear-gradient(180deg, #fff 0%, #faf5ff 100%); border: 1px solid #e9d5ff; }
    .card-mythic { background: linear-gradient(180deg, #fff 0%, #fffbeb 100%); border: 1px solid #fde68a; }

    .trophy-tile { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .trophy-tile:active { transform: scale(0.95); }

    /* Roadmap Modal */
    .detail-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
    .detail-sheet.open { transform: translateY(0); }
    .tier-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #f8f9fa; border: 1px solid transparent; }
    .tier-item.completed { background: white; border-color: #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }

    .fade-up { opacity: 0; transform: translateY(16px); transition: 0.6s all ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    .mythic-glow-border { animation: mythic-pulse 2s infinite alternate; }
    @keyframes mythic-pulse { from { box-shadow: 0 0 5px #E38C1F; } to { box-shadow: 0 0 15px #FFD700; } }
  </style>
</head>
<body class="pb-32">

<header class="fixed top-0 w-full z-50 glass-header border-b border-black/5">
  <div class="max-w-[430px] mx-auto px-6 py-4 flex items-center justify-between">
    <h1 class="font-headline font-extrabold text-xl">Trophy Locker</h1>
    <span id="masteryCount" class="text-[10px] font-black bg-primary/10 text-primary px-3 py-1 rounded-full uppercase tracking-tighter">Mastery: 0/0</span>
  </div>
</header>

<main class="pt-24 px-5 max-w-[430px] mx-auto space-y-8">

  <!-- 1. RARITY GUIDE -->
  <section class="fade-up">
    <p class="text-[10px] font-bold text-outline uppercase tracking-widest mb-3 pl-1">Rarity Hierarchy</p>
    <div class="flex flex-wrap gap-2">
      <div class="rarity-pill"><div class="rarity-dot bg-common"></div><span class="text-[9px] font-bold">Common</span></div>
      <div class="rarity-pill"><div class="rarity-dot bg-uncommon"></div><span class="text-[9px] font-bold">Uncommon</span></div>
      <div class="rarity-pill"><div class="rarity-dot bg-rare"></div><span class="text-[9px] font-bold">Rare</span></div>
      <div class="rarity-pill"><div class="rarity-dot bg-epic"></div><span class="text-[9px] font-bold">Epic</span></div>
      <div class="rarity-pill"><div class="rarity-dot bg-mythic mythic-glow-border"></div><span class="text-[9px] font-bold text-mythic">Mythic</span></div>
    </div>
  </section>

  <!-- 2. TROPHY GRID -->
  <section class="fade-up">
    <div class="flex justify-between items-center mb-4 pl-1">
      <h3 class="font-headline font-extrabold text-lg">Evolving Trophies</h3>
    </div>
    <div id="achievementsGrid" class="grid grid-cols-2 gap-3">
      <!-- Injected via JS -->
    </div>
  </section>

</main>

<!-- DETAIL MODAL -->
<div id="detailOverlay" class="fixed inset-0 z-[100] hidden">
  <div class="absolute inset-0 bg-on-surface/40 backdrop-blur-sm" onclick="closeDetail()"></div>
  <div id="detailSheet" class="absolute bottom-0 inset-x-0 bg-surface rounded-t-[40px] detail-sheet p-8 max-w-[430px] mx-auto overflow-y-auto max-h-[90vh]">
    <div class="w-12 h-1.5 bg-outline-variant/20 rounded-full mx-auto mb-8"></div>
    
    <div class="text-center mb-8">
      <div id="detailIconWrap" class="w-24 h-24 mx-auto mb-4 rounded-[28px] flex items-center justify-center">
        <span id="detailIcon" class="material-symbols-outlined text-[48px] text-white filled"></span>
      </div>
      <h2 id="detailTitle" class="font-headline font-black text-2xl mb-2">Trophy Name</h2>
      <p id="detailDesc" class="text-sm text-on-surface-variant px-4">Description of the warrior's path.</p>
    </div>

    <div class="space-y-4">
      <p class="text-[10px] font-black text-outline uppercase tracking-[0.2em] text-center">Trophy Roadmap</p>
      <div id="detailTierList" class="space-y-2">
        <!-- Tiers injected here -->
      </div>
    </div>

    <button onclick="closeDetail()" class="w-full mt-8 py-4 bg-on-surface text-white font-headline font-bold rounded-2xl active:scale-95 transition-transform">
      Return to Locker
    </button>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser, userProfile, trophyDefinitions;
var userStats = { shares: 0, recruits_paid: 0, countries_paid: 0 };
var observer = new IntersectionObserver(e => e.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible') }));

async function init() {
  const s = await supabaseClient.auth.getSession();
  if (!s.data.session) { window.location.href = 'login.html'; return; }
  currentUser = s.data.session.user;

  await loadData();
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
}

async function loadData() {
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
  userProfile = profile;

  const results = await Promise.allSettled([
    supabaseClient.from('trophy_definitions').select('*').eq('is_active', true).order('sort_order'),
    supabaseClient.from('shares').select('id', { count: 'exact' }).eq('user_id', currentUser.id),
    supabaseClient.from('profiles').select('country, subscription_tier').eq('referred_by', userProfile.invite_code)
  ]);

  trophyDefinitions = results[0].value.data || [];
  userStats.shares = results[1].value.count || 0;
  
  const recruits = results[2].value.data || [];
  const paidRecruits = recruits.filter(r => r.subscription_tier !== 'free');
  userStats.recruits_paid = paidRecruits.length;
  userStats.countries_paid = new Set(paidRecruits.map(r => r.country).filter(c => c)).size;

  render();
}

function render() {
  const container = document.getElementById('achievementsGrid');
  container.innerHTML = '';
  
  let earnedMythics = 0;

  trophyDefinitions.forEach(trophy => {
    const state = getTrophyState(trophy, userStats);
    if (state.isUnlocked && state.activeTier.rarity === 'mythic') earnedMythics++;

    const rarity = state.activeTier.rarity;
    const colors = RARITY_COLORS[rarity];
    
    const tile = document.createElement('div');
    tile.className = `trophy-tile p-5 rounded-[32px] text-center shadow-sm ${state.isUnlocked ? 'card-' + rarity : 'bg-surface-chigh opacity-40 grayscale'}`;
    tile.innerHTML = `
      <div class="w-14 h-14 mx-auto mb-3 rounded-[20px] flex items-center justify-center ${state.isUnlocked ? colors.bg : 'bg-surface-variant'}">
        <span class="material-symbols-outlined text-white text-[32px] ${state.isUnlocked ? 'filled' : ''}">${trophy.icon}</span>
      </div>
      <h4 class="font-headline font-black text-on-surface text-[14px] leading-tight">${trophy.title}</h4>
      <p class="text-[9px] font-black uppercase tracking-widest mt-1 ${state.isUnlocked ? colors.text : 'text-outline'}">${state.isUnlocked ? rarity : 'Locked'}</p>
    `;
    tile.onclick = () => openDetail(trophy, state);
    container.appendChild(tile);
  });

  document.getElementById('masteryCount').textContent = `Mastery: ${earnedMythics}/${trophyDefinitions.length}`;
}

function openDetail(trophy, state) {
  const colors = RARITY_COLORS[state.activeTier.rarity];
  
  document.getElementById('detailIcon').textContent = trophy.icon;
  document.getElementById('detailIconWrap').className = `w-24 h-24 mx-auto mb-4 rounded-[28px] flex items-center justify-center ${colors.bg}`;
  document.getElementById('detailTitle').textContent = trophy.title;
  document.getElementById('detailDesc').textContent = trophy.description;

  const tierList = document.getElementById('detailTierList');
  tierList.innerHTML = '';

  trophy.tiers.forEach(tier => {
    const isDone = state.count >= tier.req;
    const tierColor = RARITY_COLORS[tier.rarity];
    
    const div = document.createElement('div');
    div.className = `tier-item ${isDone ? 'completed' : 'opacity-50'}`;
    div.innerHTML = `
      <div class="w-3 h-3 rounded-full ${tierColor.bg}"></div>
      <div class="flex-1 text-left">
        <p class="text-[12px] font-black ${isDone ? 'text-on-surface' : 'text-outline'}">${tier.name}</p>
        <p class="text-[10px] text-on-surface-variant">${tier.desc || ''}</p>
      </div>
      <div class="text-right">
        <p class="text-[10px] font-black ${isDone ? 'text-primary' : 'text-outline'}">${tier.req} ${trophy.type.split('_')[0].toUpperCase()}</p>
      </div>
    `;
    tierList.appendChild(div);
  });

  document.getElementById('detailOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('detailSheet').classList.add('open'), 10);
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open');
  setTimeout(() => document.getElementById('detailOverlay').classList.add('hidden'), 400);
}

init();
</script>
</body>
</html>
