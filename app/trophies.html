<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Sanctum Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="badges-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">

  <style>
    body { font-family: 'Manrope', sans-serif; background: #0a0a0b; color: #f8fafc; margin: 0; overflow-x: hidden; }

    /* THE REALISTIC CABINET CONTAINER */
    .cabinet-container {
      position: relative;
      width: 100%;
      max-width: 430px; /* Sized for mobile app feel */
      margin: 20px auto 0;
      aspect-ratio: 1 / 1; 
      background-image: url('images/cabinet.jpg'); /* CORRECT PATH */
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 12px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.9);
    }

    /* Positioning Trophies on Shelves - Calibrated to your image */
    .shelf-layer {
      position: absolute;
      width: 78%; /* Keeps trophies inside the glass area */
      left: 11%;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .shelf-1 { top: 36%; } /* Top glass shelf */
    .shelf-2 { top: 54%; } /* Middle glass shelf */
    .shelf-3 { top: 74%; } /* Bottom wooden shelf base */

    .trophy-physical {
      flex: 1;
      max-width: 80px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .trophy-physical:active { transform: scale(0.9); }
    .trophy-physical.locked { opacity: 0.2; filter: grayscale(1); }

    /* The Medal Plaque */
    .medal-icon {
      width: 44px; height: 56px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 15px rgba(0,0,0,0.5);
    }

    /* Spotlight Glow behind Trophy */
    .trophy-glow {
        position: absolute;
        top: 50%; left: 50%; width: 40px; height: 40px;
        transform: translate(-50%, -50%);
        background: var(--glow-color, rgba(255,255,255,0.1));
        filter: blur(15px);
        z-index: -1;
        opacity: 0.4;
    }

    /* Navigation Plaque at bottom */
    .brass-plaque {
      background: linear-gradient(180deg, #2a2a2c, #161618);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

    /* Modal styling to match "Sanctum" but readable */
    .modal-sheet { 
        transform: translateY(100%); transition: transform 0.4s ease; 
        background: #1c1c1e; border-top: 1px solid rgba(255,255,255,0.1); 
    }
    .modal-sheet.open { transform: translateY(0); }

    .roadmap-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 12px;
        display: flex; align-items: center; gap: 12px;
    }
    .roadmap-item.complete { background: rgba(212,162,76,0.05); border-color: rgba(212,162,76,0.2); }
  </style>
</head>
<body class="pb-24">

<header class="p-6 flex justify-between items-center bg-black/60 backdrop-blur-xl sticky top-0 z-50 border-b border-white/5">
  <h1 class="font-headline font-black text-xl tracking-tight text-white">THE SANCTUM</h1>
  <div id="masteryBadge" class="bg-white/5 px-3 py-1 rounded-full border border-white/10">
    <p id="masteryHUD" class="text-[9px] font-black text-white/60 uppercase tracking-widest">Mastery: 0%</p>
  </div>
</header>

<main class="space-y-8">

  <!-- THE CABINET -->
  <div class="cabinet-container">
    <!-- Shelf 1 (Top) -->
    <div id="shelf1" class="shelf-layer shelf-1"></div>
    <!-- Shelf 2 (Mid) -->
    <div id="shelf2" class="shelf-layer shelf-2"></div>
    <!-- Shelf 3 (Base - Subscription) -->
    <div id="shelf3" class="shelf-layer shelf-3"></div>
  </div>

  <!-- NAVIGATION & INFO -->
  <div class="px-5 space-y-6">
    <section class="brass-plaque">
      <p class="text-[10px] font-black text-white/40 uppercase tracking-[0.2em] mb-4 text-center">Rarity Hierarchy</p>
      <div class="flex justify-between items-center px-2">
        <div class="flex flex-col items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-common"></div><span class="text-[8px] font-bold text-white/60">Common</span></div>
        <div class="flex flex-col items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-uncommon"></div><span class="text-[8px] font-bold text-white/60">Uncommon</span></div>
        <div class="flex flex-col items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-rare"></div><span class="text-[8px] font-bold text-white/60">Rare</span></div>
        <div class="flex flex-col items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-epic"></div><span class="text-[8px] font-bold text-white/60">Epic</span></div>
        <div class="flex flex-col items-center gap-1"><div class="w-2 h-2 rounded-full bg-mythic shadow-[0_0_8px_#D4A24C]"></div><span class="text-[8px] font-black text-gold">Mythic</span></div>
      </div>

      <div class="h-px bg-white/5 my-6"></div>

      <a href="cause.html" class="flex items-center justify-between p-4 rounded-xl bg-white text-black font-headline font-black text-xs active:scale-95 transition-transform">
        <div class="flex items-center gap-3"><span class="material-symbols-outlined filled">explore</span> SEARCH MISSIONS</div>
        <span class="material-symbols-outlined">chevron_right</span>
      </a>
    </section>
  </div>
</main>

<!-- DETAIL VIEW -->
<div id="detailOverlay" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] hidden" onclick="closeDetail()">
  <div id="detailSheet" class="absolute bottom-0 inset-x-0 modal-sheet p-8 max-w-lg mx-auto rounded-t-[32px]" onclick="event.stopPropagation()">
    <div class="w-12 h-1 bg-white/10 mx-auto mb-8 rounded-full"></div>
    <div id="modalIconWrap" class="w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center">
      <span id="modalIcon" class="material-symbols-outlined text-[40px] text-white"></span>
    </div>
    <h2 id="modalTitle" class="font-headline font-black text-2xl text-center mb-1 text-white">---</h2>
    <p id="modalDesc" class="text-sm text-white/40 text-center mb-8 px-6">---</p>
    
    <div id="modalRoadmap" class="space-y-2"></div>
    
    <button onclick="closeDetail()" class="w-full mt-8 py-4 bg-white text-black font-headline font-black rounded-xl">CLOSE VAULT</button>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser, userProfile, trophyDefinitions;
var userStats = { shares: 0, recruits_paid: 0, countries_paid: 0 };

async function init() {
  const s = await supabaseClient.auth.getSession();
  if (!s.data.session) { window.location.href = 'login.html'; return; }
  currentUser = s.data.session.user;
  await loadData();
}

async function loadData() {
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
  userProfile = profile || {};

  const res = await Promise.allSettled([
    supabaseClient.from('trophy_definitions').select('*').order('sort_order'),
    supabaseClient.from('shares').select('id', { count: 'exact' }).eq('user_id', currentUser.id),
    supabaseClient.from('profiles').select('country, subscription_tier').eq('referred_by', userProfile.invite_code)
  ]);

  trophyDefinitions = res[0].value.data || [];
  userStats.shares = res[1].value.count || 0;
  
  const recs = res[2].value.data || [];
  const paid = recs.filter(r => r.subscription_tier !== 'free');
  userStats.recruits_paid = paid.length;
  userStats.countries_paid = new Set(paid.map(r => r.country).filter(c => c)).size;

  render();
}

function render() {
  const shelf1 = document.getElementById('shelf1');
  const shelf2 = document.getElementById('shelf2');
  const shelf3 = document.getElementById('shelf3');
  shelf1.innerHTML = ''; shelf2.innerHTML = ''; shelf3.innerHTML = '';
  
  let earnedMythics = 0;

  trophyDefinitions.forEach((trophy, index) => {
    const state = getTrophyState(trophy, userStats);
    if(state.isUnlocked && state.activeTier.rarity === 'mythic') earnedMythics++;

    const div = document.createElement('div');
    div.className = `trophy-physical relative ${state.isUnlocked ? '' : 'locked'}`;
    
    // Assign rarity glow color
    const glowColorMap = { 'common':'#64748b', 'uncommon':'#16a34a', 'rare':'#2563eb', 'epic':'#9333ea', 'mythic':'#d97706' };
    const rarity = state.activeTier.rarity;
    const colorClass = state.isUnlocked ? RARITY_COLORS[rarity].bg : 'bg-white/5';

    div.innerHTML = `
      <div class="trophy-glow" style="--glow-color: ${glowColorMap[rarity]}"></div>
      <div class="medal-icon ${colorClass}">
        <span class="material-symbols-outlined text-white text-[24px]">${trophy.icon}</span>
      </div>
      <p class="text-[7px] font-bold mt-1.5 text-white/60 leading-tight uppercase">${trophy.title}</p>
    `;
    div.onclick = () => openDetail(trophy, state);
    
    // Put 3 trophies on Shelf 1, any others on Shelf 2
    if(index < 3) shelf1.appendChild(div);
    else shelf2.appendChild(div);
  });

  // Shelf 3: Subscription Status
  const currentTier = (userProfile.subscription_tier || 'free').toLowerCase();
  SUBSCRIPTION_ROADMAP.forEach(badge => {
    const active = badge.key === currentTier;
    const div = document.createElement('div');
    div.className = `trophy-physical ${active ? '' : 'opacity-10 grayscale'}`;
    div.innerHTML = `
      <div class="w-10 h-10 rounded-full bg-black/40 border border-white/10 p-1 mx-auto flex items-center justify-center">
        <img src="${badge.image}" class="w-full h-full object-contain">
      </div>
      <p class="text-[7px] font-bold mt-1 text-gold/60 uppercase">${badge.name}</p>
    `;
    shelf3.appendChild(div);
  });

  document.getElementById('masteryHUD').textContent = `Mastery: ${Math.round((earnedMythics/trophyDefinitions.length)*100)}%`;
}

function openDetail(trophy, state) {
  const colors = RARITY_COLORS[state.activeTier.rarity];
  document.getElementById('modalIcon').textContent = trophy.icon;
  document.getElementById('modalIconWrap').className = `w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center ${colors.bg}`;
  document.getElementById('modalTitle').textContent = trophy.title;
  document.getElementById('modalDesc').textContent = trophy.description;

  const roadmap = document.getElementById('modalRoadmap');
  roadmap.innerHTML = '';

  trophy.tiers.forEach(tier => {
    const isDone = state.count >= tier.req;
    const div = document.createElement('div');
    div.className = `roadmap-item ${isDone ? 'complete' : ''}`;
    div.innerHTML = `
      <div class="w-2.5 h-2.5 rounded-full ${RARITY_COLORS[tier.rarity].bg}"></div>
      <div class="flex-1">
        <p class="text-[12px] font-black text-white">${tier.name}</p>
        <p class="text-[10px] text-white/30">Target: ${tier.req} ${trophy.type.split('_')[0].toUpperCase()}</p>
      </div>
      ${isDone ? '<span class="material-symbols-outlined text-gold text-[20px] filled">check_circle</span>' : ''}
    `;
    roadmap.appendChild(div);
  });

  document.getElementById('detailOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('detailSheet').classList.add('open'), 10);
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open');
  setTimeout(() => document.getElementById('detailOverlay').classList.add('hidden'), 400);
}

init();
</script>
</body>
</html>
