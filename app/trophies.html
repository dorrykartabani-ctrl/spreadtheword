<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f6fa">
  <title>Trophies — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="nav.css">

  <script src="badges-config.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#f2f6fa','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'tertiary':'#ad332b',
            'gold':'#D4A24C','gold-dim':'#B88A3D',
            
            /* Fortnite Rarity Colors */
            'rare-common':'#8A8C85',
            'rare-uncommon':'#3A8759',
            'rare-rare':'#3d6285',
            'rare-epic':'#7B3F9C',
            'rare-mythic':'#E38C1F',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
          },
          boxShadow:{
            'ambient':'0 20px 40px rgba(49,51,46,0.05)',
            'float':'0 20px 40px rgba(49,51,46,0.08)',
          },
        },
      },
    }
  </script>

  <style>
    *{box-sizing:border-box}
    body{
      font-family:'Manrope',sans-serif;background:#f2f6fa;color:#31332e;
      -webkit-tap-highlight-color:transparent;min-height:100dvh;letter-spacing:-0.005em;
    }
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    
    ::-webkit-scrollbar{display:none}
    body{-ms-overflow-style:none;scrollbar-width:none}

    /* Glass header */
    .glass-header{
      background:rgba(242,246,250,0.85);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      padding-top:env(safe-area-inset-top);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
      transition:box-shadow 0.2s ease;
    }
    .header-scrolled{box-shadow:0 8px 24px rgba(49,51,46,0.04)}

    /* Trophy Tile */
    .trophy-tile{
      background:#ffffff;
      border-radius:20px;
      padding:16px 12px;
      text-align:center;
      cursor:pointer;
      transition:all 0.15s ease;
      box-shadow:0 4px 12px rgba(49,51,46,0.03);
      position:relative;
    }
    .trophy-tile:active{transform:scale(0.96)}
        .trophy-tile.locked {
      opacity: 0.5; 
      filter: grayscale(100%); 
      background: #fbf9f4;
    }

    /* Featured Pin */
    .featured-pin{
      position:absolute;top:6px;right:6px;
      width:20px;height:20px;background:#D4A24C;
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      border:2px solid #fff;z-index:5;
    }

    /* Icon Wrappers */
    .icon-wrap-mission{
      width:60px;height:60px;
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 12px;
      color:white;
    }
    .icon-wrap-achievement{
      width:60px;height:60px;
      border-radius:18px; /* Squircle shape for achievements */
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 12px;
      color:white;
      position:relative;
    }
    .icon-locked{background:#e9e8e1;color:#b2b2ab}

    /* Rarity Backgrounds */
    .bg-common{background:#8A8C85;box-shadow:0 6px 16px rgba(138,140,133,0.25)}
    .bg-uncommon{background:#3A8759;box-shadow:0 6px 16px rgba(58,135,89,0.25)}
    .bg-rare{background:#3d6285;box-shadow:0 6px 16px rgba(61,98,133,0.25)}
    .bg-epic{background:#7B3F9C;box-shadow:0 6px 16px rgba(123,63,156,0.25)}
    .bg-mythic{background:#E38C1F;box-shadow:0 6px 16px rgba(227,140,31,0.25)}

    /* Text Colors */
    .text-common{color:#8A8C85}
    .text-uncommon{color:#3A8759}
    .text-rare{color:#3d6285}
    .text-epic{color:#7B3F9C}
    .text-mythic{color:#E38C1F}

    /* Progress Ring for in-progress achievements */
    .trophy-progress-ring{
      position:absolute;top:-4px;left:-4px;
      width:68px;height:68px;
      transform:rotate(-90deg);
      pointer-events:none;
    }

    /* Detail sheet */
    .detail-sheet{
      transform:translateY(100%);
      transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .detail-sheet.open{transform:translateY(0)}

    .progress-track{height:6px;background:#f5f4ed;border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(0.22,1,0.36,1)}

    /* Fade */
    .fade-up{opacity:0;transform:translateY(16px);transition:opacity 0.6s ease,transform 0.6s ease}
    .fade-up.visible{opacity:1;transform:translateY(0)}
    
    /* Skeleton */
    .skeleton{
      background:linear-gradient(90deg,#e8eff5 25%,#f0f5f9 50%,#e8eff5 75%);
      background-size:200% 100%;animation:shimmer 1.5s infinite;
      border-radius:20px;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>

<body>

<!-- HEADER -->
<header id="pageHeader" class="fixed top-0 w-full z-50 glass-header">
  <div class="max-w-[430px] mx-auto px-5 pt-10 pb-3 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg signature-gradient flex items-center justify-center shadow-sm">
      <span class="font-headline font-bold text-white" style="font-size:10px;">GSTW</span>
    </div>
    <h1 class="font-headline font-bold text-on-surface" style="font-size:20px;line-height:26px;">Trophies</h1>
  </div>
</header>

<!-- MAIN -->
<main class="pt-28 pb-32 px-5 max-w-[430px] mx-auto space-y-6">

  <!-- 1. SUBSCRIPTION ROADMAP -->
  <section class="fade-up">
    <div class="flex items-center justify-between mb-2 pl-1">
      <p class="font-body text-on-surface-variant" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Subscription Status</p>
      <a href="subscription.html" class="font-body font-bold text-primary" style="font-size:11px;">Upgrade Tier →</a>
    </div>

    <div class="bg-surface-cl rounded-3xl p-5 shadow-ambient-sm space-y-4">
      <div id="subscriptionRoadmapStrip" class="grid grid-cols-4 gap-2 text-center">
        <!-- Rendered via JS -->
      </div>

      <div id="activeStatusBanner" class="bg-surface-clow rounded-2xl p-4 text-center">
        <h3 id="statusBadgeName" class="font-headline font-extrabold text-on-surface" style="font-size:18px;">—</h3>
        <p id="statusBadgeTagline" class="font-body text-primary font-semibold text-[12px] mt-0.5">—</p>
      </div>
    </div>
  </section>

  <!-- 2. EVOLVING TROPHIES -->
  <section class="fade-up">
    <p class="font-body text-on-surface-variant mb-2 pl-1" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Evolving Trophies</p>
    <div id="achievementsGrid" class="grid grid-cols-2 gap-3">
      <div class="skeleton h-36"></div>
      <div class="skeleton h-36"></div>
    </div>
  </section>

</main>

<!-- TROPHY DETAIL OVERLAY (Missing in your original code) -->
<div id="detailOverlay" class="fixed inset-0 z-[100] hidden">
  <div class="absolute inset-0 bg-on-surface/40 backdrop-blur-sm" onclick="closeDetail()"></div>
  <div id="detailSheet" class="absolute bottom-0 inset-x-0 bg-surface-cl rounded-t-[32px] detail-sheet p-8 pt-6 max-w-[430px] mx-auto">
    <div class="w-12 h-1.5 bg-surface-chigh rounded-full mx-auto mb-6"></div>
    
    <div class="text-center">
      <p id="detailStatus" class="font-body font-bold uppercase tracking-wider mb-2 text-[10px]">—</p>
      <div id="detailIconWrap" class="w-24 h-24 mx-auto mb-4 rounded-[24px] flex items-center justify-center">
        <span id="detailIcon" class="material-symbols-outlined text-[48px]"></span>
      </div>
      <div class="flex items-center justify-center gap-2 mb-2">
        <h2 id="detailTitle" class="font-headline font-extrabold text-on-surface text-2xl">Title</h2>
        <span id="detailRarity" class="hidden"></span>
      </div>
      <p id="detailDesc" class="font-body text-on-surface-variant leading-relaxed px-4 mb-8">Description goes here.</p>
    </div>

    <div id="detailProgressWrap" class="hidden space-y-3 bg-surface-clow p-5 rounded-2xl">
      <div class="flex justify-between items-end">
        <span class="font-body text-[11px] font-bold text-on-surface-variant uppercase tracking-wide">Progress</span>
        <span id="detailProgressText" class="font-headline font-bold text-primary text-sm">—</span>
      </div>
      <div class="progress-track">
        <div id="detailBar" class="progress-fill" style="width: 0%"></div>
      </div>
      <p id="detailRemainingText" class="font-body text-[11px] text-center text-on-surface-variant">---</p>
    </div>

    <button onclick="closeDetail()" class="w-full mt-8 py-4 bg-on-surface text-surface-cl font-headline font-bold rounded-2xl active:scale-[0.98] transition-transform">
      Got it
    </button>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var RARITY_COLORS = {
  'common':   { bg: 'bg-common',   text: 'text-common' },
  'uncommon': { bg: 'bg-uncommon', text: 'text-uncommon' },
  'rare':     { bg: 'bg-rare',     text: 'text-rare' },
  'epic':     { bg: 'bg-epic',     text: 'text-epic' },
  'mythic':   { bg: 'bg-mythic',   text: 'text-mythic' }
}

var currentUser = null
var userProfile = null
var totalShares = 0
var totalRecruits = 0

// Added Visibility Observer
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible') })
}, { threshold: 0.1 })

async function init() {
  var s = await supabaseClient.auth.getSession()
  if (!s.data.session) { window.location.href = 'login.html'; return }
  currentUser = s.data.session.user

  await loadData()
  render()
  
  // Start observing animations
  document.querySelectorAll('.fade-up').forEach(function(el) { observer.observe(el) })
}

var totalPaidCountries = 0; // Add this global variable

async function loadData() {
  try {
    var results = await Promise.allSettled([
      supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single(),
      supabaseClient.from('shares').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id),
      // NEW: Fetch all recruits referred by this user who are NOT on the 'free' tier
      supabaseClient.from('profiles')
        .select('country, subscription_tier')
        .eq('referred_by', userProfile.invite_code)
        .neq('subscription_tier', 'free') 
    ]);

    userProfile = (results[0].status === 'fulfilled' && results[0].value.data) ? results[0].value.data : {};
    totalShares = (results[1].status === 'fulfilled') ? (results[1].value.count || 0) : 0
    totalRecruits = userProfile.recruit_count || 0;

    // Calculate unique paid countries
    if (results[2].status === 'fulfilled' && results[2].value.data) {
      var paidRecruits = results[2].value.data;
      // Filter for unique country names, ignoring empty ones
      var uniqueCountries = [...new Set(paidRecruits.map(r => r.country).filter(c => c && c.trim() !== ""))];
      totalPaidCountries = uniqueCountries.length;
    }

  } catch (err) {
    console.error('Load error:', err);
  }
}
function render() {
  renderSubscriptionRoadmap()
  renderTrophies()
}

function renderSubscriptionRoadmap() {
  var container = document.getElementById('subscriptionRoadmapStrip')
  if (!container) return
  container.innerHTML = ''

  var userTier = (userProfile.subscription_tier || 'free').toLowerCase()

  if (typeof SUBSCRIPTION_ROADMAP !== 'undefined') {
    SUBSCRIPTION_ROADMAP.forEach(function(item) {
      var isActive = item.key === userTier
      var card = document.createElement('div')
      card.className = 'flex flex-col items-center p-2 rounded-2xl transition-all ' + (isActive ? 'bg-primary-container/30 ring-2 ring-primary' : 'opacity-50 grayscale')
      
      card.innerHTML = 
        '<img src="' + item.image + '" class="w-12 h-12 rounded-full mb-1.5 ' + (isActive ? '' : 'opacity-70') + '">' +
        '<span class="font-headline font-bold text-[11px] ' + (isActive ? 'text-primary' : 'text-on-surface-variant') + '">' + item.name + '</span>' +
        '<span class="font-body text-[9px] text-outline">' + (isActive ? 'Active' : item.price) + '</span>'

      container.appendChild(card)
    })
  }

  // Safety check to ensure function exists in badges-config.js
  if (typeof getUserSubscriptionBadge === 'function') {
    var activeObj = getUserSubscriptionBadge(userProfile)
    document.getElementById('statusBadgeName').textContent = activeObj.name || 'Warrior'
    document.getElementById('statusBadgeTagline').textContent = activeObj.tagline || 'Spreading the Word'
  }
}

function renderTrophies() {
  var container = document.getElementById('achievementsGrid');
  if (!container) return;
  container.innerHTML = '';

  if (typeof EVOLVING_TROPHIES !== 'undefined') {
    EVOLVING_TROPHIES.forEach(function(trophy) {
      // PASS ALL 4 ARGUMENTS NOW
      var state = getTrophyState(trophy, totalShares, totalRecruits, totalPaidCountries);
      
      var activeTier = state.activeTier;
      var colors = RARITY_COLORS[activeTier.rarity] || { bg: 'bg-primary', text: 'text-primary' };

      var tile = document.createElement('div');
      tile.className = 'trophy-tile ' + (state.isUnlocked ? '' : 'locked');
      tile.onclick = function() { openDetail(trophy, state) };

      var iconWrapHtml = '<div class="icon-wrap-achievement ' + (state.isUnlocked ? colors.bg : 'bg-surface-chigh') + '">'
      iconWrapHtml += '<span class="material-symbols-outlined text-[28px] ' + (state.isUnlocked ? 'text-white filled' : 'text-outline') + '">' + trophy.icon + '</span></div>';

      var levelLabel = state.isUnlocked ? 'Lvl ' + activeTier.level + ' · ' + activeTier.rarity : 'Locked';

      tile.innerHTML = iconWrapHtml
        + '<p class="font-headline font-bold text-on-surface leading-tight mb-1" style="font-size:13px;">' + trophy.title + '</p>'
        + '<p class="font-body font-bold uppercase tracking-widest ' + (state.isUnlocked ? colors.text : 'text-outline') + '" style="font-size:9px">' + levelLabel + '</p>';

      container.appendChild(tile);
    });
  }
}

function openDetail(trophy, state) {
  var activeTier = state.activeTier
  var colors = RARITY_COLORS[activeTier.rarity] || { bg: 'bg-primary', text: 'text-primary' }

  document.getElementById('detailStatus').textContent = state.isUnlocked ? 'Level ' + activeTier.level + ' Unlocked' : 'Locked'
  document.getElementById('detailStatus').className = 'font-body font-bold uppercase tracking-wider mb-2 text-[10px] ' + (state.isUnlocked ? colors.text : 'text-outline')

  var rarityEl = document.getElementById('detailRarity')
  rarityEl.textContent = activeTier.rarity
  rarityEl.className = 'px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider text-white ' + colors.bg
  rarityEl.classList.remove('hidden')

  var iconWrap = document.getElementById('detailIconWrap')
  iconWrap.className = 'w-24 h-24 mx-auto mb-4 relative flex items-center justify-center rounded-[24px] ' + (state.isUnlocked ? colors.bg : 'bg-surface-chigh')
  
  var iconEl = document.getElementById('detailIcon')
  iconEl.className = 'material-symbols-outlined text-[48px] ' + (state.isUnlocked ? 'text-white filled' : 'text-outline')
  iconEl.textContent = trophy.icon

  document.getElementById('detailTitle').textContent = activeTier.name
  document.getElementById('detailDesc').textContent = activeTier.desc

  var progWrap = document.getElementById('detailProgressWrap')
  progWrap.classList.remove('hidden')

  if (state.nextTier) {
    document.getElementById('detailProgressText').textContent = state.count + ' / ' + state.nextTier.req
    document.getElementById('detailRemainingText').textContent = (state.nextTier.req - state.count) + ' more to evolve to ' + state.nextTier.name
    var bar = document.getElementById('detailBar')
    bar.className = 'progress-fill ' + (RARITY_COLORS[state.nextTier.rarity]?.bg || 'bg-primary')
    bar.style.width = state.progressPercent + '%'
  } else {
    document.getElementById('detailProgressText').textContent = 'MAX LEVEL'
    document.getElementById('detailRemainingText').textContent = 'Mastery achieved!'
    document.getElementById('detailBar').style.width = '100%'
  }

  document.getElementById('detailOverlay').classList.remove('hidden')
  setTimeout(() => {
    document.getElementById('detailSheet').classList.add('open')
  }, 10)
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open')
  setTimeout(function() {
    document.getElementById('detailOverlay').classList.add('hidden')
  }, 300)
}

init()
</script></body>
</html>
