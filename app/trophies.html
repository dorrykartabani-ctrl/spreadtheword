    .text-uncommon{color:#3A8759}
    .text-rare{color:#3d6285}
    .text-epic{color:#7B3F9C}
    .text-mythic{color:#E38C1F}

    /* Progress Ring for in-progress achievements */
    .trophy-progress-ring{
      position:absolute;top:-4px;left:-4px;
      width:68px;height:68px;
      transform:rotate(-90deg);
      pointer-events:none;
    }

      transform:translateY(100%);

// ════════════════════════════════════════════
// ACHIEVEMENT CATALOG (Fortnite Rarity system)

// ════════════════════════════════════════════
var ACHIEVEMENT_CATALOG = [

  { id:'sower_1',    type:'achievement', base:'sower', title:'The Sower', desc:'You planted your first seed. The harvest begins.', icon:'grass', rarity:'common', criteria:{shares:1} },

]

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
var currentUser = null
var userProfile = null
var totalShares = 0
var totalRecruits = 0
var userMissions = [] // Mission badges from user_missions table (future)
var featuredTrophies = []
var selectedTrophy = null

var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) entry.target.classList.add('visible')
  })
}, { threshold: 0.1 })

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
async function init() {
  var s = await supabaseClient.auth.getSession()
  if (!s.data.session) { window.location.href = 'login.html'; return }
  currentUser = s.data.session.user

  setupListeners()
  await loadData()
  render()

  document.querySelectorAll('.fade-up').forEach(function(el) { observer.observe(el) })
}

async function loadData() {
  try {
    var results = await Promise.allSettled([
      supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single(),
      supabaseClient.from('shares').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id),
      // Future: load from user_missions table
      // supabaseClient.from('user_missions').select('*').eq('user_id', currentUser.id)
    ])

    userProfile = (results[0].status === 'fulfilled' && results[0].value.data) ? results[0].value.data : {}
    totalShares = (results[1].status === 'fulfilled') ? (results[1].value.count || 0) : 0
    totalRecruits = userProfile.recruit_count || 0
    featuredTrophies = userProfile.featured_badges || []
    
    // Mock user_missions for now
    userMissions = [] 
    
    // Fallback if total_shares isn't updated in profile
    if (userProfile.total_shares === undefined) userProfile.total_shares = totalShares

  } catch (err) {
    console.error('Load error:', err)
  }
}

// ════════════════════════════════════════════
// LOGIC: EARNED & PROGRESS
// ════════════════════════════════════════════
function isTrophyEarned(trophy) {
  var c = trophy.criteria
  if (c.shares !== undefined) return totalShares >= c.shares
  if (c.recruits !== undefined) return totalRecruits >= c.recruits
  return false
}

function getTrophyProgress(trophy) {
  var c = trophy.criteria
  var current = 0, threshold = 1
  if (c.shares !== undefined) { current = totalShares; threshold = c.shares }
  else if (c.recruits !== undefined) { current = totalRecruits; threshold = c.recruits }
  
  return {
    current: current,
    threshold: threshold,
    percent: Math.min(Math.round((current / threshold) * 100), 100)
  }
}

// Get the highest earned tier OR the next unearned tier for each base
function getEffectiveAchievements() {
  var byBase = {}
  ACHIEVEMENT_CATALOG.forEach(function(t) {
    if (!byBase[t.base]) byBase[t.base] = []
    byBase[t.base].push(t)
  })

  var effective = []
  Object.keys(byBase).forEach(function(base) {
    // Sort ascending by threshold requirement
    var tiers = byBase[base].sort(function(a, b) {
      var aVal = a.criteria.shares || a.criteria.recruits || 0
      var bVal = b.criteria.shares || b.criteria.recruits || 0
      return aVal - bVal
    })
    
    var highestEarned = null
    var nextToEarn = null
    
    for (var i = 0; i < tiers.length; i++) {
      if (isTrophyEarned(tiers[i])) {
        highestEarned = tiers[i]
      } else {
        nextToEarn = tiers[i]
        break // Stop at the first unearned
      }
    }
    
    effective.push(highestEarned || nextToEarn || tiers[0])
  })

  return effective
}

    nameEl.textContent = badge.name
    taglineEl.textContent = badge.tagline
    descEl.textContent = badge.description
  } else {
    imgWrap.innerHTML = '<div class="w-[120px] h-[120px] rounded-full bg-surface-chigh flex items-center justify-center"><span class="material-symbols-outlined text-outline" style="font-size:40px;">shield</span></div>'
    nameEl.textContent = 'Warrior'
    taglineEl.textContent = 'Keep sharing to unlock'
    descEl.textContent = ''
  }
}

function renderAchievements() {
  var container = document.getElementById('achievementsGrid')
  container.innerHTML = ''
  
  // Show ALL trophies from the catalog
  ACHIEVEMENT_CATALOG.forEach(function(trophy) {
    var earned = isTrophyEarned(trophy)
    var progress = getTrophyProgress(trophy)
    var isFeatured = featuredTrophies.indexOf(trophy.id) !== -1
    
    var tile = document.createElement('div')
    tile.className = 'trophy-tile ' + (earned ? '' : 'locked')
    tile.onclick = function() { openDetail(trophy) }

    var colors = RARITY_COLORS[trophy.rarity]
    
    // Icon Wrapper (Squircle)
    var iconWrapHtml = '<div class="icon-wrap-achievement ' + colors.bg + '">'
    
    // Progress Ring if locked
    if (!earned && progress.percent > 0) {
      var c = 2 * Math.PI * 30
      var offset = c - (progress.percent / 100) * c
      var strokeColor = trophy.rarity === 'uncommon' ? '#3A8759' : trophy.rarity === 'rare' ? '#3d6285' : trophy.rarity === 'epic' ? '#7B3F9C' : trophy.rarity === 'mythic' ? '#E38C1F' : '#8A8C85'
      
      iconWrapHtml += '<svg class="trophy-progress-ring" viewBox="0 0 68 68">'
        + '<rect x="4" y="4" width="60" height="60" rx="14" fill="none" stroke="rgba(94,96,89,0.1)" stroke-width="3"/>'
        + '<rect x="4" y="4" width="60" height="60" rx="14" fill="none" stroke="' + strokeColor + '" stroke-width="3" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/>'
        + '</svg>'
    }
    
    iconWrapHtml += '<span class="material-symbols-outlined text-white text-[28px] ' + (earned ? 'filled' : '') + '">' + trophy.icon + '</span></div>'

    var pinHtml = isFeatured ? '<div class="featured-pin"><span class="material-symbols-outlined text-white filled" style="font-size:12px">push_pin</span></div>' : ''
    
    var labelHtml = earned 
      ? '<p class="font-body font-bold uppercase tracking-widest ' + colors.text + '" style="font-size:9px">' + trophy.rarity + '</p>'
      : '<p class="font-body font-semibold text-outline-variant" style="font-size:9px">' + progress.percent + '%</p>'

    tile.innerHTML = pinHtml
      + iconWrapHtml
      + '<p class="font-headline font-bold text-on-surface leading-tight mb-1" style="font-size:13px;">' + trophy.title + '</p>'
      + labelHtml

    container.appendChild(tile)
  })
}
// ════════════════════════════════════════════
// DETAIL MODAL
// ════════════════════════════════════════════
function openDetail(trophy) {
  selectedTrophy = trophy
  var earned = isTrophyEarned(trophy)
  var progress = getTrophyProgress(trophy)
  var isFeatured = featuredTrophies.indexOf(trophy.id) !== -1

  var colors = RARITY_COLORS[trophy.rarity]

  // Header & Status
  var statusEl = document.getElementById('detailStatus')
  var rarityEl = document.getElementById('detailRarity')
  
  if (earned) {
    statusEl.textContent = '✓ Earned'
    statusEl.className = 'font-body font-bold uppercase tracking-wider ' + colors.text
    rarityEl.textContent = trophy.rarity
    rarityEl.className = 'px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider text-white ' + colors.bg
    rarityEl.classList.remove('hidden')
  } else {
    statusEl.textContent = '🔒 Locked'
    statusEl.className = 'font-body font-bold uppercase tracking-wider text-outline-variant'
    rarityEl.classList.add('hidden')
  }

  // Icon
  var iconWrap = document.getElementById('detailIconWrap')
  var iconEl = document.getElementById('detailIcon')
  
  if (trophy.type === 'achievement') {
    iconWrap.className = 'mx-auto mb-4 relative flex items-center justify-center rounded-[24px] ' + (earned ? colors.bg : 'bg-surface-chigh')
    iconEl.className = 'material-symbols-outlined text-[40px] ' + (earned ? 'text-white filled' : 'text-outline-variant')
  }
  iconEl.textContent = trophy.icon

  // Text
  document.getElementById('detailTitle').textContent = trophy.title
  document.getElementById('detailDesc').textContent = trophy.desc

  // Progress Bar
  var progWrap = document.getElementById('detailProgressWrap')
  if (!earned) {
    progWrap.classList.remove('hidden')
    document.getElementById('detailProgressText').textContent = progress.current + ' / ' + progress.threshold
    document.getElementById('detailRemainingText').textContent = (progress.threshold - progress.current) + ' more to unlock'
    
    var bar = document.getElementById('detailBar')
    // Set bar color based on target rarity
    bar.className = 'progress-fill ' + colors.bg
    bar.style.width = '0%'
    setTimeout(function() { bar.style.width = progress.percent + '%' }, 200)
  } else {
    progWrap.classList.add('hidden')
  }

  // Feature Button
  var featBtn = document.getElementById('detailFeatureBtn')
  if (earned) {
    featBtn.classList.remove('hidden')
    featBtn.className = 'w-full mb-3 py-3.5 text-white font-headline font-bold rounded-xl active:scale-[0.98] transition-transform ' + colors.bg
    if (isFeatured) {
      document.getElementById('detailFeatureIcon').textContent = 'close'
      document.getElementById('detailFeatureText').textContent = 'Unpin from Profile'
      featBtn.className = 'w-full mb-3 py-3.5 bg-surface-chigh text-on-surface-variant font-headline font-bold rounded-xl active:scale-[0.98] transition-transform'
    } else {
      document.getElementById('detailFeatureIcon').textContent = 'push_pin'
      document.getElementById('detailFeatureText').textContent = 'Feature on Profile'
    }
  } else {
    featBtn.classList.add('hidden')
  }

  // Show
  document.getElementById('detailOverlay').classList.remove('hidden')
  requestAnimationFrame(function() {
    document.getElementById('detailSheet').classList.add('open')
  })
}

function closeDetail() {
  document.getElementById('detailSheet').classList.remove('open')
  setTimeout(function() {
    document.getElementById('detailOverlay').classList.add('hidden')
  }, 300)
  selectedTrophy = null
}

async function toggleFeature() {
  if (!selectedTrophy) return
  var idx = featuredTrophies.indexOf(selectedTrophy.id)

  if (idx !== -1) {
    featuredTrophies.splice(idx, 1)
  } else {
    if (featuredTrophies.length >= 3) {
      alert('You can only feature up to 3 trophies. Unpin one first.')
      return
    }
    featuredTrophies.push(selectedTrophy.id)
  }

  // Optimistic update
  renderAchievements()
  closeDetail()

  // Save
  try {
    await supabaseClient.from('profiles').update({ featured_badges: featuredTrophies }).eq('id', currentUser.id)
  } catch (e) {
    console.error('Save featured failed:', e)
  }
}

// ════════════════════════════════════════════
// LISTENERS
// ════════════════════════════════════════════
function setupListeners() {
  var header = document.getElementById('pageHeader')
  window.addEventListener('scroll', function() {
    header.classList.toggle('header-scrolled', window.scrollY > 8)
  })
}

init()
</script>
