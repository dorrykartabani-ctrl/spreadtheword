<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Trophies — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','surface-chigh':'#e9e8e1','surface-chighest':'#e3e3db',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'inverse-surface':'#0e0e0c','inverse-on-surface':'#9e9d99',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'secondary':'#41637c',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'primary-dim':'#305678',
            'background':'#fbf9f4','on-background':'#31332e','surface-variant':'#e3e3db',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
          },
          boxShadow:{
            'ambient':'0 20px 40px rgba(49,51,46,0.05)',
            'float':'0 20px 40px rgba(49,51,46,0.08)',
          },
        },
      },
    }
  </script>

  <style>
    body{font-family:'Manrope',sans-serif;background:#fbf9f4;color:#31332e;-webkit-tap-highlight-color:transparent;min-height:100dvh;letter-spacing:-0.005em}
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    ::-webkit-scrollbar{display:none}
    body{-ms-overflow-style:none;scrollbar-width:none}
    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}
    .glass-header{background:rgba(251,249,244,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:box-shadow 0.2s ease}
    .header-scrolled{box-shadow:0 8px 24px rgba(49,51,46,0.04)}
    .glass-nav{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .trophy-tile{background:#ffffff;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:all 0.2s ease;position:relative}
    .trophy-tile:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(49,51,46,0.06)}
    .trophy-tile:active{transform:translateY(0) scale(0.98)}
    .trophy-tile.earned{background:linear-gradient(145deg,#ffffff,#f5f4ed)}
    .trophy-tile.earned::after{content:'';position:absolute;inset:0;border-radius:16px;background:radial-gradient(circle at 30% 20%,rgba(61,98,133,0.08) 0%,transparent 60%);pointer-events:none}
    .trophy-tile.locked{background:#f5f4ed;opacity:0.6}
    .trophy-icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;position:relative}
    .trophy-icon-earned{background:linear-gradient(135deg,#3d6285,#6b9bc3)}
    .trophy-icon-progress{background:#f5f4ed}
    .trophy-icon-locked{background:#efeee7}
    .trophy-progress-ring{position:absolute;top:-3px;left:-3px;width:54px;height:54px;transform:rotate(-90deg)}
    .trophy-filter{display:flex;background:#f5f4ed;border-radius:10px;padding:3px;gap:2px}
    .trophy-filter-btn{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:#5e6059;transition:all 0.2s ease}
    .trophy-filter-btn.active{background:#ffffff;color:#3d6285;box-shadow:0 2px 6px rgba(49,51,46,0.05)}
    .detail-sheet{transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1)}
    .detail-sheet.open{transform:translateY(0)}
    .progress-track{height:8px;background:#f5f4ed;border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(0.22,1,0.36,1)}
    .progress-primary{background:linear-gradient(90deg,#305678,#3d6285,#6b9bc3)}
    .fade-up{opacity:0;transform:translateY(16px);transition:opacity 0.6s ease,transform 0.6s ease}
    .fade-up.visible{opacity:1;transform:translateY(0)}
  </style>
</head>

<body>

<header id="pageHeader" class="fixed top-0 w-full z-50 glass-header">
  <div class="max-w-[430px] mx-auto px-5 pt-10 pb-3 flex items-center gap-2.5">
    <img src="/icons/icon-128.png" alt="GSTW" class="w-7 h-7 rounded-lg">
    <h1 class="font-headline font-bold text-on-surface" style="font-size:20px;line-height:26px;">Trophies</h1>
  </div>
</header>

<main class="pt-28 pb-32 px-5 max-w-[430px] mx-auto space-y-5">

  <!-- TROPHY WALL -->
  <section class="fade-up">
    <div class="flex items-center justify-between mb-3">
      <p class="font-body text-on-surface-variant" style="font-size:12px;font-weight:500;">Trophy Wall</p>
      <div class="trophy-filter">
        <button id="trophyAll" onclick="setTrophyFilter('all')" class="trophy-filter-btn active">All</button>
        <button id="trophyEarned" onclick="setTrophyFilter('earned')" class="trophy-filter-btn">Earned</button>
      </div>
    </div>
    <div id="trophyGrid" class="grid grid-cols-3 gap-3">
      <div class="bg-surface-clow rounded-xl h-28 animate-pulse"></div>
      <div class="bg-surface-clow rounded-xl h-28 animate-pulse"></div>
      <div class="bg-surface-clow rounded-xl h-28 animate-pulse"></div>
    </div>
  </section>

  <!-- BADGES -->
  <section id="badgesSection" class="hidden fade-up">
    <p class="font-body text-on-surface-variant mb-3" style="font-size:12px;font-weight:500;">Badges</p>
    <div id="badgesContainer" class="flex flex-wrap gap-2"></div>
  </section>

</main>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 left-0 w-full glass-nav z-40" style="padding-bottom:max(16px,env(safe-area-inset-bottom))">
  <div class="flex justify-around items-center px-2 pt-2 pb-1 max-w-[430px] mx-auto">
    <a href="index.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5">
      <span class="material-symbols-outlined text-outline text-[22px]">home</span>
      <span class="font-body text-outline" style="font-size:10px;font-weight:500;">Home</span>
    </a>
    <a href="cause.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5">
      <span class="material-symbols-outlined text-outline text-[22px]">volunteer_activism</span>
      <span class="font-body text-outline" style="font-size:10px;font-weight:500;">Missions</span>
    </a>
    <a href="impact.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5">
      <span class="material-symbols-outlined text-outline text-[22px]">bar_chart</span>
      <span class="font-body text-outline" style="font-size:10px;font-weight:500;">Impact</span>
    </a>
    <a href="trophies.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5">
      <span class="material-symbols-outlined text-primary text-[22px] filled">emoji_events</span>
      <span class="font-body text-primary" style="font-size:10px;font-weight:700;">Trophies</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 relative">
      <span class="material-symbols-outlined text-outline text-[22px]">person</span>
      <span class="font-body text-outline" style="font-size:10px;font-weight:500;">Profile</span>
    </a>
  </div>
</nav>

<!-- TROPHY DETAIL SHEET -->
<div id="detailOverlay" class="hidden fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-[100]" onclick="closeDetail()"></div>
<div id="detailSheet" class="detail-sheet fixed bottom-0 left-0 right-0 z-[101] bg-surface-cl rounded-t-3xl shadow-ambient max-w-[430px] mx-auto">
  <div class="p-6 pb-8" style="padding-bottom:max(32px,env(safe-area-inset-bottom))">
    <div class="w-10 h-1 bg-outline-variant/30 rounded-full mx-auto mb-5"></div>
    <div class="text-center">
      <div id="detailIconWrap" class="trophy-icon-wrap mx-auto mb-4" style="width:72px;height:72px;border-radius:18px">
        <span id="detailIcon" class="material-symbols-outlined text-[32px]"></span>
      </div>
      <p id="detailStatus" class="font-body font-bold uppercase tracking-wider mb-2" style="font-size:10px;">—</p>
      <h3 id="detailTitle" class="font-headline font-bold text-on-surface mb-2" style="font-size:20px;line-height:26px;">—</h3>
      <p id="detailDesc" class="font-body text-on-surface-variant mb-5 leading-relaxed" style="font-size:14px;">—</p>
      <div id="detailProgressWrap" class="hidden mb-5">
        <div class="progress-track mb-2">
          <div id="detailBar" class="progress-fill progress-primary" style="width:0%"></div>
        </div>
        <p id="detailProgressText" class="font-body font-semibold text-on-surface-variant" style="font-size:12px;">—</p>
      </div>
      <button onclick="closeDetail()" class="w-full py-3.5 signature-gradient text-on-primary font-headline font-bold rounded-xl active:scale-[0.98] transition-transform" style="font-size:15px;">Continue</button>
    </div>
  </div>
</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var currentUser = null, userProfile = null, allShares = [], trophyFilter = 'all'

var milestones = [
  {id:'first_share',type:'shares',threshold:1,title:'First Word',desc:'Share your first quote to spark the fire',icon:'stars'},
  {id:'shares_10',type:'shares',threshold:10,title:'10 Words Shared',desc:'Reach 10 shares to prove your commitment',icon:'shield'},
  {id:'shares_50',type:'shares',threshold:50,title:'50 Words Shared',desc:'A steady witness — 50 words strong',icon:'military_tech'},
  {id:'shares_100',type:'shares',threshold:100,title:'Century Sharer',desc:'100 words spread across the world',icon:'military_tech'},
  {id:'shares_200',type:'shares',threshold:200,title:'200 Words',desc:'Your voice is echoing far and wide',icon:'workspace_premium'},
  {id:'shares_500',type:'shares',threshold:500,title:'500 Words',desc:'A prolific herald of the Word',icon:'emoji_events'},
  {id:'streak_3',type:'streak',threshold:3,title:'3 Day Streak',desc:'Share 3 days in a row',icon:'local_fire_department'},
  {id:'streak_7',type:'streak',threshold:7,title:'7 Day Streak',desc:'A week of consistent witness',icon:'local_fire_department'},
  {id:'streak_30',type:'streak',threshold:30,title:'30 Day Streak',desc:'A full month of daily sharing',icon:'local_fire_department'},
  {id:'streak_100',type:'streak',threshold:100,title:'Century Streak',desc:'100 straight days of faithfulness',icon:'emoji_events'},
  {id:'recruit_1',type:'recruits',threshold:1,title:'First Recruit',desc:'Invite your first warrior to join',icon:'handshake'},
  {id:'recruit_5',type:'recruits',threshold:5,title:'Squad Leader',desc:'5 warriors follow your call',icon:'groups'},
  {id:'recruit_25',type:'recruits',threshold:25,title:'Battalion Chief',desc:'25 warriors — building an army',icon:'workspace_premium'}
]

var badgeInfo = {'foundation_member':{name:'Foundation Member',icon:'shield',desc:'Joined during the first wave'}}

var observer = new IntersectionObserver(function(entries){
  entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})
},{threshold:0.05})

async function init(){
  var s = await supabaseClient.auth.getSession()
  if(!s.data||!s.data.session){window.location.href='login.html';return}
  currentUser = s.data.session.user

  var results = await Promise.allSettled([
    supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single(),
    supabaseClient.from('shares').select('shared_at').eq('user_id',currentUser.id)
  ])

  userProfile = (results[0].status==='fulfilled'&&results[0].value.data)?results[0].value.data:{}
  allShares = (results[1].status==='fulfilled'&&results[1].value.data)?results[1].value.data:[]

  renderTrophyWall()
  renderBadges()

  setTimeout(function(){document.querySelectorAll('.fade-up').forEach(function(el){observer.observe(el)})},50)

  window.addEventListener('scroll',function(){
    document.getElementById('pageHeader').classList.toggle('header-scrolled',window.scrollY>8)
  })
}

function getMilestoneValue(m){
  if(!m)return 0
  if(m.type==='shares')return allShares.length
  if(m.type==='streak')return userProfile.current_streak||0
  if(m.type==='recruits')return userProfile.recruit_count||0
  return 0
}

function renderTrophyWall(){
  var container=document.getElementById('trophyGrid');if(!container)return
  container.innerHTML=''

  var list=trophyFilter==='earned'
    ?milestones.filter(function(m){return getMilestoneValue(m)>=m.threshold})
    :milestones

  if(list.length===0){
    container.innerHTML='<p class="col-span-3 text-center font-body text-outline py-8" style="font-size:13px;">No trophies earned yet</p>'
    return
  }

  list.forEach(function(m){
    var val=getMilestoneValue(m),earned=val>=m.threshold
    var progress=Math.min(Math.round((val/m.threshold)*100),100)
    var inProgress=!earned&&val>0

    var tile=document.createElement('div')
    tile.className='trophy-tile '+(earned?'earned':inProgress?'in-progress':'locked')
    tile.onclick=function(){openDetail(m)}

    var iconClass=earned?'trophy-icon-earned':inProgress?'trophy-icon-progress':'trophy-icon-locked'
    var iconColor=earned?'text-on-primary':inProgress?'text-primary':'text-outline'
    var ringHtml=''
    if(inProgress){
      var c=2*Math.PI*23,offset=c-(progress/100)*c
      ringHtml='<svg class="trophy-progress-ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="rgba(61,98,133,0.1)" stroke-width="3"/><circle cx="27" cy="27" r="23" fill="none" stroke="#3d6285" stroke-width="3" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'" stroke-linecap="round"/></svg>'
    }

    tile.innerHTML=
      '<div class="trophy-icon-wrap '+iconClass+'">'+ringHtml
        +'<span class="material-symbols-outlined '+iconColor+' text-[22px] '+(earned?'filled':'')+'" style="position:relative;z-index:1">'+m.icon+'</span>'
      +'</div>'
      +'<p class="font-headline font-bold text-on-surface leading-tight mb-0.5" style="font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+m.title+'</p>'
      +(earned
        ?'<p class="font-body font-semibold text-primary" style="font-size:9px;">Earned</p>'
        :inProgress
          ?'<p class="font-body font-semibold text-on-surface-variant" style="font-size:9px;">'+progress+'%</p>'
          :'<p class="font-body font-semibold text-outline" style="font-size:9px;">Locked</p>')

    container.appendChild(tile)
  })
}

function setTrophyFilter(filter){
  trophyFilter=filter
  document.getElementById('trophyAll').classList.toggle('active',filter==='all')
  document.getElementById('trophyEarned').classList.toggle('active',filter==='earned')
  renderTrophyWall()
}

function renderBadges(){
  var badges=userProfile.badges||[]
  var section=document.getElementById('badgesSection')
  var container=document.getElementById('badgesContainer')
  if(!section||!container)return
  if(badges.length===0){section.classList.add('hidden');return}
  section.classList.remove('hidden')
  container.innerHTML=''
  badges.forEach(function(bid){
    var info=badgeInfo[bid];if(!info)return
    var el=document.createElement('div')
    el.className='flex items-center gap-2 px-3 py-2 rounded-xl bg-primary-container/20'
    el.innerHTML='<span class="material-symbols-outlined text-primary text-[16px] filled">'+info.icon+'</span><div><span class="font-body font-semibold text-on-surface block" style="font-size:11px;">'+info.name+'</span><span class="font-body text-on-surface-variant" style="font-size:9px;">'+info.desc+'</span></div>'
    container.appendChild(el)
  })
}

function openDetail(m){
  if(!m)return
  var val=getMilestoneValue(m),earned=val>=m.threshold
  var progress=Math.min(Math.round((val/m.threshold)*100),100)
  var inProgress=!earned&&val>0
  var iconWrap=document.getElementById('detailIconWrap')
  var iconEl=document.getElementById('detailIcon')
  var statusEl=document.getElementById('detailStatus')
  var progressWrap=document.getElementById('detailProgressWrap')
  var detailBar=document.getElementById('detailBar')
  var progressText=document.getElementById('detailProgressText')
  if(!iconWrap||!iconEl||!statusEl)return
  iconWrap.style.cssText='width:72px;height:72px;border-radius:18px'
  if(earned){
    iconWrap.className='trophy-icon-wrap trophy-icon-earned mx-auto mb-4'
    iconEl.className='material-symbols-outlined text-on-primary text-[32px] filled'
    statusEl.textContent='✓ Earned';statusEl.className='font-body font-bold uppercase tracking-wider mb-2 text-primary';statusEl.style.fontSize='10px'
    if(progressWrap)progressWrap.classList.add('hidden')
  }else if(inProgress){
    iconWrap.className='trophy-icon-wrap trophy-icon-progress mx-auto mb-4'
    iconEl.className='material-symbols-outlined text-primary text-[32px]'
    statusEl.textContent='In Progress';statusEl.className='font-body font-bold uppercase tracking-wider mb-2 text-primary';statusEl.style.fontSize='10px'
    if(progressWrap)progressWrap.classList.remove('hidden')
    if(detailBar)setTimeout(function(){detailBar.style.width=progress+'%'},100)
    if(progressText)progressText.textContent=val+' / '+m.threshold+' · '+(m.threshold-val)+' to go'
  }else{
    iconWrap.className='trophy-icon-wrap trophy-icon-locked mx-auto mb-4'
    iconEl.className='material-symbols-outlined text-outline text-[32px]'
    statusEl.textContent='🔒 Locked';statusEl.className='font-body font-bold uppercase tracking-wider mb-2 text-outline';statusEl.style.fontSize='10px'
    if(progressWrap)progressWrap.classList.remove('hidden')
    if(detailBar)detailBar.style.width='0%'
    if(progressText)progressText.textContent='0 / '+m.threshold
  }
  iconEl.textContent=m.icon
  document.getElementById('detailTitle').textContent=m.title
  document.getElementById('detailDesc').textContent=m.desc
  document.getElementById('detailOverlay').classList.remove('hidden')
  requestAnimationFrame(function(){document.getElementById('detailSheet').classList.add('open')})
}

function closeDetail(){
  document.getElementById('detailSheet').classList.remove('open')
  setTimeout(function(){document.getElementById('detailOverlay').classList.add('hidden')},300)
}

init()
</script>
</body>
</html>
