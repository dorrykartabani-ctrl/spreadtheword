<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Notifications — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','on-surface':'#31332e','on-surface-variant':'#5e6059',
            'outline':'#7a7b75','primary':'#3d6285','on-primary':'#f7f9ff',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    body{font-family:'Manrope',sans-serif;background:#fbf9f4;color:#31332e;-webkit-tap-highlight-color:transparent;min-height:100dvh;letter-spacing:-0.005em}
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    ::-webkit-scrollbar{display:none}

    .glass-header{background:rgba(251,249,244,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
    
    /* Header Dot */
    .header-dot{
      position:absolute;top:8px;right:8px;
      min-width:16px;height:16px;padding:0 4px;
      background:#ad332b;color:white;
      border-radius:99px;font-size:10px;font-weight:800;
      display:flex;align-items:center;justify-content:center;
      border:2px solid #fbf9f4;
    }

    /* Filter tabs */
    .filter-tab{
      padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;
      color:#5e6059;background:#f5f4ed;transition:all 0.15s ease;
      white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
    }
    .filter-tab.active{background:#3d6285;color:#f7f9ff}
    .tab-count{background:rgba(0,0,0,0.08);padding:1px 6px;border-radius:99px;font-size:10px;font-weight:800;}
    .filter-tab.active .tab-count{background:rgba(255,255,255,0.25)}

    /* Notification card */
    .notif-card{
      border-radius:16px;background:#ffffff;border-left:3px solid transparent;
      box-shadow:0 2px 8px rgba(49,51,46,0.03);
    }
    .notif-card.read{background:#f5f4ed;opacity:0.85;box-shadow:none}
    
    /* Types */
    .type-info{border-left-color:#3b82f6}
    .type-success{border-left-color:#10b981}
    .type-warning{border-left-color:#f59e0b}
    .type-alert{border-left-color:#ef4444}
    
    .unread-dot{width:8px;height:8px;border-radius:50%;background:#3d6285;flex-shrink:0}
  </style>
</head>

<body>

<header class="fixed top-0 w-full z-50 glass-header border-b border-surface-c/50">
  <div class="max-w-[430px] mx-auto px-5 pt-10 pb-3 flex items-center justify-between">
    <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-clow active:scale-90 transition-all rounded-full">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </button>
    <h1 id="headerTitle" class="font-headline font-semibold text-on-surface relative" style="font-size:18px;line-height:28px;">Notifications</h1>
    <button id="markAllBtn" onclick="markAllRead()" class="w-10 h-10 flex items-center justify-center text-primary hover:bg-surface-clow active:scale-90 transition-all rounded-full" title="Mark all read">
      <span class="material-symbols-outlined text-[20px]">done_all</span>
    </button>
  </div>
</header>

<!-- BIG BOTTOM PADDING to fix cutoff -->
<main class="pt-28 pb-48 px-5 max-w-[430px] mx-auto min-h-screen">

  <section class="mb-5">
    <div class="flex gap-2 overflow-x-auto pb-1" style="-ms-overflow-style:none;scrollbar-width:none">
      <button onclick="setFilter('unread',this)" class="filter-tab active">Unread <span id="count-unread" class="tab-count hidden">0</span></button>
      <button onclick="setFilter('all',this)" class="filter-tab">All <span id="count-all" class="tab-count hidden">0</span></button>
      <button onclick="setFilter('info',this)" class="filter-tab">Info</button>
      <button onclick="setFilter('success',this)" class="filter-tab">Success</button>
      <button onclick="setFilter('warning',this)" class="filter-tab">Warning</button>
      <button onclick="setFilter('alert',this)" class="filter-tab">Alerts</button>
      <button onclick="setFilter('archived',this)" class="filter-tab">Archived <span id="count-archived" class="tab-count hidden">0</span></button>
    </div>
  </section>

  <div id="notifContainer" class="space-y-3"></div>

  <div id="emptyState" class="hidden text-center py-16">
    <div class="w-16 h-16 rounded-2xl bg-surface-clow flex items-center justify-center mx-auto mb-4">
      <span id="emptyIcon" class="material-symbols-outlined text-outline text-[32px]">done_all</span>
    </div>
    <h3 id="emptyTitle" class="font-headline font-bold text-on-surface mb-1" style="font-size:18px;">You're all caught up</h3>
    <p id="emptyMsg" class="font-body text-on-surface-variant" style="font-size:14px;">No unread notifications</p>
  </div>
</main>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var currentUser = null, userTier = 'free'
var allNotifications = [], archivedNotifications = [], readMap = {}
var currentFilter = 'unread' // DEFAULT TO UNREAD

// Match Admin Types Exactly
var catConfig = {
  info:      { icon:'info',         bg:'bg-blue-50',    color:'text-blue-600',  label:'INFO',    typeClass:'type-info' },
  success:   { icon:'check_circle', bg:'bg-green-50',   color:'text-green-600', label:'SUCCESS', typeClass:'type-success' },
  warning:   { icon:'warning',      bg:'bg-amber-50',   color:'text-amber-600', label:'WARNING', typeClass:'type-warning' },
  alert:     { icon:'campaign',     bg:'bg-red-50',     color:'text-red-600',   label:'ALERT',   typeClass:'type-alert' }
}

async function init() {
  var s = await supabaseClient.auth.getSession()
  if (!s.data.session) return window.location.href = 'login.html'
  currentUser = s.data.session.user

  var p = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle()
  userTier = p.data?.subscription_tier || p.data?.tier || 'free'

  var r = await supabaseClient.from('notification_reads').select('*').eq('user_id', currentUser.id)
  ;(r.data || []).forEach(x => readMap[x.notification_id] = x)

  var n = await supabaseClient.from('app_notifications').select('*').order('created_at', { ascending: false })
  
  var valid = (n.data || []).filter(b => {
    var aud = typeof b.target_audience === 'string' ? JSON.parse(b.target_audience) : b.target_audience
    if (aud && aud.type === 'tier' && aud.value !== userTier) return false
    if (b.expires_at && new Date(b.expires_at) < new Date()) return false
    if (readMap[b.id] && readMap[b.id].dismissed_at) return false
    return true
  })

  allNotifications = valid.filter(x => !(readMap[x.id] && readMap[x.id].archived_at))
  archivedNotifications = valid.filter(x => readMap[x.id] && readMap[x.id].archived_at)

  renderList()
}

function renderList() {
  var box = document.getElementById('notifContainer')
  var empty = document.getElementById('emptyState')
  
  var source = currentFilter === 'archived' ? archivedNotifications : allNotifications
  var list = source

  if (currentFilter === 'unread') list = source.filter(x => !readMap[x.id] || !readMap[x.id].read_at)
  else if (currentFilter !== 'all' && currentFilter !== 'archived') list = source.filter(x => (x.type || 'info') === currentFilter)

  box.innerHTML = ''
  if (list.length === 0) {
    empty.classList.remove('hidden')
  } else {
    empty.classList.add('hidden')
    list.forEach(n => box.innerHTML += buildCard(n))
  }
  updateBadges()
}

function buildCard(n) {
  var c = catConfig[n.type] || catConfig['info']
  var isRead = readMap[n.id] && readMap[n.id].read_at
  var isArchived = readMap[n.id] && readMap[n.id].archived_at
  
  var btn = n.action_url ? `<a href="${n.action_url}" class="text-xs font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-lg">${n.action_label}</a>` : `<div></div>`

  return `
    <div id="card-${n.id}" class="notif-card ${c.typeClass} ${isRead?'read':'unread'} p-4 transition-all" onclick="markRead('${n.id}')">
      <div class="flex gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${c.bg}">
          <span class="material-symbols-outlined ${c.color} filled">${c.icon}</span>
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-headline font-bold text-[13px] leading-tight text-on-surface">${n.title}</h4>
            ${!isRead ? '<div class="unread-dot ml-2"></div>' : ''}
          </div>
          <p class="font-body text-xs text-on-surface-variant leading-relaxed">${n.message}</p>
          <span class="block mt-2 text-[10px] font-bold text-outline uppercase tracking-wider">${c.label}</span>
        </div>
      </div>
      
      <!-- Explicit Action Bar -->
      <div class="mt-4 pt-3 border-t border-surface-c flex justify-between items-center">
        ${btn}
        <div class="flex items-center gap-4">
          <button onclick="toggleArchive('${n.id}', event)" class="flex items-center gap-1 text-[11px] font-bold text-outline hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-[15px]">${isArchived?'unarchive':'archive'}</span> ${isArchived?'RESTORE':'ARCHIVE'}
          </button>
          <button onclick="delNotif('${n.id}', event)" class="flex items-center gap-1 text-[11px] font-bold text-outline hover:text-red-500 transition-colors">
            <span class="material-symbols-outlined text-[15px]">delete</span> DELETE
          </button>
        </div>
      </div>
    </div>`
}

function setFilter(f, btn) {
  currentFilter = f
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'))
  btn.classList.add('active')
  renderList()
}

async function markRead(id) {
  if (readMap[id] && readMap[id].read_at) return
  readMap[id] = readMap[id] || {}; readMap[id].read_at = new Date().toISOString()
  
  var el = document.getElementById('card-'+id)
  if(el){ el.classList.remove('unread'); el.classList.add('read'); el.querySelector('.unread-dot')?.remove() }
  
  updateBadges()
  await saveDb(id)
}

async function toggleArchive(id, e) {
  e.stopPropagation() // Prevent markRead
  readMap[id] = readMap[id] || {}
  
  if (readMap[id].archived_at) {
    readMap[id].archived_at = null
    var item = archivedNotifications.find(x => x.id === id)
    if(item){ archivedNotifications = archivedNotifications.filter(x => x.id !== id); allNotifications.unshift(item) }
  } else {
    readMap[id].archived_at = new Date().toISOString()
    if(!readMap[id].read_at) readMap[id].read_at = readMap[id].archived_at
    var item = allNotifications.find(x => x.id === id)
    if(item){ allNotifications = allNotifications.filter(x => x.id !== id); archivedNotifications.unshift(item) }
  }
  renderList()
  await saveDb(id)
}

async function delNotif(id, e) {
  e.stopPropagation()
  readMap[id] = readMap[id] || {}; readMap[id].dismissed_at = new Date().toISOString()
  allNotifications = allNotifications.filter(x => x.id !== id)
  archivedNotifications = archivedNotifications.filter(x => x.id !== id)
  renderList()
  await saveDb(id)
}

async function markAllRead() {
  var now = new Date().toISOString()
  allNotifications.forEach(n => {
    if(!readMap[n.id] || !readMap[n.id].read_at){
      readMap[n.id] = readMap[n.id] || {}; readMap[n.id].read_at = now
      saveDb(n.id)
    }
  })
  renderList()
}

async function saveDb(id) {
  var { error } = await supabaseClient.from('notification_reads').upsert({
    user_id: currentUser.id,
    notification_id: id,
    read_at: readMap[id].read_at || null,
    dismissed_at: readMap[id].dismissed_at || null,
    archived_at: readMap[id].archived_at || null
  }, { onConflict: 'user_id,notification_id' })
  if (error) console.error("Save Error:", error)
}

function updateBadges() {
  var unread = allNotifications.filter(x => !readMap[x.id] || !readMap[x.id].read_at).length
  document.getElementById('count-unread').textContent = unread
  document.getElementById('count-unread').classList.toggle('hidden', unread === 0)
  
  document.getElementById('count-all').textContent = allNotifications.length
  document.getElementById('count-all').classList.toggle('hidden', allNotifications.length === 0)
  
  document.getElementById('count-archived').textContent = archivedNotifications.length
  document.getElementById('count-archived').classList.toggle('hidden', archivedNotifications.length === 0)
  
  var headerTitle = document.getElementById('headerTitle')
  var oldBadge = document.getElementById('mainBadge')
  if (oldBadge) oldBadge.remove()
  if (unread > 0) {
    headerTitle.innerHTML += `<span id="mainBadge" class="header-dot">${unread>99?'99+':unread}</span>`
  }
}

function goBack(){ window.history.back() }

init()
</script>
</body>
</html>
