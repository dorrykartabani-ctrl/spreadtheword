  <style>
    html,body{background-color:#0e0e0c}
    body{
      font-family:'Manrope',sans-serif;
      -webkit-tap-highlight-color:transparent;
      -webkit-font-smoothing:antialiased;
      min-height:100dvh;
      color:#fff;
    }
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .font-quote{font-family:'Lora',serif}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    ::-webkit-scrollbar{display:none}
    body{-ms-overflow-style:none;scrollbar-width:none}

    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}

    /* Background image layer */
    .hero-bg{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;opacity:0;transition:opacity 0.8s ease}
    .hero-bg.loaded{opacity:1}

    /* Dark gradient overlay */
    .hero-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(14,14,12,0.50) 0%,rgba(14,14,12,0.30) 30%,rgba(14,14,12,0.70) 70%,rgba(14,14,12,0.95) 100%);z-index:1;pointer-events:none}

    .content-layer{position:relative;z-index:2}

    /* ── QUOTE ENTRANCE ── */
    @keyframes markDrop{
      0%{opacity:0;transform:translateY(-24px) scale(0.7)}
      60%{opacity:1;transform:translateY(6px) scale(1.05)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }
    .anim-mark{opacity:0}
    .anim-mark.go{animation:markDrop 0.9s cubic-bezier(0.34,1.56,0.64,1) forwards}

    @keyframes blurFloatUp{
      0%{opacity:0;filter:blur(12px);transform:translateY(24px)}
      100%{opacity:1;filter:blur(0);transform:translateY(0)}
    }
    .anim-quote{opacity:0}
    .anim-quote.go{animation:blurFloatUp 1.4s cubic-bezier(0.22,1,0.36,1) forwards}

    @keyframes sourceSlide{0%{opacity:0;transform:translateX(-16px)}100%{opacity:1;transform:translateX(0)}}
    @keyframes lineDraw{0%{width:0}100%{width:40px}}
    .anim-source{opacity:0}
    .anim-source.go{animation:sourceSlide 0.8s cubic-bezier(0.22,1,0.36,1) forwards}
    .anim-line{width:0}
    .anim-line.go{animation:lineDraw 0.7s cubic-bezier(0.22,1,0.36,1) forwards}

    /* Breathing idle */
    @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .breathing{animation:breathe 6s ease-in-out infinite}

    /* CTA + secondary fade in */
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .anim-cta{opacity:0}
    .anim-cta.go{animation:fadeUp 0.8s ease-out forwards}
    .anim-actions{opacity:0}
    .anim-actions.go{animation:fadeUp 0.8s ease-out forwards}

    /* CTA ambient glow */
    @keyframes ctaGlow{
      0%,100%{box-shadow:0 4px 20px rgba(61,98,133,0.25)}
      50%{box-shadow:0 8px 32px rgba(61,98,133,0.45)}
    }
    .cta-pulse{animation:ctaGlow 3.5s ease-in-out infinite}

    /* Arrow slide */
    @keyframes arrowSlide{
      0%,88%,100%{transform:translateX(0)}
      92%{transform:translateX(3px)}
      96%{transform:translateX(0)}
    }
    .cta-arrow{
      display:inline-block;
      animation:arrowSlide 5s ease-in-out infinite;
      animation-delay:3s;
    }

    /* Text shadows */
    .text-shadow-soft{text-shadow:0 2px 12px rgba(0,0,0,0.6)}
    .text-shadow-strong{text-shadow:0 4px 20px rgba(0,0,0,0.8),0 2px 6px rgba(0,0,0,0.5)}

    /* Action buttons — secondary row */
    .action-icon-btn{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding:8px 14px;
      transition:transform 0.15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .action-icon-btn:active{transform:scale(0.92)}
    .action-icon-circle{
      width:44px;height:44px;
      border-radius:50%;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.15);
      display:flex;align-items:center;justify-content:center;
      color:#ffffff;
      transition:all 0.2s ease;
    }
    .action-icon-btn:hover .action-icon-circle{
      background:rgba(255,255,255,0.18);
    }
    .action-icon-label{
      font-family:'Manrope',sans-serif;
      font-size:11px;
      font-weight:600;
      color:rgba(255,255,255,0.75);
      text-shadow:0 2px 8px rgba(0,0,0,0.6);
    }

    /* Like button — filled state */
    .action-icon-circle.liked{
      background:rgba(173,51,43,0.85);
      border-color:rgba(255,255,255,0.3);
    }
    @keyframes heartPop{
      0%{transform:scale(1)}
      30%{transform:scale(1.3)}
      60%{transform:scale(0.95)}
      100%{transform:scale(1)}
    }
    .heart-pop{animation:heartPop 0.5s cubic-bezier(0.34,1.56,0.64,1)}

    /* Context modal */
    .modal-inner{max-height:85dvh;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none}
    .modal-inner::-webkit-scrollbar{display:none}

    @keyframes modalSlideUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
    @keyframes modalSlideDown {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }
    @keyframes modalOverlayIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes modalOverlayOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #contextModal {opacity: 0;pointer-events: none;}
    #contextModal.modal-open {opacity: 1;pointer-events: auto;animation: modalOverlayIn 0.3s ease-out forwards;}
    #contextModal.modal-closing {animation: modalOverlayOut 0.25s ease-in forwards;pointer-events: none;}
    #contextModal .modal-panel {transform: translateY(100%);}
    #contextModal.modal-open .modal-panel {animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;}
    #contextModal.modal-closing .modal-panel {animation: modalSlideDown 0.3s ease-in forwards;}

    /* Success modal — matches editor */
    @keyframes confettiBurst{0%{transform:scale(0.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .success-logo-animate{animation:confettiBurst 0.5s cubic-bezier(0.34,1.56,0.64,1) both}
    .quick-action{
      display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;
      border-radius:14px;transition:all 0.18s ease;font-weight:700;font-size:14px;
    }
    .quick-action:active{transform:scale(0.97)}
    .quick-action-share{background:#3d6285;color:#f7f9ff}
    .quick-action-impact{background:#efeee7;color:#31332e}

    .glass-nav-dark{background:rgba(14,14,12,0.90);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .app-container{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  </style>
</head>

// AUTH

async function checkAuth() {
  var result = await supabaseClient.auth.getSession()
  if (!result.data || !result.data.session) { window.location.href = 'login.html'; return null }
  return result.data.session.user
}

// BACKGROUND LOADER
// ════════════════════════════════════════════
function setHeroBackground(url) {
  var bg = document.getElementById('heroBg')
  if (!bg) return
  var img = new Image()
  img.onload = function() {
    bg.style.backgroundImage = 'url("' + url + '")'
    bg.classList.add('loaded')
  }
  img.onerror = function() {
    bg.style.backgroundImage = 'url("' + DEFAULT_HERO + '")'
    bg.classList.add('loaded')
  }
  img.src = url
}

// ════════════════════════════════════════════
// LOAD TODAY'S QUOTE
// ════════════════════════════════════════════
async function loadTodaysQuote() {
  try {
    var today = new Date()
    var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0')

    var result = await supabaseClient
      .from('quotes')
      .select('*')
      .eq('status', 'live')
      .lte('published_at', todayStr + 'T23:59:59')
      .gte('published_at', todayStr + 'T00:00:00')
      .limit(1)

    if (!result.data || result.data.length === 0) {
      result = await supabaseClient
        .from('quotes')
        .select('*')
        .eq('status', 'live')
        .lte('published_at', new Date().toISOString())
        .order('published_at', { ascending: false })
        .limit(1)
    }

    if (result.error || !result.data || result.data.length === 0) {
      setFallbackQuote()
      return
    }

    var quote = result.data[0]
    currentQuote = quote

    sessionStorage.setItem('gstw_quote_id', quote.id)
    sessionStorage.setItem('gstw_today_quote_text', quote.text)
    sessionStorage.setItem('gstw_today_quote_source', quote.source || '')
    sessionStorage.setItem('gstw_today_quote_category', (quote.category || '').toLowerCase())

    var bgUrl = (quote.background_url && quote.background_url.trim()) ? quote.background_url : DEFAULT_HERO
    setHeroBackground(bgUrl)

    var quoteEl = document.getElementById('quoteText')
    if (quoteEl) {
      quoteEl.textContent = quote.text
      if (quote.home_font_size) quoteEl.style.fontSize = quote.home_font_size
      if (quote.home_font_weight) quoteEl.style.fontWeight = quote.home_font_weight
      if (quote.home_text_align) quoteEl.style.textAlign = quote.home_text_align
      if (quote.home_text_color) quoteEl.style.color = quote.home_text_color
    }

    var refEl = document.getElementById('quoteRef')
    if (refEl) refEl.textContent = (quote.source || 'GSTW').toUpperCase()

    if (quote.context && quote.context.trim()) {
      currentQuoteContext = { text: quote.text, source: quote.source, context: quote.context }
    }

    startEntranceAnimation()

  } catch(e) {
    console.error('loadTodaysQuote failed:', e)
    setFallbackQuote()
  }
}

function setFallbackQuote() {
  var quoteEl = document.getElementById('quoteText')
  var refEl = document.getElementById('quoteRef')
  if (quoteEl) quoteEl.textContent = 'The Word is with you today.'
  if (refEl) refEl.textContent = 'GSTW'
  setHeroBackground(DEFAULT_HERO)
  startEntranceAnimation()
}

// LIKE
// ════════════════════════════════════════════
async function checkIfLiked() {
  if (!currentQuote || !userProfile) return
  try {
    var res = await supabaseClient
      .from('quote_likes')
      .select('id')
      .eq('user_id', userProfile.id)
      .eq('quote_id', currentQuote.id)
      .maybeSingle()
    if (res.data) {
      isLiked = true
      updateLikeUI(true)
    }
  } catch(e) { console.error('checkIfLiked:', e) }
}

async function handleLike() {
  if (!currentQuote || !userProfile) return
  haptic('light')

  if (isLiked) {
    // Unlike
    try {
      await supabaseClient
        .from('quote_likes')
        .delete()
        .eq('user_id', userProfile.id)
        .eq('quote_id', currentQuote.id)
      isLiked = false
      updateLikeUI(false)
    } catch(e) { console.error('unlike:', e) }
  } else {
    // Like
    try {
      var res = await supabaseClient
        .from('quote_likes')
        .insert({ user_id: userProfile.id, quote_id: currentQuote.id })
      if (!res.error) {
        isLiked = true
        updateLikeUI(true)
      }
    } catch(e) { console.error('like:', e) }
  }
}

function updateLikeUI(liked) {
  var circle = document.getElementById('likeCircle')
  var icon = document.getElementById('likeIcon')
  if (!circle || !icon) return
  if (liked) {
    circle.classList.add('liked')
    icon.classList.add('filled')
    circle.classList.remove('heart-pop')
    void circle.offsetWidth
    circle.classList.add('heart-pop')
  } else {
    circle.classList.remove('liked')
    icon.classList.remove('filled')
  }
}

async function loadUserProfile(userId) {

// ════════════════════════════════════════════
// QUICK SHARE — Instant share from home
// Uses quote's own background + text, no editor
// ════════════════════════════════════════════
async function handleQuickShare() {
  if (isFreeUser) { window.location.href = 'subscription.html'; return }
  if (!currentQuote) { showToast('No quote loaded'); return }

  haptic('medium')

  var btn = document.getElementById('quickShareBtn')
  var icon = document.getElementById('quickShareIcon')
  var origIcon = icon.textContent
  icon.textContent = 'progress_activity'
  icon.style.animation = 'spin 1s linear infinite'
  btn.style.pointerEvents = 'none'

  // Build hashtags: standard + admin extras
  var hashtags = ['#SpreadTheWord', '#GreatCommission']
  if (currentQuote.hashtags && Array.isArray(currentQuote.hashtags)) {
    currentQuote.hashtags.forEach(function(t) {
      var tag = t.trim()
      if (tag && tag.charAt(0) !== '#') tag = '#' + tag
      if (tag && hashtags.indexOf(tag) === -1) hashtags.push(tag)
    })
  } else if (currentQuote.hashtags && typeof currentQuote.hashtags === 'string') {
    // Handle string case (comma or space separated)
    currentQuote.hashtags.split(/[,\s]+/).forEach(function(t) {
      var tag = t.trim()
      if (tag && tag.charAt(0) !== '#') tag = '#' + tag
      if (tag && hashtags.indexOf(tag) === -1) hashtags.push(tag)
    })
  }

  var caption = hashtags.join(' ')

  // Generate the image (quote's background + centered text + watermark)
  var result = await generateQuickShareImage()

  icon.style.animation = ''
  icon.textContent = origIcon
  btn.style.pointerEvents = ''

  if (!result.success) {
    showToast(result.error || 'Could not create image')
    return
  }

  // Copy caption
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(caption) } catch(e) {}
  }

  // Share
  if (isMobileDevice()) {
    if (quickShareImageFile && navigator.canShare && navigator.canShare({ files: [quickShareImageFile] })) {
      try {
        await navigator.share({ files: [quickShareImageFile], title: 'Go Spread The Word', text: caption })
        await logShare('quick-share')
        showSuccess()
        return
      } catch(e) {
        if (e.name === 'AbortError') { showToast('Share cancelled'); return }
      }
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Go Spread The Word', text: caption })
        await logShare('quick-share')
        showSuccess()
        return
      } catch(e) { if (e.name === 'AbortError') { showToast('Share cancelled'); return } }
    }
  }

  // Desktop fallback
  downloadQuickShareImage()
  await logShare('quick-desktop-download')
  showSuccess()
}

// ════════════════════════════════════════════
// GENERATE QUICK SHARE IMAGE (1080x1080)
// ════════════════════════════════════════════
function generateQuickShareImage() {
  return new Promise(function(resolve) {
    try {
      var canvas = document.createElement('canvas')
      canvas.width = 1080; canvas.height = 1080
      var ctx = canvas.getContext('2d')
      if (!ctx) { resolve({ success: false, error: 'Canvas not supported' }); return }

      ctx.fillStyle = '#0e0e0c'
      ctx.fillRect(0, 0, 1080, 1080)

      var quoteText = currentQuote.text || ''
      var quoteSource = currentQuote.source || 'GSTW'
      var bgUrl = (currentQuote.background_url && currentQuote.background_url.trim()) ? currentQuote.background_url : DEFAULT_HERO

      function drawContent() {
        // Dark overlay (30%)
        ctx.fillStyle = 'rgba(0,0,0,0.35)'
        ctx.fillRect(0, 0, 1080, 1080)

        // Quote text — Lora, white, shadow, centered
        var pad = 100
        var maxWidth = 1080 - (pad * 2)
        var fontSize = 60
        // Auto-fit
        var textLen = quoteText.length
        if (textLen > 200) fontSize = 40
        else if (textLen > 150) fontSize = 48
        else if (textLen > 100) fontSize = 54
        ctx.font = '500 ' + fontSize + 'px "Lora", serif'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'

        // Wrap text
        function wrapText(text, maxW) {
          var words = text.split(' '), line = '', lines = []
          for (var i = 0; i < words.length; i++) {
            var testLine = line + words[i] + ' '
            if (ctx.measureText(testLine).width > maxW && i > 0) {
              lines.push(line.trim())
              line = words[i] + ' '
            } else { line = testLine }
          }
          lines.push(line.trim())
          return lines
        }

        var lines = wrapText(quoteText, maxWidth)
        var lineHeight = fontSize * 1.4
        var totalHeight = lines.length * lineHeight
        var startY = (1080 / 2) - (totalHeight / 2) + (lineHeight / 2)

        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.85)'
        ctx.shadowBlur = 14
        ctx.shadowOffsetY = 3

        ctx.fillStyle = '#ffffff'
        for (var j = 0; j < lines.length; j++) {
          ctx.fillText(lines[j], 540, startY + (j * lineHeight))
        }

        // Source ref
        ctx.shadowBlur = 8
        ctx.font = 'bold 28px "Plus Jakarta Sans", sans-serif'
        ctx.fillStyle = '#b0d5fe'
        var refY = startY + (lines.length * lineHeight) + 40
        ctx.fillText('— ' + quoteSource.toUpperCase(), 540, refY)

        // Watermark bottom right
        ctx.shadowBlur = 8
        ctx.font = '600 26px "Plus Jakarta Sans", sans-serif'
        ctx.textAlign = 'right'
        ctx.textBaseline = 'bottom'
        ctx.fillStyle = 'rgba(255,255,255,0.8)'
        ctx.fillText('gospreadtheword.app', 1080 - 48, 1080 - 48)

        // Reset shadow
        ctx.shadowColor = 'transparent'
        ctx.shadowBlur = 0
        ctx.shadowOffsetY = 0

        try {
          quickShareImageDataUrl = canvas.toDataURL('image/png')
        } catch(taintErr) {
          resolve({ success: false, error: 'Background image blocked by browser CORS. Contact support.' })
          return
        }

        try {
          var bs = atob(quickShareImageDataUrl.split(',')[1])
          var ab = new ArrayBuffer(bs.length)
          var ia = new Uint8Array(ab)
          for (var k = 0; k < bs.length; k++) ia[k] = bs.charCodeAt(k)
          var blob = new Blob([ab], { type: 'image/png' })
          quickShareImageFile = new File([blob], 'GSTW-' + Date.now() + '.png', { type: 'image/png' })
          resolve({ success: true })
        } catch(err) { resolve({ success: false, error: 'Could not prepare image' }) }
      }

      var img = new Image()
      img.crossOrigin = 'anonymous'
      img.onload = function() {
        var scale = Math.max(1080 / img.width, 1080 / img.height)
        var sw = img.width * scale, sh = img.height * scale
        ctx.drawImage(img, (1080 - sw) / 2, (1080 - sh) / 2, sw, sh)
        drawContent()
      }
      img.onerror = function() {
        ctx.fillStyle = '#305678'
        ctx.fillRect(0, 0, 1080, 1080)
        drawContent()
      }
      img.src = bgUrl

    } catch(e) {
      console.error('generateQuickShareImage:', e)
      resolve({ success: false, error: 'Unexpected error' })
    }
  })
}

function downloadQuickShareImage() {
  if (!quickShareImageDataUrl) return
  var a = document.createElement('a')
  a.download = 'GSTW-' + Date.now() + '.png'
  a.href = quickShareImageDataUrl
  a.click()
}

// ════════════════════════════════════════════
// NOTIFICATION DOT
// ════════════════════════════════════════════
async function updateNotificationDot(userId) {
  try {
    var result = await supabaseClient.from('notifications').select('id,type,target_user_id').order('created_at', { ascending: false }).limit(50)
    var dot = document.getElementById('homeNotifDot')
    if (!dot) return
    if (result.error || !result.data) { dot.classList.add('hidden'); return }
    var visible = result.data.filter(function(n) { return n.type === 'broadcast' || n.target_user_id === userId })
    var readIds = []
    try { readIds = JSON.parse(localStorage.getItem('gstw_read_notifs') || '[]') } catch(e) {}
    var unread = visible.some(function(n) { return readIds.indexOf(n.id) === -1 })
    dot.classList.toggle('hidden', !unread)
  } catch(e) { console.error('updateNotificationDot:', e) }
}

// CONTEXT MODAL
// ════════════════════════════════════════════
function openContext() {
  if (!currentQuoteContext) {
    showToast('No context available for this quote')
    return
  }
  haptic('light')
  var refEl = document.getElementById('contextRef')
  var textEl = document.getElementById('contextText')
  if (refEl) refEl.textContent = (currentQuoteContext.source || '').toUpperCase()
  if (textEl) textEl.textContent = currentQuoteContext.context
  var modal = document.getElementById('contextModal')
  if (modal) { modal.classList.remove('hidden', 'modal-closing'); modal.classList.add('modal-open') }
  document.body.style.overflow = 'hidden'
}
function closeContext() {
  var modal = document.getElementById('contextModal')
  if (!modal) return
  modal.classList.remove('modal-open')
  modal.classList.add('modal-closing')
  setTimeout(function() {
    modal.classList.remove('modal-closing')
    modal.classList.add('hidden')
    document.body.style.overflow = ''
  }, 300)
}

function showToast(msg) {
  var existing = document.getElementById('homeToast'); if (existing) existing.remove()
  var t = document.createElement('div'); t.id = 'homeToast'
  t.className = 'fixed top-20 left-1/2 z-[200] bg-inverse-surface/90 backdrop-blur-md text-inverse-on-surface font-body font-semibold px-5 py-2.5 rounded-full whitespace-nowrap flex items-center gap-2 shadow-lg'
  t.style.transform = 'translateX(-50%)'; t.style.fontSize = '13px'
  t.innerHTML = '<span class="material-symbols-outlined text-primary-container text-[14px] filled">check_circle</span> ' + msg
  document.body.appendChild(t)
  setTimeout(function() { if (t.parentNode) t.remove() }, 2200)
}
