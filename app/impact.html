<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Impact — Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js for the "Wow" -->
  <script src="badges-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': '#f8fafc', 'card': '#ffffff', 'text-main': '#0f172a', 'text-muted': '#64748b',
            'primary': '#3d6285', 'gold': '#D4A24C', 'success': '#16a34a'
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background: #f8fafc; color: #0f172a; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Dashboard Cards */
    .dash-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
    }

    /* Toggle Switch */
    .time-toggle {
      display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px;
    }
    .time-btn {
      flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #64748b; text-align: center; transition: all 0.2s;
    }
    .time-btn.active { background: white; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    /* Leaderboard Row */
    .leader-row {
      display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9;
    }
    .leader-row:last-child { border-bottom: none; }
    .leader-row.me { background: #eff6ff; margin: 0 -20px; padding: 12px 20px; border-radius: 12px; border: 1px solid #bfdbfe; }

    .fade-up { opacity: 0; transform: translateY(10px); transition: 0.5s ease-out; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="pb-32">

<!-- HEADER / STATUS BAR -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
  <div class="max-w-[430px] mx-auto px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="font-headline font-extrabold text-xl text-slate-900">Impact</h1>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Command Center</p>
    </div>
    <div id="headerAvatar" class="flex items-center gap-3 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
      <img id="miniAvatarImg" src="/images/avatars/silhouette.png" class="w-6 h-6 rounded-full object-cover grayscale">
      <span id="miniRankName" class="text-[10px] font-black text-slate-600 uppercase">Seeker</span>
    </div>
  </div>
</header>

<main class="pt-24 px-5 max-w-[430px] mx-auto space-y-6">

  <!-- 1. TIME TOGGLE & CHART -->
  <section class="fade-up">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-headline font-bold text-lg">Activity</h3>
      <div class="time-toggle">
        <button id="btnWeek" onclick="setTimeframe('week')" class="time-btn active">Week</button>
        <button id="btnAll" onclick="setTimeframe('all')" class="time-btn">All Time</button>
      </div>
    </div>
    
    <div class="dash-card">
      <div class="h-48 relative">
        <canvas id="impactChart"></canvas>
      </div>
      <div class="flex justify-between mt-4 pt-4 border-t border-slate-50">
        <div>
          <p class="text-[10px] font-bold text-slate-400 uppercase">Total Shares</p>
          <p id="statShares" class="font-headline font-black text-2xl text-slate-900">0</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] font-bold text-slate-400 uppercase">Est. Reach</p>
          <p id="statReach" class="font-headline font-black text-2xl text-primary">0</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. PERSONAL STATS GRID -->
  <section class="fade-up grid grid-cols-2 gap-4">
    <div class="dash-card">
      <div class="flex items-center gap-2 mb-2">
        <span class="material-symbols-outlined text-primary text-lg filled">group</span>
        <span class="text-[10px] font-bold text-slate-400 uppercase">Warriors</span>
      </div>
      <p id="statRecruits" class="font-headline font-black text-2xl">0</p>
      <p class="text-[9px] text-slate-400 mt-1">Recruited by you</p>
    </div>
    <div class="dash-card">
      <div class="flex items-center gap-2 mb-2">
        <span class="material-symbols-outlined text-gold text-lg filled">public</span>
        <span class="text-[10px] font-bold text-slate-400 uppercase">Nations</span>
      </div>
      <p id="statCountries" class="font-headline font-black text-2xl">0</p>
      <p class="text-[9px] text-slate-400 mt-1">Countries reached</p>
    </div>
  </section>

  <!-- 3. GLOBAL STANDING (LEADERBOARD) -->
  <section class="fade-up">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-headline font-bold text-lg">Global Standing</h3>
      <span id="myGlobalRank" class="text-[10px] font-black bg-primary/10 text-primary px-2 py-1 rounded-md">Rank: #--</span>
    </div>
    <div class="dash-card p-5">
      <div id="leaderboardList">
        <!-- Injected via JS -->
      </div>
    </div>
  </section>

  <!-- 4. COLLECTIVE IMPACT -->
  <section class="fade-up">
    <h3 class="font-headline font-bold text-lg mb-3">The Collective</h3>
    <div class="bg-slate-900 text-white rounded-[24px] p-6 shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-primary/20 rounded-full blur-3xl"></div>
      <div class="relative z-10 grid grid-cols-3 gap-4 text-center">
        <div>
          <p id="globalWarriors" class="font-headline font-black text-xl text-gold">0</p>
          <p class="text-[9px] text-white/50 uppercase font-bold mt-1">Warriors</p>
        </div>
        <div>
          <p id="globalCountries" class="font-headline font-black text-xl text-gold">0</p>
          <p class="text-[9px] text-white/50 uppercase font-bold mt-1">Countries</p>
        </div>
        <div>
          <p id="globalRaised" class="font-headline font-black text-xl text-gold">$0</p>
          <p class="text-[9px] text-white/50 uppercase font-bold mt-1">Raised</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. ACTIVE MISSIONS -->
  <section class="fade-up">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-headline font-bold text-lg">Active Missions</h3>
      <a href="cause.html" class="text-xs font-bold text-primary">View All →</a>
    </div>
    <div id="missionsList" class="space-y-3">
      <!-- Injected JS -->
    </div>
  </section>

</main>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser, userProfile;
var allShares = [];
var chartInstance = null;
var currentTimeframe = 'week';

async function init() {
  const s = await supabaseClient.auth.getSession();
  if (!s.data.session) { window.location.href = 'login.html'; return; }
  currentUser = s.data.session.user;

  await loadData();
  document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
}

async function loadData() {
  // 1. Profile & Avatar
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
  userProfile = profile || {};
  
  // Update Header Avatar
  if(typeof calculateAvatarStage === 'function') {
    // Quick mock stats for avatar calc if full stats aren't ready yet
    const avatar = calculateAvatarStage([], {shares:0, recruits_paid:0, countries_paid:0}, []); 
    // Note: In a real app, pass real stats here. For now, just show silhouette or default.
  }

  // 2. Parallel Data Fetch
  const res = await Promise.allSettled([
    supabaseClient.from('shares').select('shared_at').eq('user_id', currentUser.id).order('shared_at', {ascending: true}),
    supabaseClient.from('profiles').select('country, subscription_tier').eq('referred_by', userProfile.invite_code),
    supabaseClient.from('profiles').select('id, full_name, nickname, total_shares').order('total_shares', {ascending: false}).limit(10),
    supabaseClient.from('profiles').select('*', {count: 'exact', head: true}),
    supabaseClient.from('projects').select('raised_amount', {count: 'exact', head: true}).eq('status', 'completed')
  ]);

  allShares = res[0].value?.data || [];
  const recruits = res[1].value?.data || [];
  const leaders = res[2].value?.data || [];
  const totalWarriors = res[3].value?.count || 0;
  
  // Process Personal Stats
  const paidRecruits = recruits.filter(r => r.subscription_tier !== 'free');
  const countries = new Set(paidRecruits.map(r => r.country).filter(c => c)).size;

  document.getElementById('statShares').textContent = allShares.length;
  document.getElementById('statReach').textContent = (allShares.length * 50).toLocaleString();
  document.getElementById('statRecruits').textContent = recruits.length;
  document.getElementById('statCountries').textContent = countries;

  // Process Leaderboard
  renderLeaderboard(leaders);

  // Process Global Stats (Mocked for MVP if RPC not set up)
  document.getElementById('globalWarriors').textContent = totalWarriors.toLocaleString();
  document.getElementById('globalCountries').textContent = "42"; // Placeholder until global country RPC is built
  document.getElementById('globalRaised').textContent = "$12,450"; // Placeholder

  // Render Chart
  renderChart();
}

function renderLeaderboard(leaders) {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '';
  
  let myRank = leaders.findIndex(l => l.id === currentUser.id) + 1;
  if(myRank === 0) myRank = leaders.length + 1; // If not in top 10
  document.getElementById('myGlobalRank').textContent = `Rank: #${myRank}`;

  leaders.slice(0, 5).forEach((user, index) => {
    const isMe = user.id === currentUser.id;
    const name = user.full_name || user.nickname || 'Warrior';
    const medals = ['🥇', '🥈', '🥉'];
    const rankDisplay = index < 3 ? medals[index] : `#${index + 1}`;

    const div = document.createElement('div');
    div.className = `leader-row ${isMe ? 'me' : ''}`;
    div.innerHTML = `
      <div class="w-8 font-headline font-black text-sm ${index < 3 ? 'text-lg' : 'text-slate-400'}">${rankDisplay}</div>
      <div class="flex-1 font-bold text-sm text-slate-800 truncate">${name} ${isMe ? '(You)' : ''}</div>
      <div class="font-headline font-black text-sm text-primary">${user.total_shares || 0}</div>
    `;
    list.appendChild(div);
  });
}

function renderChart() {
  const ctx = document.getElementById('impactChart').getContext('2d');
  
  // Process Data for Chart
  const labels = [];
  const data = [];
  
  if (currentTimeframe === 'week') {
    // Last 7 days
    for(let i=6; i>=0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      labels.push(d.toLocaleDateString('en', {weekday: 'short'}));
      data.push(allShares.filter(s => s.shared_at.startsWith(dateStr)).length);
    }
  } else {
    // All time (grouped by month for simplicity)
    const months = {};
    allShares.forEach(s => {
      const m = s.shared_at.substring(0, 7); // YYYY-MM
      months[m] = (months[m] || 0) + 1;
    });
    Object.keys(months).sort().forEach(m => {
      labels.push(m);
      data.push(months[m]);
    });
  }

  if (chartInstance) chartInstance.destroy();

  // Gradient Fill
  const gradient = ctx.createLinearGradient(0, 0, 0, 200);
  gradient.addColorStop(0, 'rgba(61, 98, 133, 0.2)');
  gradient.addColorStop(1, 'rgba(61, 98, 133, 0)');

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        borderColor: '#3d6285',
        backgroundColor: gradient,
        borderWidth: 3,
        tension: 0.4, // Smooth curves
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10, family: 'Manrope' } } },
        y: { display: false, beginAtZero: true }
      }
    }
  });
}

function setTimeframe(tf) {
  currentTimeframe = tf;
  document.getElementById('btnWeek').classList.toggle('active', tf === 'week');
  document.getElementById('btnAll').classList.toggle('active', tf === 'all');
  renderChart();
}

init();
</script>
</body>
</html>
