<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Create — Go Spread The Word</title>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@600&family=Bebas+Neue&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','surface-chigh':'#e9e8e1','surface-chighest':'#e3e3db',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'inverse-surface':'#0e0e0c','inverse-on-surface':'#9e9d99',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'secondary':'#41637c','secondary-container':'#cae6ff',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'background':'#fbf9f4',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
            'quote':['Lora','serif'],
          }
        },
      },
    }
  </script>

  <style>
    *{box-sizing:border-box}
    body{
      font-family:'Manrope',sans-serif;
      /* Radiant Quiet Gradient: Warm Cream to Air Blue */
      background: linear-gradient(180deg, #fbf9f4 0%, #eef5fb 100%);
      color:#31332e;
      -webkit-tap-highlight-color:transparent;
      min-height:100dvh;user-select:none;margin:0;letter-spacing:-0.005em;
    }
    
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}

    /* Ambient Blue-Tinted Shadows */
    .shadow-radiant{box-shadow: 0 12px 30px rgba(61, 98, 133, 0.08)}
    
    /* Separate Action Buttons */
    .action-card{
      flex:1;
      padding:20px 16px;
      background:#ffffff;
      border-radius:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:13px;
      font-weight:700;
      color:#5e6059;
      box-shadow: 0 4px 12px rgba(49, 51, 46, 0.03);
      border: 1px solid rgba(122, 123, 117, 0.08);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .action-card:active{transform:scale(0.96)}
    .action-card.active{
      background: linear-gradient(135deg, #3d6285, #5a8ab0);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(61, 98, 133, 0.25);
    }
    .action-card.active .material-symbols-outlined{color: #ffffff}
    .action-card .material-symbols-outlined{font-size: 24px; color: #3d6285}

    /* Canvas Frame */
    .canvas-frame{
      background:#ffffff;
      border-radius:28px;
      padding:8px;
      box-shadow: 0 20px 40px rgba(61, 98, 133, 0.1);
    }
    .preview-canvas{
      position:relative;width:100%;aspect-ratio:1;border-radius:22px;
      overflow:hidden;background:#0e0e0c;touch-action:none;
    }

    /* Tool Panel with Ghost Border */
    .tool-panel{
      background:#ffffff;border-radius:24px;padding:20px;margin-top:12px;
      max-height:0;opacity:0;overflow:hidden;
      transition:all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 10px 30px rgba(61, 98, 133, 0.05);
      border: 1px solid rgba(61, 98, 133, 0.05);
    }
    .tool-panel.open{max-height:500px;opacity:1}

    /* Floating Header & Footer */
    .glass-ui{background:rgba(251,249,244,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

    /* Hashtag Container Color Tone */
    .hashtag-zone{
      background: rgba(176, 213, 254, 0.15);
      border: 1px solid rgba(61, 98, 133, 0.1);
      border-radius: 24px;
      padding: 20px;
    }
    .hashtag-chip{
      background: #ffffff;
      color: #3d6285;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(61, 98, 133, 0.05);
    }

    /* Standard Utilities */
    .h-scroll{overflow-x:auto;display:flex;gap:10px;padding-bottom:4px;scrollbar-width:none}
    .h-scroll::-webkit-scrollbar{display:none}
    .bg-thumb{width:64px;height:64px;border-radius:16px;overflow:hidden;border:3px solid transparent;flex-shrink:0}
    .bg-thumb.selected{border-color:#3d6285;transform:scale(1.05)}
    .color-swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;flex-shrink:0}
    .color-swatch.selected{border-color:white;box-shadow:0 0 0 2px #3d6285;transform:scale(1.1)}
    
    input[type="range"]{-webkit-appearance:none;height:6px;border-radius:3px;background:#eef5fb}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#3d6285;box-shadow:0 2px 8px rgba(61,98,133,0.3)}
  </style>
</head>

<body>

<input type="file" id="selfieInput" accept="image/*" capture="user" class="hidden" onchange="handleImageSelect(this)">
<input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleImageSelect(this)">

<div class="max-w-[430px] mx-auto flex flex-col min-h-[100dvh]">

  <!-- HEADER -->
  <header class="glass-ui sticky top-0 z-40 flex items-center justify-between px-6 py-4">
    <button onclick="goHome()" class="w-10 h-10 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-c transition-colors">
      <span class="material-symbols-outlined text-[22px]">home</span>
    </button>
    <span class="font-headline font-extrabold text-[16px] tracking-tight">Create Post</span>
    <button onclick="confirmReset()" class="w-10 h-10 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-c transition-colors">
      <span class="material-symbols-outlined text-[20px]">refresh</span>
    </button>
  </header>

  <!-- CANVAS -->
  <section class="px-6 pt-2">
    <div class="canvas-frame shadow-radiant">
      <div class="preview-canvas" id="previewCanvas">
        <div id="bgLayer" class="absolute inset-0 bg-cover bg-center"></div>
        <div id="darkLayer" class="absolute inset-0" style="background:rgba(0,0,0,0.3)"></div>
        <div id="quoteOverlay" class="absolute z-10 w-4/5 left-[10%] top-[25%] cursor-grab active:cursor-grabbing">
          <div class="p-4 text-center">
            <p id="quoteText" class="font-quote font-semibold text-white leading-snug" style="font-size:18px;opacity:0;transition:opacity 0.3s"></p>
            <p id="quoteRef" class="mt-4 font-body font-bold text-white/90 tracking-widest uppercase" style="font-size:10px;opacity:0;transition:opacity 0.3s"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ROW 1: CONTENT SOURCE -->
  <section class="px-6 pt-6">
    <p class="font-body font-bold text-[11px] uppercase tracking-widest text-on-surface-variant mb-3 opacity-60">Source Image</p>
    <div class="flex gap-3">
      <button onclick="openCamera()" class="action-card">
        <span class="material-symbols-outlined">photo_camera</span>
        Camera
      </button>
      <button onclick="openGallery()" class="action-card">
        <span class="material-symbols-outlined">photo_library</span>
        Gallery
      </button>
    </div>
  </section>

  <!-- ROW 2: EDITING TOOLS (Separated) -->
  <section class="px-6 pt-6">
    <p class="font-body font-bold text-[11px] uppercase tracking-widest text-on-surface-variant mb-3 opacity-60">Customise Style</p>
    <div class="flex gap-3">
      <button id="dockBackground" onclick="openTool('background')" class="action-card">
        <span class="material-symbols-outlined">wallpaper</span>
        Background
      </button>
      <button id="dockText" onclick="openTool('text')" class="action-card">
        <span class="material-symbols-outlined">text_fields</span>
        Text
      </button>
    </div>

    <!-- Background Tool Panel -->
    <div id="panelBackground" class="tool-panel">
      <div id="bgThumbsContainer" class="h-scroll mb-6">
        <div class="bg-thumb bg-surface-clow flex items-center justify-center border-2 border-dashed border-outline-variant" onclick="openGallery()">
          <span class="material-symbols-outlined text-outline">add_photo_alternate</span>
        </div>
      </div>
      <div class="flex items-center justify-between mb-2">
        <span class="font-body font-bold text-[12px]">Dim Level</span>
        <span id="darkLabel" class="text-primary font-bold text-[12px]">30%</span>
      </div>
      <input type="range" min="0" max="85" value="30" class="w-full" oninput="setDarkness(this.value)">
    </div>

    <!-- Text Tool Panel -->
    <div id="panelText" class="tool-panel">
      <div class="flex gap-2 mb-6 overflow-x-auto pb-1 no-scrollbar">
        <button onclick="showTextTab('font',this)" class="px-4 py-2 rounded-full bg-surface-clow text-[11px] font-bold active">Font</button>
        <button onclick="showTextTab('size',this)" class="px-4 py-2 rounded-full bg-surface-clow text-[11px] font-bold">Size</button>
        <button onclick="showTextTab('color',this)" class="px-4 py-2 rounded-full bg-surface-clow text-[11px] font-bold">Color</button>
        <button onclick="showTextTab('align',this)" class="px-4 py-2 rounded-full bg-surface-clow text-[11px] font-bold">Align</button>
      </div>
      
      <div id="textFont" class="text-sub h-scroll">
        <button onclick="setFont('font-lora',this)" class="px-4 py-2 rounded-xl bg-surface-clow text-[13px] selected">Lora</button>
        <button onclick="setFont('font-jakarta',this)" class="px-4 py-2 rounded-xl bg-surface-clow text-[13px] font-bold">Jakarta</button>
        <button onclick="setFont('font-oswald',this)" class="px-4 py-2 rounded-xl bg-surface-clow text-[13px] uppercase">Oswald</button>
      </div>

      <div id="textSize" class="text-sub hidden">
        <input type="range" min="12" max="36" value="18" class="w-full" oninput="setSize(this.value)">
      </div>

      <div id="textColor" class="text-sub hidden h-scroll">
        <div class="color-swatch selected" style="background:#FFFFFF" onclick="setTextColor('#FFFFFF',this)"></div>
        <div class="color-swatch" style="background:#FDE047" onclick="setTextColor('#FDE047',this)"></div>
        <div class="color-swatch" style="background:#b0d5fe" onclick="setTextColor('#b0d5fe',this)"></div>
      </div>

      <div id="textAlign" class="text-sub hidden flex gap-2">
        <button onclick="setAlign('left',this)" class="flex-1 py-2 rounded-xl bg-surface-clow text-[11px] font-bold">Left</button>
        <button onclick="setAlign('center',this)" class="flex-1 py-2 rounded-xl bg-surface-clow text-[11px] font-bold bg-primary text-white">Center</button>
        <button onclick="setAlign('right',this)" class="flex-1 py-2 rounded-xl bg-surface-clow text-[11px] font-bold">Right</button>
      </div>
    </div>
  </section>

  <!-- HASHTAG ZONE -->
  <section class="px-6 pt-8">
    <div class="hashtag-zone">
      <div class="flex justify-between items-center mb-4">
        <div>
          <p class="font-headline font-bold text-[15px] text-primary">Hashtags</p>
          <p class="font-body text-[11px] text-on-surface-variant">Click tags to remove them</p>
        </div>
        <span id="hashtagCounter" class="text-[11px] font-bold text-primary bg-white px-2 py-1 rounded-lg">2 / 5</span>
      </div>
      <div id="hashtagsContainer" class="flex flex-wrap gap-2"></div>
      
      <button onclick="toggleHashtagInput()" class="mt-4 w-full py-3 rounded-xl border-2 border-dashed border-primary/20 text-primary font-bold text-[12px] hover:bg-white/50 transition-colors">
        + Add Custom Tag
      </button>

      <div id="hashtagInput" class="hidden mt-3">
        <div class="flex gap-2">
          <input id="hashtagField" type="text" placeholder="#Tag" class="flex-1 px-4 py-2 rounded-xl bg-white text-[13px] outline-none border border-primary/10">
          <button onclick="addHashtagFromInput()" class="signature-gradient px-4 rounded-xl text-white font-bold text-[13px]">Add</button>
        </div>
      </div>
    </div>
  </section>

  <div class="h-32"></div>

</div>

<!-- FOOTER -->
<footer class="glass-ui fixed bottom-0 left-0 right-0 z-40 border-t border-primary/5">
  <div class="max-w-[430px] mx-auto px-6 pt-4 pb-8">
    <button id="shareBtn" onclick="spreadTheWord()" class="w-full py-4 signature-gradient text-white font-headline font-bold rounded-2xl flex items-center justify-center gap-3 shadow-radiant active:scale-[0.98] transition-transform">
      <span>Spread The Word</span>
      <span class="cta-arrow text-lg">→</span>
    </button>
  </div>
</footer>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var selectedBgType = 'image', selectedBgValue = '', currentAlign = 'center', currentTextColor = '#FFFFFF', currentTool = null;
var hashtags = ['#SpreadTheWord', '#KingdomCulture'], MAX_TAGS = 5;
var imageDataUrl = null, imageFile = null, imageBlob = null;
var fontMap = {'font-lora':"'Lora',serif",'font-jakarta':"'Plus Jakarta Sans',sans-serif",'font-oswald':"'Oswald',sans-serif"};

document.addEventListener('DOMContentLoaded', initEditor);

async function initEditor(){
  var qt = document.getElementById('quoteText'), qr = document.getElementById('quoteRef');
  var sText = sessionStorage.getItem('gstw_selected_quote_text'), sSource = sessionStorage.getItem('gstw_selected_quote_source'), sId = sessionStorage.getItem('gstw_selected_quote_id');

  if(sText){
    qt.textContent = sText; qr.textContent = '— ' + (sSource || 'GSTW').toUpperCase();
  } else {
    var {data} = await supabaseClient.from('quotes').select('*').eq('status','live').limit(1).single();
    if(data){ qt.textContent = data.text; qr.textContent = '— ' + (data.source || 'GSTW').toUpperCase(); }
  }
  qt.style.opacity = '1'; qr.style.opacity = '1';
  loadBackgrounds(); renderHashtags(); setupDragging();
}

function openTool(name){
  if(currentTool === name) {
    currentTool = null;
    document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.action-card').forEach(b => b.classList.remove('active'));
    return;
  }
  currentTool = name;
  document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.action-card').forEach(b => b.classList.remove('active'));
  document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('open');
  document.getElementById('dock' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
}

function showTextTab(name, btn){
  document.querySelectorAll('.text-sub').forEach(s => s.classList.add('hidden'));
  document.getElementById('text' + name.charAt(0).toUpperCase() + name.slice(1)).classList.remove('hidden');
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('bg-primary','text-white'));
  btn.classList.add('bg-primary','text-white');
}

async function loadBackgrounds(){
  var container = document.getElementById('bgThumbsContainer');
  var {data} = await supabaseClient.from('media').select('*').eq('type','background').limit(10);
  data?.forEach(img => {
    var d = document.createElement('div');
    d.className = 'bg-thumb';
    d.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover">`;
    d.onclick = () => {
      document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('selected'));
      d.classList.add('selected');
      applyBackground(img.url);
    };
    container.appendChild(d);
  });
  if(data?.[0]) applyBackground(data[0].url);
}

function applyBackground(url){
  selectedBgValue = url;
  var bg = document.getElementById('bgLayer');
  bg.style.backgroundImage = `url('${url}')`;
}

function renderHashtags(){
  var c = document.getElementById('hashtagsContainer');
  c.innerHTML = hashtags.map(t => `<span class="hashtag-chip" onclick="removeHashtag('${t}')">${t}</span>`).join('');
  document.getElementById('hashtagCounter').textContent = `${hashtags.length} / ${MAX_TAGS}`;
}

function removeHashtag(t){ hashtags = hashtags.filter(h => h !== t); renderHashtags(); }
function toggleHashtagInput(){ document.getElementById('hashtagInput').classList.toggle('hidden'); }
function addHashtagFromInput(){
  var f = document.getElementById('hashtagField'), v = f.value.trim();
  if(v && hashtags.length < MAX_TAGS){
    if(v[0] !== '#') v = '#' + v;
    hashtags.push(v); f.value = ''; renderHashtags();
  }
}

function setDarkness(v){ 
  document.getElementById('darkLayer').style.background = `rgba(0,0,0,${v/100})`; 
  document.getElementById('darkLabel').textContent = v + '%';
}
function setSize(v){ document.getElementById('quoteText').style.fontSize = v + 'px'; }
function setTextColor(h, el){ 
  document.getElementById('quoteText').style.color = h; 
  document.getElementById('quoteRef').style.color = h;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}
function setAlign(a, btn){ 
  document.getElementById('quoteText').style.textAlign = a; 
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('bg-primary','text-white'));
  btn.classList.add('bg-primary','text-white');
}

function openCamera(){ document.getElementById('selfieInput').click(); }
function openGallery(){ document.getElementById('galleryInput').click(); }
function handleImageSelect(input){
  var reader = new FileReader();
  reader.onload = (e) => applyBackground(e.target.result);
  reader.readAsDataURL(input.files[0]);
}

function setupDragging(){
  var o = document.getElementById('quoteOverlay'), c = document.getElementById('previewCanvas'), active = false, startX, startY, ol, ot;
  var start = (e) => {
    active = true; var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; ol = o.offsetLeft; ot = o.offsetTop;
  };
  var move = (e) => {
    if(!active) return; var t = e.touches ? e.touches[0] : e;
    o.style.left = Math.max(0, Math.min(c.offsetWidth - o.offsetWidth, ol + (t.clientX - startX))) + 'px';
    o.style.top = Math.max(0, Math.min(c.offsetHeight - o.offsetHeight, ot + (t.clientY - startY))) + 'px';
  };
  o.addEventListener('mousedown', start); o.addEventListener('touchstart', start);
  window.addEventListener('mousemove', move); window.addEventListener('touchmove', move);
  window.addEventListener('mouseup', () => active = false); window.addEventListener('touchend', () => active = false);
}

async function spreadTheWord(){
  if(navigator.clipboard) await navigator.clipboard.writeText(hashtags.join(' '));
  location.href = 'index.html'; // Simplified for demo
}

function goHome(){ location.href = 'index.html'; }
function confirmReset(){ if(confirm("Reset design?")) location.reload(); }
</script>
</body>
</html>
