<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f2f6fa">
  <title>Create — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@600&family=Bebas+Neue&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed','surface-c':'#efeee7','surface-chigh':'#e9e8e1',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'primary':'#3d6285','on-primary':'#f7f9ff','primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'tertiary':'#ad332b'
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans','sans-serif'], 'body': ['Manrope','sans-serif'], 'quote': ['Lora','serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { font-family:'Manrope',sans-serif; background:#f2f6fa; color:#31332e; -webkit-tap-highlight-color:transparent; min-height:100dvh; user-select:none; margin:0; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
    .filled { font-variation-settings: 'FILL' 1; }
    .signature-gradient { background: linear-gradient(135deg, #3d6285, #6b9bc3); }
    ::-webkit-scrollbar { display: none; }
    
    /* Typography */
    .font-lora { font-family: 'Lora', serif !important; }
    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif !important; }
    .font-playfair { font-family: 'Playfair Display', serif !important; }
    .font-oswald { font-family: 'Oswald', sans-serif !important; text-transform: uppercase; }
    .font-bebas { font-family: 'Bebas Neue', sans-serif !important; letter-spacing: 0.08em; }
    .font-merri { font-family: 'Merriweather', serif !important; }
    .text-with-shadow { text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.5); }

    /* Layout & Canvas */
    .glass-header { background: rgba(242,246,250,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .post-pill { background: #ffffff; border-radius: 24px; box-shadow: 0 12px 32px rgba(49,51,46,0.08); overflow: hidden; }
    .preview-canvas { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; background: #0e0e0c; touch-action: none; transition: aspect-ratio 0.3s ease; }
    #bgLayer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: background-image 0.2s; }
    #darkLayer { position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
    
    /* Interactive Text Node */
    #quoteOverlay { position: absolute; z-index: 10; cursor: grab; width: 80%; left: 10%; top: 25%; }
    #quoteOverlay:active { cursor: grabbing; }

    /* Action Cards */
    .action-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #ffffff; box-shadow: 0 4px 12px rgba(49,51,46,0.03); transition: all 0.15s ease; }
    .action-card:active { transform: scale(0.97); }
    .customize-card { background: linear-gradient(135deg, #ffffff 0%, #f0f5fa 100%); border: 1px solid rgba(61,98,133,0.15); }

    /* Hashtags UI */
    .hashtag-pill-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; background: rgba(176,213,254,0.20); color: #234a6c; border-radius: 99px; font-size: 11px; font-weight: 700; transition: all 0.15s; }
    .hashtag-pill-btn.open { background: #3d6285; color: #f7f9ff; }
    .hashtag-panel { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease; }
    .hashtag-panel.open { max-height: 300px; opacity: 1; padding-top: 10px; margin-top: 4px; }
    .hashtag-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(176,213,254,0.25); color: #234a6c; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }

    /* Tabbed Bottom Sheet (Unobstructed View) */
    .overlay-bg { position: fixed; inset: 0; background: transparent; z-index: 100; opacity: 0; pointer-events: none; }
    .overlay-bg.open { opacity: 1; pointer-events: auto; }
    .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 101; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); height: 45vh; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 16px 20px 0; border-bottom: 1px solid #e9e8e1; }
    .sheet-tab { padding: 8px 12px; font-size: 12px; font-weight: 700; color: #5e6059; border-bottom: 2px solid transparent; white-space: nowrap; }
    .sheet-tab.active { color: #3d6285; border-bottom-color: #3d6285; }
    .sheet-content { flex: 1; overflow-y: auto; padding: 20px; }
    
    .tool-section { display: none; }
    .tool-section.active { display: block; }

    /* Customization Buttons */
    .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; transition: transform 0.1s; }
    .color-btn.active { border-color: #3d6285; transform: scale(1.1); }
    .align-btn { flex: 1; padding: 8px; border-radius: 8px; background: #f5f4ed; color: #5e6059; display: flex; justify-content: center; }
    .align-btn.active { background: #3d6285; color: #fff; }
    .ratio-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 12px; background: #f5f4ed; color: #5e6059; }
    .ratio-btn.active { background: #3d6285; color: #ffffff; }
    .bg-thumb { width: 80px; height: 120px; border-radius: 8px; object-fit: cover; flex-shrink: 0; cursor: pointer; border: 2px solid transparent; }
    .bg-thumb.active { border-color: #3d6285; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
  </style>
</head>
<body>

<input type="file" id="selfieInput" accept="image/*" capture="user" class="hidden" onchange="handleImageSelect(this)">
<input type="file" id="galleryInput" accept="image/png,image/jpeg,image/jpg,image/webp" class="hidden" onchange="handleImageSelect(this)">

<!-- HEADER -->
<header class="fixed top-0 w-full z-50 glass-header">
  <div class="max-w-[430px] mx-auto px-4 pt-10 pb-3 flex items-center justify-between">
    <button onclick="window.location.href='index.html'" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-c rounded-xl"><span class="material-symbols-outlined">home</span></button>
    <div class="flex items-center gap-4">
      <button id="btnUndo" onclick="editorStore.undo()" class="p-2 text-on-surface-variant opacity-30"><span class="material-symbols-outlined text-[20px]">undo</span></button>
      <span class="font-headline font-bold text-on-surface text-[15px]">Create</span>
      <button id="btnRedo" onclick="editorStore.redo()" class="p-2 text-on-surface-variant opacity-30"><span class="material-symbols-outlined text-[20px]">redo</span></button>
    </div>
    <div class="w-10"></div>
  </div>
</header>

<!-- MAIN EDITOR -->
<div class="max-w-[430px] mx-auto flex flex-col pt-24 pb-32 transition-all duration-300" id="mainContainer">
  
  <section class="px-4 pt-4">
    <div class="post-pill">
      
      <!-- DYNAMIC CANVAS -->
      <div class="p-1.5 bg-white">
        <div class="preview-canvas" id="previewCanvas">
          <div id="bgLayer"></div>
          <div id="darkLayer"></div>
          <div id="quoteOverlay">
            <div class="p-4" id="textWrap">
              <p id="quoteText" class="font-quote font-semibold text-white leading-snug text-with-shadow text-[18px]"></p>
              <p id="quoteRef" class="mt-3 font-body font-bold text-white/90 tracking-wider text-with-shadow text-[11px]"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- CAPTION & HASHTAGS (RESTORED) -->
      <div class="p-4 bg-white rounded-b-3xl">
        <div class="bg-[#f7f9fb] rounded-xl p-3 mb-3">
          <textarea id="postCaption" oninput="editorStore.updateCaption()" maxlength="2200" placeholder="Add your caption..." class="w-full bg-transparent border-none resize-none font-body text-[13px] text-on-surface min-h-[52px] focus:outline-none"></textarea>
        </div>
        
        <!-- Hashtag Pill -->
        <button id="hashtagToggle" onclick="toggleHashtagPanel()" class="hashtag-pill-btn">
          <span class="material-symbols-outlined text-[14px]">tag</span>
          <span id="hashtagPillLabel">0 hashtags</span>
          <span id="hashtagChevron" class="material-symbols-outlined text-[16px] transition-transform">expand_more</span>
        </button>
        
        <!-- Hashtag Panel -->
        <div id="hashtagPanel" class="hashtag-panel">
          <div id="hashtagsContainer" class="flex flex-wrap gap-1.5 mb-2"></div>
          <div class="flex gap-2">
            <input id="hashtagField" type="text" placeholder="#YourTag" class="flex-1 bg-white border border-primary/30 rounded-lg px-3 py-2 font-body text-[12px] focus:outline-none" onkeydown="if(event.key==='Enter')addHashtagFromInput()">
            <button onclick="addHashtagFromInput()" class="signature-gradient text-white font-headline font-semibold px-3 py-2 rounded-lg text-[12px]">Add</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CAMERA / GALLERY -->
  <section class="px-4 pt-3">
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="openCamera()" class="action-card border border-primary/20">
        <div class="w-9 h-9 rounded-xl bg-primary text-white flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-[19px] filled">photo_camera</span></div>
        <div class="text-left"><p class="font-headline font-bold text-[13px]">Camera</p><p class="font-body text-on-surface-variant text-[10px]">Take selfie</p></div>
      </button>
      <button onclick="openGallery()" class="action-card border border-primary/20">
        <div class="w-9 h-9 rounded-xl bg-primary-container text-primary flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-[19px] filled">photo_library</span></div>
        <div class="text-left"><p class="font-headline font-bold text-[13px]">Gallery</p><p class="font-body text-on-surface-variant text-[10px]">Pick photo</p></div>
      </button>
    </div>
  </section>

  <!-- CUSTOMIZE INLINE (Opens Half-Sheet) -->
  <section class="px-4 pt-2.5">
    <button onclick="openCustomizeSheet()" class="action-card customize-card w-full">
      <div class="w-9 h-9 rounded-xl signature-gradient flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-white text-[19px] filled">tune</span></div>
      <div class="text-left flex-1"><p class="font-headline font-bold text-[13px]">Customize your post</p><p class="font-body text-on-surface-variant text-[10px]">Backgrounds, text, fonts & sizing</p></div>
      <span class="material-symbols-outlined text-primary text-[18px]">chevron_right</span>
    </button>
  </section>
</div>

<!-- SHARE CTA -->
<footer class="fixed bottom-0 left-0 right-0 z-40 pb-6 pt-4 px-4 bg-gradient-to-t from-[#f2f6fa] via-[#f2f6fa] to-transparent pointer-events-none">
  <div class="max-w-[430px] mx-auto pointer-events-auto">
    <button onclick="openShareSheet()" class="w-full py-4 signature-gradient text-on-primary font-headline font-bold rounded-xl shadow-ambient text-[16px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
      <span>Spread The Word</span><span class="material-symbols-outlined">share</span>
    </button>
  </div>
</footer>

<!-- ========================================================================= -->
<!-- UNOBSTRUCTED CUSTOMIZE BOTTOM SHEET -->
<!-- ========================================================================= -->
<div id="sheetOverlay" class="overlay-bg" onclick="closeAllSheets()"></div>

<div id="customizeSheet" class="bottom-sheet">
  <div class="sheet-tabs">
    <button class="sheet-tab active" onclick="switchTab('bg')">Background</button>
    <button class="sheet-tab" onclick="switchTab('text')">Text & Align</button>
    <button class="sheet-tab" onclick="switchTab('style')">Font & Color</button>
    <button class="sheet-tab" onclick="switchTab('format')">Format</button>
  </div>
  
  <div class="sheet-content">
    
    <!-- BACKGROUND TAB -->
    <div id="tab-bg" class="tool-section active">
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Library</p>
      <div id="bgGallery" class="flex gap-2 overflow-x-auto pb-2 mb-4">
        <div class="bg-thumb flex items-center justify-center bg-surface-c border-dashed"><span class="material-symbols-outlined spin text-primary">progress_activity</span></div>
      </div>
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Darkness</p>
      <input type="range" min="0" max="80" value="30" class="w-full accent-primary" id="darknessSlider" oninput="updateState({darkness: this.value})">
    </div>

    <!-- TEXT & ALIGN TAB -->
    <div id="tab-text" class="tool-section">
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Alignment</p>
      <div class="flex gap-2 mb-6">
        <button class="align-btn active" id="align-left" onclick="updateState({align: 'left'})"><span class="material-symbols-outlined">format_align_left</span></button>
        <button class="align-btn" id="align-center" onclick="updateState({align: 'center'})"><span class="material-symbols-outlined">format_align_center</span></button>
        <button class="align-btn" id="align-right" onclick="updateState({align: 'right'})"><span class="material-symbols-outlined">format_align_right</span></button>
      </div>
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Text Size</p>
      <input type="range" min="12" max="48" value="18" class="w-full accent-primary mb-4" id="sizeSlider" oninput="updateState({fontSize: parseInt(this.value)})">
      <p class="font-body text-[11px] text-on-surface-variant mt-2"><span class="material-symbols-outlined text-[14px] align-middle">pinch</span> You can also pinch the text directly on the image to adjust width.</p>
    </div>

    <!-- STYLE TAB -->
    <div id="tab-style" class="tool-section">
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Color</p>
      <div class="flex gap-3 mb-6">
        <button onclick="updateState({textColor: '#FFFFFF'})" class="color-btn" style="background:#FFF; border:2px solid #e3e3db;"></button>
        <button onclick="updateState({textColor: '#0e0e0c'})" class="color-btn" style="background:#0e0e0c;"></button>
        <button onclick="updateState({textColor: '#FCD34D'})" class="color-btn" style="background:#FCD34D;"></button>
        <button onclick="updateState({textShadow: !editorStore.state.textShadow})" class="ml-auto px-3 py-1 bg-surface-c rounded-lg font-bold text-[11px]">Toggle Shadow</button>
      </div>
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Font</p>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="updateState({fontClass: 'font-lora'})" class="p-2 bg-surface-clow rounded-lg font-lora">Lora</button>
        <button onclick="updateState({fontClass: 'font-jakarta'})" class="p-2 bg-surface-clow rounded-lg font-jakarta">Jakarta</button>
        <button onclick="updateState({fontClass: 'font-playfair'})" class="p-2 bg-surface-clow rounded-lg font-playfair">Playfair</button>
        <button onclick="updateState({fontClass: 'font-oswald'})" class="p-2 bg-surface-clow rounded-lg font-oswald text-[11px]">Oswald</button>
        <button onclick="updateState({fontClass: 'font-bebas'})" class="p-2 bg-surface-clow rounded-lg font-bebas text-[11px]">Bebas</button>
        <button onclick="updateState({fontClass: 'font-merri'})" class="p-2 bg-surface-clow rounded-lg font-merri text-[11px]">Merriweather</button>
      </div>
    </div>

    <!-- FORMAT TAB -->
    <div id="tab-format" class="tool-section">
      <p class="font-body font-bold text-[11px] text-on-surface-variant uppercase mb-2">Aspect Ratio</p>
      <div class="flex gap-2">
        <button onclick="updateState({aspectRatio: '1:1'})" class="ratio-btn active" id="ratio-1:1">
          <span class="material-symbols-outlined mb-1">crop_square</span><span class="font-bold text-[10px]">1:1 Square</span>
        </button>
        <button onclick="updateState({aspectRatio: '4:5'})" class="ratio-btn" id="ratio-4:5">
          <span class="material-symbols-outlined mb-1">crop_5_4</span><span class="font-bold text-[10px]">4:5 Feed</span>
        </button>
        <button onclick="updateState({aspectRatio: '9:16'})" class="ratio-btn" id="ratio-9:16">
          <span class="material-symbols-outlined mb-1">crop_portrait</span><span class="font-bold text-[10px]">9:16 Story</span>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- SHARE SHEET -->
<div id="shareSheet" class="bottom-sheet max-h-[85vh] h-auto">
  <div class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-headline font-bold text-[18px]">Spread The Word</h3>
      <button onclick="closeAllSheets()" class="p-1"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="dynamicPlatformGrid" class="grid grid-cols-4 gap-3">
      <div class="col-span-4 text-center py-4"><span class="material-symbols-outlined spin text-primary">progress_activity</span></div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. SUPABASE INIT & GLOBALS
// ==========================================
const supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'YOUR_ANON_KEY'
);

let currentUser = null;
let currentQuoteId = null;
let platformRegistry = [];
let hashtags = [];
const MAX_TAGS = 5;

const fontMap = {
  'font-lora': "'Lora', serif", 'font-jakarta': "'Plus Jakarta Sans', sans-serif",
  'font-playfair': "'Playfair Display', serif", 'font-oswald': "'Oswald', sans-serif",
  'font-bebas': "'Bebas Neue', sans-serif", 'font-merri': "'Merriweather', serif"
};

// ==========================================
// 2. STATE MACHINE (Undo / Redo / UI)
// ==========================================
const editorStore = {
  history: [], index: -1,
  state: {
    bgUrl: null, darkness: 30, textColor: '#FFFFFF', fontClass: 'font-lora',
    textShadow: true, align: 'center', fontSize: 18, aspectRatio: '1:1',
    textW: 80, textX: 10, textY: 25, caption: ''
  },
  push(updates) {
    this.state = { ...this.state, ...updates };
    this.history = this.history.slice(0, this.index + 1);
    this.history.push(JSON.stringify(this.state));
    this.index++;
    this.render(); this.updateUI();
  },
  undo() { if (this.index > 0) { this.index--; this.state = JSON.parse(this.history[this.index]); this.render(); this.updateUI(); } },
  redo() { if (this.index < this.history.length - 1) { this.index++; this.state = JSON.parse(this.history[this.index]); this.render(); this.updateUI(); } },
  
  render() {
    const s = this.state;
    // Canvas
    const ratios = { '1:1': '1/1', '4:5': '4/5', '9:16': '9/16' };
    document.getElementById('previewCanvas').style.aspectRatio = ratios[s.aspectRatio] || '1/1';

    // Background
    const bg = document.getElementById('bgLayer');
    if (s.bgUrl) { bg.style.backgroundImage = `url('${s.bgUrl}')`; }
    else { bg.style.backgroundColor = '#305678'; bg.style.backgroundImage = 'none'; }
    document.getElementById('darkLayer').style.background = `rgba(0,0,0,${s.darkness / 100})`;

    // Text & Overlay
    const overlay = document.getElementById('quoteOverlay');
    overlay.style.width = s.textW + '%'; overlay.style.left = s.textX + '%'; overlay.style.top = s.textY + '%';
    
    const wrap = document.getElementById('textWrap');
    wrap.style.textAlign = s.align;
    
    const qt = document.getElementById('quoteText');
    const qr = document.getElementById('quoteRef');
    qt.className = `leading-snug ${s.fontClass} ${s.textShadow ? 'text-with-shadow' : ''}`;
    qt.style.color = s.textColor; qt.style.fontSize = s.fontSize + 'px';
    qr.className = `mt-3 tracking-wider uppercase font-body font-bold ${s.fontClass} ${s.textShadow ? 'text-with-shadow' : ''}`;
    qr.style.color = s.textColor;
  },
  
  updateUI() {
    document.getElementById('btnUndo').style.opacity = this.index > 0 ? '1' : '0.3';
    document.getElementById('btnRedo').style.opacity = this.index < this.history.length - 1 ? '1' : '0.3';
    
    document.querySelectorAll('.ratio-btn').forEach(btn => btn.classList.remove('active'));
    if(document.getElementById('ratio-' + this.state.aspectRatio)) document.getElementById('ratio-' + this.state.aspectRatio).classList.add('active');
    
    document.querySelectorAll('.align-btn').forEach(btn => btn.classList.remove('active'));
    if(document.getElementById('align-' + this.state.align)) document.getElementById('align-' + this.state.align).classList.add('active');
    
    document.getElementById('darknessSlider').value = this.state.darkness;
    document.getElementById('sizeSlider').value = this.state.fontSize;
    document.getElementById('postCaption').value = this.state.caption;
  },
  
  updateCaption() {
    this.state.caption = document.getElementById('postCaption').value;
    // Don't push to history on every keystroke, just update state
  }
};
function updateState(updates) { editorStore.push(updates); }

// ==========================================
// 3. INIT & LOAD (Backgrounds, Quote, Platforms)
// ==========================================
document.addEventListener('DOMContentLoaded', async () => {
  const qt = document.getElementById('quoteText');
  const qr = document.getElementById('quoteRef');
  
  const { data: qData } = await supabaseClient.from('quotes').select('*').eq('status','live').order('published_at',{ascending:false}).limit(1);
  if(qData && qData.length > 0) {
    currentQuoteId = qData[0].id; qt.textContent = qData[0].text; qr.textContent = '— ' + (qData[0].source || 'GSTW').toUpperCase();
    editorStore.push({ bgUrl: qData[0].background_url || null, caption: qData[0].context || '' });
    if(qData[0].hashtags) {
      hashtags = Array.isArray(qData[0].hashtags) ? qData[0].hashtags : qData[0].hashtags.split(/,\s*/);
      renderHashtags();
    }
  } else {
    qt.textContent = 'The Word is with you today.'; qr.textContent = '— GSTW';
    editorStore.push({});
  }

  setupDragAndPinch();
  loadBackgrounds();
  loadPlatforms();
});

async function loadBackgrounds() {
  const { data } = await supabaseClient.from('media').select('*').eq('category', 'background').order('created_at', {ascending: false});
  if(data) {
    const gal = document.getElementById('bgGallery');
    gal.innerHTML = data.map(b => `<img src="${b.url}" class="bg-thumb" onclick="updateState({bgUrl: '${b.url}'})">`).join('');
  }
}

// ==========================================
// 4. HASHTAGS (RESTORED)
// ==========================================
function toggleHashtagPanel() {
  const p = document.getElementById('hashtagPanel');
  const b = document.getElementById('hashtagToggle');
  p.classList.toggle('open'); b.classList.toggle('open');
  document.getElementById('hashtagChevron').style.transform = p.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0)';
}
function addHashtagFromInput() {
  let val = document.getElementById('hashtagField').value.trim();
  if(!val) return;
  if(val[0] !== '#') val = '#' + val;
  if(!hashtags.includes(val) && hashtags.length < MAX_TAGS) { hashtags.push(val); renderHashtags(); }
  document.getElementById('hashtagField').value = '';
}
function renderHashtags() {
  document.getElementById('hashtagsContainer').innerHTML = hashtags.map(t => `<span class="hashtag-chip">${t} <button onclick="removeTag('${t}')"><span class="material-symbols-outlined text-[12px]">close</span></button></span>`).join('');
  document.getElementById('hashtagPillLabel').textContent = `${hashtags.length} hashtags`;
}
function removeTag(t) { hashtags = hashtags.filter(h => h !== t); renderHashtags(); }

// ==========================================
// 5. DRAG & PINCH (RESTORED & IMPROVED)
// ==========================================
function setupDragAndPinch() {
  const o = document.getElementById('quoteOverlay');
  let isDragging = false, isPinching = false, startX, startY, origX, origY, startDist, startW;
  
  // MOUSE
  o.addEventListener('mousedown', e => {
    isDragging = true; startX = e.clientX; startY = e.clientY;
    origX = editorStore.state.textX; origY = editorStore.state.textY;
  });
  document.addEventListener('mousemove', e => {
    if(!isDragging) return;
    const cvs = document.getElementById('previewCanvas');
    const dx = ((e.clientX - startX) / cvs.offsetWidth) * 100;
    const dy = ((e.clientY - startY) / cvs.offsetHeight) * 100;
    editorStore.state.textX = origX + dx; editorStore.state.textY = origY + dy;
    editorStore.render();
  });
  document.addEventListener('mouseup', () => { if(isDragging) { isDragging = false; editorStore.push({}); } });

  // TOUCH (Drag + Pinch)
  o.addEventListener('touchstart', e => {
    if(e.touches.length === 2) {
      isPinching = true; isDragging = false;
      startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      startW = editorStore.state.textW;
    } else if(e.touches.length === 1) {
      isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      origX = editorStore.state.textX; origY = editorStore.state.textY;
    }
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if(isPinching && e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const newW = Math.max(30, Math.min(100, startW * (dist / startDist)));
      editorStore.state.textW = newW; editorStore.render();
    } else if(isDragging && e.touches.length === 1) {
      const cvs = document.getElementById('previewCanvas');
      const dx = ((e.touches[0].clientX - startX) / cvs.offsetWidth) * 100;
      const dy = ((e.touches[0].clientY - startY) / cvs.offsetHeight) * 100;
      editorStore.state.textX = origX + dx; editorStore.state.textY = origY + dy;
      editorStore.render();
    }
  }, {passive: true});

  document.addEventListener('touchend', e => {
    if(e.touches.length === 0 && (isDragging || isPinching)) {
      isDragging = false; isPinching = false; editorStore.push({});
    }
  });
}

// ==========================================
// 6. BOTTOM SHEETS & TABS (UNOBSTRUCTED UX)
// ==========================================
function openCustomizeSheet() {
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('customizeSheet').classList.add('open');
  // Scroll to top so canvas is perfectly visible
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function closeAllSheets() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('open'));
}
function switchTab(tab) {
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// ==========================================
// 7. EXPORT & SHARE ENGINE
// ==========================================
async function loadPlatforms() {
  const { data } = await supabaseClient.from('platforms').select('*').eq('is_active', true).order('display_order');
  if(data) platformRegistry = data;
}

function openShareSheet() {
  const grid = document.getElementById('dynamicPlatformGrid');
  grid.innerHTML = platformRegistry.map(p => `
    <button onclick="executeShare('${p.slug}')" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-surface-clow active:scale-95 transition-transform" id="btn-${p.slug}">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-sm" style="background:${p.icon_bg}; color:${p.icon_color}">
        <span class="text-[20px] font-bold" style="${p.icon_font ? 'font-family:'+p.icon_font : ''}">${p.icon}</span>
      </div>
      <span class="font-body font-semibold text-on-surface text-[10px] leading-tight text-center">${p.label}</span>
    </button>
  `).join('');
  
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('shareSheet').classList.add('open');
}

async function executeShare(slug) {
  const platform = platformRegistry.find(p => p.slug === slug);
  const btn = document.getElementById('btn-' + slug);
  const origHTML = btn.innerHTML;
  btn.innerHTML = `<div class="w-12 h-12 flex items-center justify-center"><span class="material-symbols-outlined spin text-primary">progress_activity</span></div>`;
  
  // 1. Auto-adjust ratio
  updateState({ aspectRatio: platform.aspect_ratio });
  
  // 2. Generate Canvas Blob
  const blob = await generateCanvasBlob(platform.width, platform.height);
  
  // 3. Compile Full Caption (Text + Hashtags)
  const fullCaption = `${editorStore.state.caption}\n\n${hashtags.join(' ')}`.trim();
  if(fullCaption && navigator.clipboard) { try { await navigator.clipboard.writeText(fullCaption); } catch(e){} }

  // 4. Record to DB
  if(currentQuoteId) {
    await supabaseClient.rpc('record_quote_share', {
      p_quote_id: currentQuoteId, p_platform: slug, 
      p_aspect_ratio: platform.aspect_ratio, p_confidence: 'direct_intent', 
      p_device_type: /Mobi/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
    });
  }

  // 5. Download & Open
  downloadBlob(blob, `GSTW-${slug}.png`);
  closeAllSheets();
  btn.innerHTML = origHTML;

  const url = /Mobi/i.test(navigator.userAgent) ? platform.mobile_url : platform.desktop_url;
  if(url) window.open(url, '_blank');
}

function generateCanvasBlob(targetW, targetH) {
  return new Promise(async (resolve) => {
    const s = editorStore.state;
    const canvas = document.createElement('canvas');
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext('2d');

    // BG
    ctx.fillStyle = '#305678'; ctx.fillRect(0,0,targetW,targetH);
    if(s.bgUrl) {
      const img = new Image(); img.crossOrigin = 'anonymous';
      await new Promise((res) => { img.onload=res; img.onerror=res; img.src=s.bgUrl; });
      const scale = Math.max(targetW/img.width, targetH/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (targetW-w)/2, (targetH-h)/2, w, h);
    }
    // Dark Overlay
    ctx.fillStyle = `rgba(0,0,0,${s.darkness/100})`; ctx.fillRect(0,0,targetW,targetH);

    // Text Setup
    const qt = document.getElementById('quoteText');
    const scaleFactor = targetW / 1080; 
    const fSize = s.fontSize * 3.2 * scaleFactor;
    
    ctx.fillStyle = s.textColor; ctx.textBaseline = 'top';
    ctx.textAlign = s.align; // left, center, right
    ctx.font = `600 ${fSize}px ${fontMap[s.fontClass]}`;
    if(s.textShadow) { ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=12*scaleFactor; ctx.shadowOffsetY=3*scaleFactor; }
    if(s.fontClass === 'font-oswald' || s.fontClass === 'font-bebas') ctx.font = ctx.font.toUpperCase();

    // Wrapping
    const textW = targetW * (s.textW/100);
    const words = qt.textContent.split(' ');
    let line='', lines=[];
    for(let n=0; n<words.length; n++) {
      let test = line + (s.fontClass==='font-oswald'||s.fontClass==='font-bebas' ? words[n].toUpperCase() : words[n]) + ' ';
      if(ctx.measureText(test).width > textW && n>0) { lines.push(line.trim()); line=words[n]+' '; } else { line=test; }
    }
    lines.push(line.trim());

    const lH = fSize * 1.45;
    const startY = (targetH * (s.textY/100));
    
    // Calculate X based on alignment
    let drawX = targetW * (s.textX/100);
    if(s.align === 'center') drawX += (textW/2);
    else if(s.align === 'right') drawX += textW;

    lines.forEach((l, i) => ctx.fillText(l, drawX, startY + (i*lH)));

    // Ref
    const qr = document.getElementById('quoteRef');
    ctx.font = `bold ${fSize*0.45}px "Plus Jakarta Sans", sans-serif`;
    ctx.globalAlpha = 0.9;
    ctx.fillText(qr.textContent, drawX, startY + (lines.length*lH) + (24*scaleFactor));
    
    canvas.toBlob(blob => resolve(blob), 'image/png', 0.95);
  });
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
