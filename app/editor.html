<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f2f6fa">
  <title>Create — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@600&family=Bebas+Neue&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'primary':'#3d6285', 'surface-cl':'#ffffff', 'surface-c':'#efeee7' } } }
    }
  </script>
  <style>
    body { font-family: 'Manrope', sans-serif; background: #f2f6fa; color: #31332e; overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1; display: inline-block; line-height: 1; }
    
    /* Engine Styles */
    #workspace { position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: #0e0e0c; touch-action: none; transition: aspect-ratio 0.4s ease; }
    #bgLayer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: filter 0.2s; }
    #darkLayer { position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
    #textNode { position: absolute; cursor: grab; padding: 12px; border: 1px solid transparent; }
    #textNode.active { border-color: rgba(255,255,255,0.4); }
    
    .guide-line { position: absolute; background: #3b82f6; z-index: 50; opacity: 0; transition: opacity 0.1s; pointer-events: none; }
    #guideV { width: 1px; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); }
    #guideH { height: 1px; left: 0; right: 0; top: 50%; transform: translateY(-50%); }

    /* Bottom Sheets */
    .tool-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); z-index: 100; }
    .tool-sheet.open { transform: translateY(0); }
    .overlay-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 99; }
    .overlay-bg.open { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="pb-32">

<!-- TOP NAV (WITH UNDO/REDO) -->
<header class="fixed top-0 w-full z-50 bg-[#f2f6fa]/90 backdrop-blur-md px-4 pt-10 pb-3 flex items-center justify-between">
  <button onclick="historyUndo()" id="btnUndo" class="p-2 text-gray-400 opacity-50"><span class="material-symbols-outlined">undo</span></button>
  <span class="font-bold text-sm">Editor</span>
  <button onclick="historyRedo()" id="btnRedo" class="p-2 text-gray-400 opacity-50"><span class="material-symbols-outlined">redo</span></button>
</header>

<main class="max-w-[430px] mx-auto pt-24 px-4">
  
  <!-- WORKSPACE CANVAs -->
  <div class="bg-white p-2 rounded-2xl shadow-sm mb-4">
    <div id="workspace">
      <div id="bgLayer"></div>
      <div id="darkLayer"></div>
      <div id="guideV" class="guide-line"></div>
      <div id="guideH" class="guide-line"></div>
      
      <div id="textNode" style="left: 10%; top: 25%; width: 80%;">
        <p id="quoteText" class="text-center font-serif text-white text-2xl font-bold leading-snug drop-shadow-lg">The Word is with you today.</p>
        <p id="quoteRef" class="text-center text-white/90 text-xs font-bold mt-4 tracking-wider uppercase">— GSTW</p>
      </div>
    </div>
  </div>

  <!-- INLINE TOOLS (TIER 1) -->
  <div class="grid grid-cols-4 gap-2 mb-6">
    <button onclick="openTool('text')" class="flex flex-col items-center justify-center p-3 bg-white rounded-xl shadow-sm active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-primary mb-1">text_format</span>
      <span class="text-[10px] font-semibold">Text</span>
    </button>
    <button onclick="openTool('bg')" class="flex flex-col items-center justify-center p-3 bg-white rounded-xl shadow-sm active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-primary mb-1">wallpaper</span>
      <span class="text-[10px] font-semibold">Backdrop</span>
    </button>
    <button onclick="applyAutoContrast()" class="flex flex-col items-center justify-center p-3 bg-white rounded-xl shadow-sm active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-purple-500 mb-1">auto_awesome</span>
      <span class="text-[10px] font-semibold">AI Color</span>
    </button>
    <button onclick="openTool('templates')" class="flex flex-col items-center justify-center p-3 bg-white rounded-xl shadow-sm active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-primary mb-1">style</span>
      <span class="text-[10px] font-semibold">Presets</span>
    </button>
  </div>

  <textarea id="captionBox" placeholder="Add your caption..." class="w-full bg-white rounded-xl p-4 text-sm resize-none h-24 focus:outline-none shadow-sm"></textarea>
</main>

<!-- FLOATING CTA -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md z-40 pb-safe">
  <button onclick="openShareSheet()" class="w-full py-4 bg-gradient-to-r from-[#3d6285] to-[#6b9bc3] text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform text-lg flex items-center justify-center gap-2">
    <span>Spread The Word</span> <span class="material-symbols-outlined text-xl">share</span>
  </button>
</footer>

<!-- OVERLAYS -->
<div id="overlayBg" class="overlay-bg" onclick="closeAllTools()"></div>

<!-- TOOL: TEXT STYLING -->
<div id="tool-text" class="tool-sheet pb-safe">
  <h3 class="font-bold text-lg mb-4 flex justify-between">Typography <button onclick="closeAllTools()"><span class="material-symbols-outlined">close</span></button></h3>
  
  <label class="text-xs font-bold text-gray-500 uppercase">Color</label>
  <div class="flex gap-2 mt-2 mb-4">
    <button onclick="updateState({color: '#FFFFFF'})" class="w-8 h-8 rounded-full bg-white border border-gray-200"></button>
    <button onclick="updateState({color: '#000000'})" class="w-8 h-8 rounded-full bg-black"></button>
    <button onclick="updateState({color: '#FCD34D'})" class="w-8 h-8 rounded-full bg-yellow-300"></button>
    <input type="color" id="colorPicker" class="w-8 h-8 rounded-full border-0 p-0" onchange="updateState({color: this.value})">
  </div>

  <label class="text-xs font-bold text-gray-500 uppercase mt-2">Letter Spacing</label>
  <input type="range" min="0" max="10" value="0" class="w-full mt-2 mb-4" oninput="updateState({letterSpacing: this.value + 'px'})">

  <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
    <span class="font-semibold text-sm">Text Outline</span>
    <input type="checkbox" id="toggleOutline" class="w-5 h-5 rounded" onchange="updateState({outline: this.checked})">
  </div>
</div>

<!-- TOOL: BACKGROUND -->
<div id="tool-bg" class="tool-sheet pb-safe">
  <h3 class="font-bold text-lg mb-4 flex justify-between">Backdrop <button onclick="closeAllTools()"><span class="material-symbols-outlined">close</span></button></h3>
  
  <div class="grid grid-cols-2 gap-2 mb-4">
    <button onclick="document.getElementById('imgUpload').click()" class="py-2 bg-blue-50 text-blue-600 rounded-lg font-semibold text-sm flex items-center justify-center gap-1"><span class="material-symbols-outlined text-sm">upload</span> Upload</button>
    <input type="file" id="imgUpload" accept="image/*" hidden onchange="handleImageUpload(this)">
  </div>

  <label class="text-xs font-bold text-gray-500 uppercase">Darkness</label>
  <input type="range" min="0" max="80" value="30" class="w-full mt-2 mb-4" oninput="updateState({darkness: this.value})">

  <label class="text-xs font-bold text-gray-500 uppercase">Blur Effect</label>
  <input type="range" min="0" max="20" value="0" class="w-full mt-2 mb-4" oninput="updateState({blur: this.value})">
</div>

<!-- 2026 PLATFORM SHARE SHEET -->
<div id="tool-share" class="tool-sheet pb-safe" style="max-height: 85vh; overflow-y: auto;">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-blue-400 rounded-2xl mx-auto flex items-center justify-center shadow-md mb-3"><span class="material-symbols-outlined text-white text-2xl">rocket_launch</span></div>
    <h3 class="font-extrabold text-xl">Spread The Word</h3>
    <p class="text-xs text-gray-500">Pick a platform and we will format it perfectly.</p>
  </div>
  
  <div id="platformGrid" class="grid grid-cols-4 gap-3 mb-6">
    <!-- Populated by JS -->
  </div>
</div>

<script>
 var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

  let currentUser = null;
  let currentQuoteId = '123e4567-e89b-12d3-a456-426614174000'; // Replace with dynamic
  let platformRegistry = [];

  // ==========================================
  // STATE MACHINE & UNDO/REDO (TIER 1)
  // ==========================================
  const editorStore = {
    history: [],
    index: -1,
    state: {
      color: '#FFFFFF',
      letterSpacing: '0px',
      outline: false,
      darkness: 30,
      blur: 0,
      bgUrl: null,
      x: 10, y: 25, width: 80
    },
    push(newState) {
      this.state = { ...this.state, ...newState };
      this.history = this.history.slice(0, this.index + 1);
      this.history.push(JSON.stringify(this.state));
      this.index++;
      this.render();
      updateHistoryButtons();
    },
    undo() { if(this.index > 0) { this.index--; this.state = JSON.parse(this.history[this.index]); this.render(); updateHistoryButtons(); } },
    redo() { if(this.index < this.history.length - 1) { this.index++; this.state = JSON.parse(this.history[this.index]); this.render(); updateHistoryButtons(); } },
    render() {
      const { color, letterSpacing, outline, darkness, blur, bgUrl, x, y, width } = this.state;
      
      const qt = document.getElementById('quoteText');
      const qr = document.getElementById('quoteRef');
      const bg = document.getElementById('bgLayer');
      const dk = document.getElementById('darkLayer');
      const node = document.getElementById('textNode');

      qt.style.color = color;
      qr.style.color = color;
      qt.style.letterSpacing = letterSpacing;
      
      if(outline) qt.style.webkitTextStroke = '1px black';
      else qt.style.webkitTextStroke = '0px';

      dk.style.background = `rgba(0,0,0,${darkness / 100})`;
      bg.style.filter = `blur(${blur}px)`;
      if(bgUrl) bg.style.backgroundImage = `url('${bgUrl}')`;

      node.style.left = `${x}%`;
      node.style.top = `${y}%`;
      node.style.width = `${width}%`;
    }
  };

  function updateState(updates) { editorStore.push(updates); }
  function historyUndo() { editorStore.undo(); haptic('light'); }
  function historyRedo() { editorStore.redo(); haptic('light'); }
  function updateHistoryButtons() {
    document.getElementById('btnUndo').classList.toggle('opacity-50', editorStore.index <= 0);
    document.getElementById('btnRedo').classList.toggle('opacity-50', editorStore.index >= editorStore.history.length - 1);
  }

  // ==========================================
  // GESTURE ENGINE (Drag + Alignment Guides)
  // ==========================================
  const node = document.getElementById('textNode');
  let isDragging = false, startX, startY, originX, originY;

  node.addEventListener('touchstart', e => {
    isDragging = true;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    originX = editorStore.state.x; originY = editorStore.state.y;
    node.classList.add('active');
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if(!isDragging) return;
    const ws = document.getElementById('workspace');
    const dx = ((e.touches[0].clientX - startX) / ws.offsetWidth) * 100;
    const dy = ((e.touches[0].clientY - startY) / ws.offsetHeight) * 100;
    
    let newX = originX + dx;
    let newY = originY + dy;

    // Center snapping & Guides
    const gV = document.getElementById('guideV');
    const gH = document.getElementById('guideH');
    const centerX = 50 - (editorStore.state.width / 2);
    
    if(Math.abs(newX - centerX) < 2) { newX = centerX; gV.style.opacity = 1; haptic('light'); } 
    else gV.style.opacity = 0;

    if(Math.abs(newY - 40) < 2) { newY = 40; gH.style.opacity = 1; haptic('light'); } 
    else gH.style.opacity = 0;

    editorStore.state.x = newX;
    editorStore.state.y = newY;
    editorStore.render();
  }, {passive: true});

  document.addEventListener('touchend', () => {
    if(!isDragging) return;
    isDragging = false;
    node.classList.remove('active');
    document.getElementById('guideV').style.opacity = 0;
    document.getElementById('guideH').style.opacity = 0;
    editorStore.push({}); // Save history state after drag
  });

  // ==========================================
  // AI AUTO-CONTRAST (Tier 1)
  // ==========================================
  async function applyAutoContrast() {
    haptic('medium');
    if(!editorStore.state.bgUrl) return;
    
    // Create temporary canvas to read image luminance
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = editorStore.state.bgUrl;
    img.onload = () => {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 50; c.height = 50;
      ctx.drawImage(img, 0,0,50,50);
      const data = ctx.getImageData(0,0,50,50).data;
      let r=0,g=0,b=0;
      for(let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; }
      const total = data.length/4;
      const luminance = (0.299*(r/total) + 0.587*(g/total) + 0.114*(b/total))/255;
      
      // If image is bright, make text dark. If dark, text white.
      if(luminance > 0.6) { updateState({ color: '#0e0e0c', outline: false, darkness: 10 }); } 
      else { updateState({ color: '#FFFFFF', outline: false, darkness: 30 }); }
    };
  }

  // ==========================================
  // SHARE SHEET & PLATFORMS
  // ==========================================
  async function loadPlatforms() {
    const { data } = await supabase.from('platforms').select('*').eq('is_active', true).order('display_order');
    if(data) platformRegistry = data;
  }

  function openShareSheet() {
    const grid = document.getElementById('platformGrid');
    grid.innerHTML = platformRegistry.map(p => `
      <button onclick="executeShare('${p.slug}')" class="flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-gray-50 active:scale-95 transition-all">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-sm" style="background:${p.icon_bg}; color:${p.icon_color}">
          <span class="text-2xl font-bold">${p.icon}</span>
        </div>
        <span class="text-[10px] font-semibold text-gray-700">${p.label}</span>
      </button>
    `).join('');
    
    openTool('share');
  }

  async function executeShare(slug) {
    const platform = platformRegistry.find(p => p.slug === slug);
    haptic('success');
    
    // In production, insert Canvas Generation Code here matching platform.aspect_ratio
    // ...
    
    // Log Share to Supabase via the RPC Function
    await supabase.rpc('record_quote_share', {
      p_quote_id: currentQuoteId,
      p_platform: slug,
      p_aspect_ratio: platform.aspect_ratio,
      p_confidence: 'direct_intent',
      p_device_type: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
    });

    closeAllTools();
    
    // Redirect to platform
    const url = /Mobi/i.test(navigator.userAgent) ? platform.mobile_url : platform.desktop_url;
    if(url) window.open(url, '_blank');
  }

  // ==========================================
  // UTILS
  // ==========================================
  function handleImageUpload(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = e => updateState({ bgUrl: e.target.result });
      reader.readAsDataURL(file);
    }
  }

  function openTool(id) {
    document.getElementById('overlayBg').classList.add('open');
    document.querySelectorAll('.tool-sheet').forEach(el => el.classList.remove('open'));
    document.getElementById('tool-' + id).classList.add('open');
    haptic('light');
  }

  function closeAllTools() {
    document.getElementById('overlayBg').classList.remove('open');
    document.querySelectorAll('.tool-sheet').forEach(el => el.classList.remove('open'));
  }

  function haptic(type) { if(navigator.vibrate) navigator.vibrate(type === 'light' ? 10 : 20); }

  // Init
  document.addEventListener('DOMContentLoaded', async () => {
    const session = await supabase.auth.getSession();
    if(session.data.session) currentUser = session.data.session.user;
    editorStore.push({}); // Initial state push
    loadPlatforms();
  });
</script>
</body>
</html>
