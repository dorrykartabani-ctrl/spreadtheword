<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Create — Go Spread The Word</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Filerobot Image Editor -->
  <script src="https://scaleflex.cloudimg.io/v7/plugins/filerobot-image-editor/latest/filerobot-image-editor.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&family=Oswald:wght@600&family=Bebas+Neue&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','on-surface':'#31332e','primary':'#3d6285','primary-container':'#b0d5fe','secondary-container':'#cae6ff',
            'celebrate-pink':'#ec4899','celebrate-yellow':'#eab308','celebrate-orange':'#f97316','celebrate-green':'#22c55e',
          },
          fontFamily:{ 'headline':['Plus Jakarta Sans','sans-serif'], 'body':['Manrope','sans-serif'], 'quote':['Lora','serif'] }
        }
      }
    }
  </script>

  <style>
    body {
      font-family:'Manrope',sans-serif;
      background: linear-gradient(180deg, #fbf9f4 0%, #dceeff 100%);
      color:#31332e; min-height:100dvh; margin:0; overflow-x:hidden;
    }
    .signature-gradient { background: linear-gradient(135deg, #3d6285 0%, #6b9bc3 100%); }
    .glass-ui { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    
    /* 2x2 Grid Styling */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-card {
      background: #ffffff; border-radius: 16px; padding: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 700; color: #5e6059;
      box-shadow: 0 4px 12px rgba(61, 98, 133, 0.05);
      border: 1px solid rgba(61, 98, 133, 0.05); transition: all 0.2s;
    }
    .action-card.active { background: #3d6285; color: #fff; }
    .action-card.active span { color: #fff; }
    .action-card span { color: #3d6285; font-size: 20px; }

    /* Canvas definition */
    .canvas-container { background: #fff; border-radius: 24px; padding: 6px; box-shadow: 0 10px 30px rgba(61,98,133,0.1); }
    .preview-canvas { position: relative; width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #000; }

    /* Panels */
    .tool-panel { 
      background: #fff; border-radius: 20px; padding: 12px; margin-top: 8px;
      max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .tool-panel.open { max-height: 400px; opacity: 1; padding: 16px; }

    /* Controls */
    .h-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .bg-thumb { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0; border: 2px solid transparent; }
    .bg-thumb.selected { border-color: #3d6285; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; border: 2px solid transparent; }
    .swatch.selected { border-color: #3d6285; transform: scale(1.1); }

    input[type="range"] { -webkit-appearance: none; height: 4px; background: #e2e8f0; border-radius: 2px; width: 100%; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #3d6285; }

    #filerobot-container { position: fixed; inset: 0; z-index: 100; background: #000; display: none; }
  </style>
</head>

<body class="safe-top safe-bottom">

<div id="filerobot-container"></div>
<input type="file" id="imageLoader" accept="image/*" class="hidden" onchange="initFilerobot(this)">

<div class="max-w-[430px] mx-auto flex flex-col min-h-[100dvh] px-4">
  
  <!-- HEADER - TIGHTENED -->
  <header class="flex items-center justify-between py-3">
    <button onclick="location.href='index.html'" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/50"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button>
    <span class="font-headline font-bold text-[15px]">Create Post</span>
    <button onclick="location.reload()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/50"><span class="material-symbols-outlined text-[20px]">refresh</span></button>
  </header>

  <!-- CANVAS -->
  <div class="canvas-container">
    <div class="preview-canvas" id="previewCanvas">
      <div id="bgLayer" class="absolute inset-0 bg-cover bg-center"></div>
      <div id="darkLayer" class="absolute inset-0" style="background:rgba(0,0,0,0.3)"></div>
      <div id="quoteOverlay" class="absolute z-10 w-[85%] left-[7.5%] top-[30%] cursor-move">
        <div class="text-center p-2">
          <p id="quoteText" class="font-quote font-medium text-white leading-tight transition-all" style="font-size:20px; text-shadow: 0 2px 10px rgba(0,0,0,0.2)"></p>
          <p id="quoteRef" class="mt-3 font-body font-extrabold text-white/90 text-[10px] uppercase tracking-[0.2em]"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2x2 ACTION GRID -->
  <section class="mt-4">
    <div class="action-grid">
      <button onclick="triggerUpload()" class="action-card">
        <span class="material-symbols-outlined">photo_camera</span>Camera
      </button>
      <button onclick="triggerUpload()" class="action-card">
        <span class="material-symbols-outlined">photo_library</span>Gallery
      </button>
      <button id="btnBg" onclick="toggleTool('Background')" class="action-card">
        <span class="material-symbols-outlined">wallpaper</span>Backdrop
      </button>
      <button id="btnText" onclick="toggleTool('Text')" class="action-card">
        <span class="material-symbols-outlined">text_fields</span>Style Text
      </button>
    </div>

    <!-- BACKGROUND PANEL -->
    <div id="panelBackground" class="tool-panel">
      <div class="flex justify-between items-center mb-3">
        <span class="text-[11px] font-bold text-on-surface/50 uppercase tracking-tighter">Admin Backgrounds</span>
        <button onclick="loadAdminMedia()" class="text-primary text-[11px] font-bold">Refresh</button>
      </div>
      <div id="bgList" class="h-scroll mb-4"></div>
      <div class="flex justify-between mb-2"><span class="text-[11px] font-bold">Overlay Darkness</span><span id="darkVal" class="text-primary text-[11px] font-bold">30%</span></div>
      <input type="range" min="0" max="90" value="30" oninput="setDarkness(this.value)">
    </div>

    <!-- TEXT PANEL (ENHANCED) -->
    <div id="panelText" class="tool-panel">
      <!-- Tabs -->
      <div class="flex gap-4 mb-4 border-b border-gray-100 pb-2">
        <button onclick="showSubTab('font')" class="text-[12px] font-bold text-primary">Fonts</button>
        <button onclick="showSubTab('color')" class="text-[12px] font-bold text-gray-400">Colors</button>
        <button onclick="showSubTab('spacing')" class="text-[12px] font-bold text-gray-400">Layout</button>
      </div>

      <!-- Font Sub -->
      <div id="subFont" class="sub-tool">
        <div class="h-scroll">
          <button onclick="updateText('font','font-lora')" class="px-4 py-2 bg-surface rounded-lg text-[13px] font-quote">Lora</button>
          <button onclick="updateText('font','font-jakarta')" class="px-4 py-2 bg-surface rounded-lg text-[13px] font-bold">Jakarta</button>
          <button onclick="updateText('font','font-bebas')" class="px-4 py-2 bg-surface rounded-lg text-[13px] tracking-widest">BEBAS</button>
          <button onclick="updateText('font','font-playfair')" class="px-4 py-2 bg-surface rounded-lg text-[13px] italic">Playfair</button>
        </div>
      </div>

      <!-- Color Sub (ENHANCED) -->
      <div id="subColor" class="sub-tool hidden">
        <p class="text-[10px] font-bold mb-2 opacity-50 uppercase">Sanctuary Tones</p>
        <div class="h-scroll mb-3">
          <div class="swatch bg-white" onclick="updateText('color','#FFFFFF')"></div>
          <div class="swatch bg-[#fbf9f4]" onclick="updateText('color','#fbf9f4')"></div>
          <div class="swatch bg-[#3d6285]" onclick="updateText('color','#3d6285')"></div>
          <div class="swatch bg-[#31332e]" onclick="updateText('color','#31332e')"></div>
        </div>
        <p class="text-[10px] font-bold mb-2 opacity-50 uppercase">Celebration Tones</p>
        <div class="h-scroll">
          <div class="swatch bg-celebrate-pink" onclick="updateText('color','#ec4899')"></div>
          <div class="swatch bg-celebrate-yellow" onclick="updateText('color','#eab308')"></div>
          <div class="swatch bg-celebrate-orange" onclick="updateText('color','#f97316')"></div>
          <div class="swatch bg-celebrate-green" onclick="updateText('color','#22c55e')"></div>
          <div class="swatch bg-[#a855f7]" onclick="updateText('color','#a855f7')"></div>
        </div>
      </div>

      <!-- Spacing Sub -->
      <div id="subSpacing" class="sub-tool hidden">
        <div class="grid grid-cols-2 gap-4">
          <div><p class="text-[10px] font-bold mb-1">Size</p><input type="range" min="14" max="40" value="20" oninput="updateText('size',this.value+'px')"></div>
          <div><p class="text-[10px] font-bold mb-1">Tracking</p><input type="range" min="-2" max="10" value="0" oninput="updateText('spacing',this.value+'px')"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- HASHTAGS - STREAMLINED -->
  <section class="mt-4 bg-primary/5 p-4 rounded-2xl">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[13px] font-bold text-primary">Hashtags</span>
      <span id="tagCount" class="text-[10px] font-bold opacity-50">2/5</span>
    </div>
    <div id="tagList" class="flex flex-wrap gap-2"></div>
  </section>

  <div class="flex-grow"></div>

  <!-- FOOTER -->
  <footer class="py-6">
    <button id="shareBtn" onclick="generateAndShare()" class="w-full py-4 signature-gradient text-white font-headline font-extrabold rounded-2xl shadow-lg flex items-center justify-center gap-2">
      <span>Spread The Word</span>
      <span class="material-symbols-outlined text-[20px]">send</span>
    </button>
  </footer>
</div>

<script>
const sb = supabase.createClient('https://nhymadutuhpjgkiurify.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM');

let currentTool = null, hashtags = ['#SpreadTheWord', '#Grace'], currentBg = null;

// --- INITIALIZATION ---
window.onload = async () => {
  const qt = document.getElementById('quoteText'), qr = document.getElementById('quoteRef');
  const sText = sessionStorage.getItem('gstw_selected_quote_text'), sSrc = sessionStorage.getItem('gstw_selected_quote_source');
  
  if(sText) { qt.textContent = sText; qr.textContent = '— ' + (sSrc || 'GSTW').toUpperCase(); }
  else { 
    const {data} = await sb.from('quotes').select('*').eq('status','live').limit(1).single();
    if(data) { qt.textContent = data.text; qr.textContent = '— ' + (data.source || 'GSTW').toUpperCase(); }
  }
  
  loadAdminMedia();
  renderTags();
  initDrag();
};

// --- FILEROBOT (Zero Storage Workflow) ---
function triggerUpload() { document.getElementById('imageLoader').click(); }

function initFilerobot(input) {
  if (!input.files[0]) return;
  const container = document.getElementById('filerobot-container');
  container.style.display = 'block';
  
  const editor = new FilerobotImageEditor(container, {
    source: input.files[0],
    onSave: (info) => {
      document.getElementById('bgLayer').style.backgroundImage = `url(${info.content})`;
      container.style.display = 'none';
      input.value = '';
    },
    onClose: () => { container.style.display = 'none'; input.value = ''; },
    theme: { palette: { 'bg-primary': '#fbf9f4', 'accent-primary': '#3d6285' } },
    tabsIds: ['ADJUST', 'FILTERS', 'FINETUNE'],
    defaultTabId: 'ADJUST',
    cropPresets: [{ label: 'Post Square', ratio: 1 }]
  });
  editor.render();
}

// --- TOOLS & UI ---
function toggleTool(name) {
  const p = document.getElementById('panel' + name), b = document.getElementById('btn' + (name === 'Background' ? 'Bg' : 'Text'));
  const isClosing = currentTool === name;
  
  document.querySelectorAll('.tool-panel').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.action-card').forEach(el => el.classList.remove('active'));
  
  if(!isClosing) {
    p.classList.add('open');
    b.classList.add('active');
    currentTool = name;
  } else { currentTool = null; }
}

async function loadAdminMedia() {
  const {data} = await sb.from('media').select('*').eq('type','background').eq('is_active',true);
  const list = document.getElementById('bgList');
  list.innerHTML = data.map(m => `
    <div class="bg-thumb" onclick="setBg('${m.url}', this)">
      <img src="${m.url}" class="w-full h-full object-cover">
    </div>
  `).join('');
}

function setBg(url, el) {
  document.getElementById('bgLayer').style.backgroundImage = `url(${url})`;
  document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
}

function updateText(type, val) {
  const qt = document.getElementById('quoteText'), qr = document.getElementById('quoteRef');
  if(type === 'font') { qt.className = 'font-quote font-medium text-white leading-tight ' + val; }
  if(type === 'color') { qt.style.color = val; qr.style.color = val; }
  if(type === 'size') qt.style.fontSize = val;
  if(type === 'spacing') qt.style.letterSpacing = val;
}

function showSubTab(tab) {
  document.querySelectorAll('.sub-tool').forEach(s => s.classList.add('hidden'));
  document.getElementById('sub' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
}

function setDarkness(v) {
  document.getElementById('darkLayer').style.backgroundColor = `rgba(0,0,0,${v/100})`;
  document.getElementById('darkVal').textContent = v + '%';
}

function renderTags() {
  document.getElementById('tagList').innerHTML = hashtags.map(t => `<span class="hashtag-chip bg-white px-3 py-1 rounded-full text-[11px] font-bold text-primary shadow-sm" onclick="removeTag('${t}')">${t}</span>`).join('') + `<button onclick="addTag()" class="text-[11px] font-bold text-primary/40">+ Add</button>`;
  document.getElementById('tagCount').textContent = `${hashtags.length}/5`;
}

function removeTag(t) { hashtags = hashtags.filter(h => h !== t); renderTags(); }
function addTag() { const t = prompt("Enter hashtag:"); if(t && hashtags.length < 5) { hashtags.push(t.startsWith('#')?t:'#'+t); renderTags(); } }

function initDrag() {
  const o = document.getElementById('quoteOverlay'), c = document.getElementById('previewCanvas');
  let active = false, startX, startY, initX, initY;
  const start = (e) => {
    active = true; const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; initX = o.offsetLeft; initY = o.offsetTop;
  };
  const move = (e) => {
    if(!active) return; const t = e.touches ? e.touches[0] : e;
    o.style.left = Math.max(0, Math.min(c.offsetWidth - o.offsetWidth, initX + (t.clientX - startX))) + 'px';
    o.style.top = Math.max(0, Math.min(c.offsetHeight - o.offsetHeight, initY + (t.clientY - startY))) + 'px';
  };
  o.addEventListener('mousedown', start); o.addEventListener('touchstart', start);
  window.addEventListener('mousemove', move); window.addEventListener('touchmove', move);
  window.addEventListener('mouseup', () => active = false); window.addEventListener('touchend', () => active = false);
}

// --- GENERATE & SHARE (History Logic) ---
async function generateAndShare() {
  const btn = document.getElementById('shareBtn');
  btn.innerHTML = `<span>Preparing...</span>`;
  
  // Logic to generate high-res image goes here. For this streamline version, we trigger the system share.
  if(navigator.share) {
    try {
      await navigator.share({ title: 'Go Spread The Word', text: hashtags.join(' ') });
    } catch(e) {}
  }
  btn.innerHTML = `<span>Spread The Word</span><span class="material-symbols-outlined text-[20px]">send</span>`;
}
</script>

</body>
</html>
