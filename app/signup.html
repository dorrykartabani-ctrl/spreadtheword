<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sign Up — Go Spread The Word</title>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface':'#fbf9f4','surface-cl':'#ffffff','surface-clow':'#f5f4ed',
            'surface-c':'#efeee7','surface-chigh':'#e9e8e1',
            'on-surface':'#31332e','on-surface-variant':'#5e6059',
            'inverse-surface':'#0e0e0c','inverse-on-surface':'#9e9d99',
            'outline':'#7a7b75','outline-variant':'#b2b2ab',
            'primary':'#3d6285','on-primary':'#f7f9ff',
            'primary-container':'#b0d5fe','on-primary-container':'#234a6c',
            'secondary':'#41637c',
            'tertiary':'#ad332b','on-tertiary':'#fff7f6',
            'primary-dim':'#305678',
          },
          fontFamily:{
            'headline':['Plus Jakarta Sans','sans-serif'],
            'body':['Manrope','sans-serif'],
          },
          boxShadow:{
            'ambient':'0 20px 40px rgba(49,51,46,0.05)',
            'float':'0 20px 40px rgba(49,51,46,0.08)',
          },
        },
      },
    }
  </script>

  <style>
    body{
      font-family:'Manrope',sans-serif;
      background:#fbf9f4;
      color:#31332e;
      -webkit-tap-highlight-color:transparent;
      min-height:100dvh;
      letter-spacing:-0.005em;
    }
    .font-headline{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}
    .filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
    .signature-gradient{background:linear-gradient(135deg,#3d6285,#6b9bc3)}

    .auth-input{
      background:#ffffff;
      border:1px solid transparent;
      transition:all 0.2s ease;
      color:#31332e;
    }
    .auth-input:focus{
      background:#ffffff;
      border-color:rgba(61,98,133,0.3);
      outline:none;
    }
    .auth-input::placeholder{color:#b2b2ab}
    .auth-input.error{border-color:#ad332b}

    .pass-toggle{cursor:pointer;color:#b2b2ab;transition:color 0.15s}
    .pass-toggle:hover{color:#5e6059}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }
    .fade-up{animation:fadeUp 0.6s ease-out both}
    .fade-up-2{animation:fadeUp 0.6s ease-out 0.15s both}

    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite;display:inline-block}

    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    .shake{animation:shake 0.3s ease}

    /* Custom checkbox */
    .custom-check{
      width:20px;height:20px;border-radius:6px;
      border:2px solid #b2b2ab;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all 0.15s ease;
      flex-shrink:0;
    }
    .custom-check.checked{
      background:#3d6285;border-color:#3d6285;
    }
  </style>
</head>

<body class="flex items-center justify-center">

<div class="w-full max-w-[400px] mx-auto px-6 py-8 flex flex-col min-h-[100dvh] justify-center">

  <!-- Logo -->
  <div class="flex flex-col items-center mb-8 fade-up">
    <img src="/images/logo/logo-full-dark.png" alt="Go Spread The Word"
      class="h-16 object-contain mx-auto mb-3"
      style="mix-blend-mode:multiply;">
    <p class="font-body text-on-surface-variant text-center" style="font-size:13px;">Join the mission</p>
  </div>

  <!-- Signup Card -->
  <div class="fade-up-2 bg-surface-cl rounded-2xl p-6 shadow-ambient">

    <h2 class="font-headline font-bold text-on-surface mb-1" style="font-size:20px;line-height:26px;">Create your account</h2>
    <p class="font-body text-on-surface-variant mb-5" style="font-size:13px;">Start spreading the Word today</p>

    <!-- Referral banner (shown if referred) -->
    <div id="referralBanner" class="hidden bg-primary-container/20 rounded-xl p-3 flex items-center gap-2 mb-5">
      <span class="material-symbols-outlined text-primary filled" style="font-size:16px;">handshake</span>
      <p class="font-body text-primary" style="font-size:12px;">
        You've been invited by a fellow warrior!
      </p>
    </div>

    <!-- Error -->
    <div id="signupError" class="hidden bg-tertiary/10 rounded-xl p-3.5 flex items-center gap-3 mb-5">
      <span class="material-symbols-outlined text-tertiary flex-shrink-0" style="font-size:18px;">error</span>
      <p id="signupErrorMsg" class="font-body font-semibold text-tertiary" style="font-size:12px;"></p>
    </div>

    <form onsubmit="handleSignup(event)" class="space-y-4">

      <!-- Full Name -->
      <div>
        <label class="font-body text-on-surface-variant block mb-2" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Full Name <span class="text-tertiary">*</span></label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size:18px;">person</span>
          <input id="signupName" type="text" required autocomplete="name"
            placeholder="Your full name"
            class="auth-input w-full rounded-xl pl-11 pr-4 py-3 font-body"
            style="font-size:14px;">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="font-body text-on-surface-variant block mb-2" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Email <span class="text-tertiary">*</span></label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size:18px;">mail</span>
          <input id="signupEmail" type="email" required autocomplete="email"
            placeholder="you@example.com"
            class="auth-input w-full rounded-xl pl-11 pr-4 py-3 font-body"
            style="font-size:14px;">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="font-body text-on-surface-variant block mb-2" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Password <span class="text-tertiary">*</span></label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size:18px;">lock</span>
          <input id="signupPassword" type="password" required autocomplete="new-password"
            placeholder="Minimum 8 characters"
            class="auth-input w-full rounded-xl pl-11 pr-11 py-3 font-body"
            style="font-size:14px;">
          <button type="button" onclick="togglePassword('signupPassword','signupPassIcon')" class="pass-toggle absolute right-4 top-1/2 -translate-y-1/2">
            <span id="signupPassIcon" class="material-symbols-outlined" style="font-size:18px;">visibility_off</span>
          </button>
        </div>
        <div id="passwordStrength" class="hidden mt-2">
          <div class="flex gap-1">
            <div id="str1" class="flex-1 h-1 rounded-full bg-surface-chigh"></div>
            <div id="str2" class="flex-1 h-1 rounded-full bg-surface-chigh"></div>
            <div id="str3" class="flex-1 h-1 rounded-full bg-surface-chigh"></div>
            <div id="str4" class="flex-1 h-1 rounded-full bg-surface-chigh"></div>
          </div>
          <p id="strLabel" class="font-body text-outline mt-1" style="font-size:10px;"></p>
        </div>
      </div>

      <!-- Country + City -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="font-body text-on-surface-variant block mb-2" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Country</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size:18px;">public</span>
            <input id="signupCountry" type="text" autocomplete="country-name"
              placeholder="Country"
              class="auth-input w-full rounded-xl pl-11 pr-3 py-3 font-body"
              style="font-size:14px;">
          </div>
        </div>
        <div>
          <label class="font-body text-on-surface-variant block mb-2" style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">City</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size:18px;">location_city</span>
            <input id="signupCity" type="text" autocomplete="address-level2"
              placeholder="City"
              class="auth-input w-full rounded-xl pl-11 pr-3 py-3 font-body"
              style="font-size:14px;">
          </div>
        </div>
      </div>

      <!-- Referral Code (hidden, auto-filled from URL) -->
      <input id="signupRef" type="hidden" value="">

      <!-- Terms -->
      <div class="flex items-start gap-3 pt-1">
        <div id="termsCheck" class="custom-check mt-0.5" onclick="toggleTerms()">
          <span class="material-symbols-outlined text-on-primary hidden" style="font-size:14px;" id="termsIcon">check</span>
        </div>
        <p class="font-body text-on-surface-variant" style="font-size:12px;line-height:18px;">
          I agree to the
          <a href="terms.html" class="text-primary font-semibold">Terms of Service</a>
          and
          <a href="privacy.html" class="text-primary font-semibold">Privacy Policy</a>
        </p>
      </div>

      <!-- Submit -->
      <button type="submit" id="signupBtn"
        class="w-full py-3.5 signature-gradient text-on-primary font-headline font-bold rounded-xl
        active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
        style="font-size:15px;">
        <span id="signupBtnIcon" class="material-symbols-outlined" style="font-size:20px;">person_add</span>
        <span id="signupBtnLabel">Create Account</span>
      </button>

    </form>

  </div>

  <!-- Login Link -->
  <div class="text-center mt-6 fade-up-2">
    <p class="font-body text-on-surface-variant" style="font-size:13px;">
      Already have an account?
      <a href="login.html" class="font-semibold text-primary">Sign in</a>
    </p>
  </div>

  <!-- Back to site -->
  <div class="text-center mt-4 fade-up-2">
    <a href="../index.html" class="font-body text-outline inline-flex items-center gap-1" style="font-size:12px;">
      <span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>
      Back to main site
    </a>
  </div>

</div>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
)

var termsAccepted = false
var referralCode = null

// Check existing session
async function checkExistingSession() {
  try {
    var result = await supabaseClient.auth.getSession()
    if (result.data && result.data.session) {
      window.location.href = 'index.html'
    }
  } catch(e) {}
}

checkExistingSession()

// Check for referral code in URL
function checkReferralCode() {
  var params = new URLSearchParams(window.location.search)
  var ref = params.get('ref')
  if (ref) {
    referralCode = ref
    document.getElementById('signupRef').value = ref
    document.getElementById('referralBanner').classList.remove('hidden')
  }
}

checkReferralCode()

// Password strength
document.addEventListener('DOMContentLoaded', function() {
  var passInput = document.getElementById('signupPassword')
  passInput.addEventListener('input', function() {
    var val = passInput.value
    var strengthEl = document.getElementById('passwordStrength')
    if (val.length === 0) { strengthEl.classList.add('hidden'); return }
    strengthEl.classList.remove('hidden')

    var score = 0
    if (val.length >= 8) score++
    if (/[A-Z]/.test(val)) score++
    if (/[0-9]/.test(val)) score++
    if (/[^A-Za-z0-9]/.test(val)) score++

    var colors = ['#ad332b', '#ad332b', '#41637c', '#3d6285', '#3d6285']
    var labels = ['Very weak', 'Weak', 'Fair', 'Good', 'Strong']

    for (var i = 1; i <= 4; i++) {
      var bar = document.getElementById('str' + i)
      if (i <= score) {
        bar.style.background = colors[score]
      } else {
        bar.style.background = '#e9e8e1'
      }
    }

    document.getElementById('strLabel').textContent = labels[score]
    document.getElementById('strLabel').style.color = colors[score]
  })
})

// Terms toggle
function toggleTerms() {
  termsAccepted = !termsAccepted
  var check = document.getElementById('termsCheck')
  var icon = document.getElementById('termsIcon')
  if (termsAccepted) {
    check.classList.add('checked')
    icon.classList.remove('hidden')
  } else {
    check.classList.remove('checked')
    icon.classList.add('hidden')
  }
}

function togglePassword(inputId, iconId) {
  var input = document.getElementById(inputId)
  var icon = document.getElementById(iconId)
  if (input.type === 'password') {
    input.type = 'text'
    icon.textContent = 'visibility'
  } else {
    input.type = 'password'
    icon.textContent = 'visibility_off'
  }
}

// Signup
async function handleSignup(e) {
  e.preventDefault()

  var name = document.getElementById('signupName').value.trim()
  var email = document.getElementById('signupEmail').value.trim()
  var password = document.getElementById('signupPassword').value
  var country = document.getElementById('signupCountry').value.trim()
  var city = document.getElementById('signupCity').value.trim()
  var btn = document.getElementById('signupBtn')
  var icon = document.getElementById('signupBtnIcon')
  var label = document.getElementById('signupBtnLabel')
  var errorEl = document.getElementById('signupError')
  var errorMsg = document.getElementById('signupErrorMsg')

  errorEl.classList.add('hidden')
  document.querySelectorAll('.auth-input').forEach(function(i) { i.classList.remove('error') })

  // Validation
  var hasError = false
  if (!name) { document.getElementById('signupName').classList.add('error'); hasError = true }
  if (!email) { document.getElementById('signupEmail').classList.add('error'); hasError = true }
  if (!password || password.length < 8) {
    document.getElementById('signupPassword').classList.add('error')
    if (password && password.length < 8) {
      errorMsg.textContent = 'Password must be at least 8 characters'
      errorEl.classList.remove('hidden')
    }
    hasError = true
  }
  if (!termsAccepted) {
    errorMsg.textContent = 'Please accept the Terms and Privacy Policy'
    errorEl.classList.remove('hidden')
    hasError = true
  }

  if (hasError) {
    if (!errorMsg.textContent) {
      errorMsg.textContent = 'Please fill in all required fields'
      errorEl.classList.remove('hidden')
    }
    return
  }

  icon.classList.add('spin')
  icon.textContent = 'progress_activity'
  label.textContent = 'Creating account...'
  btn.disabled = true

  try {
    // Create auth user
    var authResult = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: name,
          country: country || null,
          city: city || null
        }
      }
    })

    if (authResult.error) {
      errorMsg.textContent = authResult.error.message
      errorEl.classList.remove('hidden')
      resetSignupBtn()
      return
    }

    var userId = authResult.data.user.id

    // Create profile
    var profileData = {
      id: userId,
      email: email,
      full_name: name,
      country: country || null,
      city: city || null,
      role: 'user',
      subscription_tier: 'free',
      subscription_status: 'inactive',
      onboarding_complete: false,
      total_shares: 0,
      current_streak: 0,
      recruit_count: 0,
      watermark_enabled: true
    }

    var profileResult = await supabaseClient.from('profiles').upsert(profileData)
    if (profileResult.error) console.error('Profile creation error:', profileResult.error)

    // Handle referral
    if (referralCode) {
      try {
        // Find referrer by invite code
        var referrerResult = await supabaseClient
          .from('profiles')
          .select('id')
          .eq('invite_code', referralCode)
          .single()

        if (referrerResult.data) {
          // Create referral record
          await supabaseClient.from('referrals').insert({
            referrer_id: referrerResult.data.id,
            referred_id: userId,
            referral_code: referralCode,
            status: 'signed_up',
            signed_up_at: new Date().toISOString()
          })

          // Update referred_by on profile
          await supabaseClient.from('profiles').update({
            referred_by: referrerResult.data.id
          }).eq('id', userId)

          // Increment referrer's recruit count
          await supabaseClient.rpc('increment_recruit_count', { user_id: referrerResult.data.id })
        }
      } catch(refError) {
        console.error('Referral tracking error:', refError)
        // Don't block signup if referral fails
      }
    }

    // Success
    icon.classList.remove('spin')
    icon.textContent = 'check_circle'
    label.textContent = 'Welcome!'

    // Check if email confirmation is required
    if (authResult.data.session) {
      // Auto-confirmed — go to onboarding
      setTimeout(function() {
        window.location.href = 'onboarding.html'
      }, 700)
    } else {
      // Email confirmation required
      setTimeout(function() {
        icon.textContent = 'mail'
        label.textContent = 'Check your email'
        btn.disabled = false

        errorEl.classList.remove('hidden')
        errorMsg.textContent = ''
        errorEl.className = 'bg-primary-container/20 rounded-xl p-3.5 flex items-center gap-3 mb-5'
        errorEl.innerHTML =
          '<span class="material-symbols-outlined text-primary filled flex-shrink-0" style="font-size:18px;">mail</span>'
          + '<p class="font-body font-semibold text-primary" style="font-size:12px;">Check your email to verify your account, then come back to sign in.</p>'
      }, 700)
    }

  } catch(err) {
    console.error('Signup error:', err)
    errorMsg.textContent = 'Something went wrong. Please try again.'
    errorEl.classList.remove('hidden')
    resetSignupBtn()
  }
}

function resetSignupBtn() {
  var icon = document.getElementById('signupBtnIcon')
  var label = document.getElementById('signupBtnLabel')
  var btn = document.getElementById('signupBtn')
  icon.classList.remove('spin')
  icon.textContent = 'person_add'
  label.textContent = 'Create Account'
  btn.disabled = false
}
</script>
</body>
</html>
