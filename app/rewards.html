<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rewards — Command Center</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Lora:ital@1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': '#f8fafc', 'card': '#ffffff', 'text-main': '#0f172a', 'text-muted': '#64748b',
            'primary': '#3d6285', 'gold': '#D4A24C',
            'common': '#94a3b8', 'uncommon': '#16a34a', 'rare': '#2563eb', 'epic': '#9333ea', 'mythic': '#d97706'
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans', 'sans-serif'],
            'body': ['Manrope', 'sans-serif'],
            'quote': ['Lora', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', sans-serif; background: #f8fafc; color: #0f172a; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-quote { font-family: 'Lora', serif; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .dash-card { 
      background: white; 
      border-radius: 24px; 
      padding: 20px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
      border: 1px solid #f1f5f9; 
    }

    .reward-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      border: 2px solid #f1f5f9;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .reward-card.locked {
      opacity: 0.6;
      filter: grayscale(0.5);
    }

    .reward-card.unlocked {
      border-color: #D4A24C;
      box-shadow: 0 8px 24px rgba(212, 162, 76, 0.15);
    }

    .reward-card.unlocked::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(212, 162, 76, 0.05) 0%, transparent 100%);
      pointer-events: none;
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tier-common { background: #94a3b8; color: white; }
    .tier-uncommon { background: #16a34a; color: white; }
    .tier-rare { background: #2563eb; color: white; }
    .tier-epic { background: #9333ea; color: white; }
    .tier-mythic { background: #d97706; color: white; }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease;
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(212, 162, 76, 0.3) 50%, transparent 100%);
      background-size: 1000px 100%;
      animation: shimmer 3s infinite;
    }
  </style>
</head>
<body class="pb-32">

<!-- HEADER -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
  <div class="max-w-[430px] mx-auto px-6 py-4 flex justify-between items-center">
    <button onclick="window.location.href='impact.html'" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
    </button>
    <h1 class="font-headline font-extrabold text-lg text-slate-900">Rewards</h1>
    <div class="w-10"></div> <!-- Spacer for centering -->
  </div>
</header>

<main class="pt-24 px-5 max-w-[430px] mx-auto space-y-6 pb-8">

  <!-- REWARDS SUMMARY CARD -->
  <section class="dash-card relative overflow-hidden">
    <div class="absolute top-0 right-0 w-40 h-40 bg-gold/10 rounded-full blur-3xl"></div>
    
    <div class="relative z-10">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-gold to-amber-600 flex items-center justify-center shimmer">
          <span class="material-symbols-outlined text-white text-[28px] filled">workspace_premium</span>
        </div>
        <div>
          <h2 class="font-headline font-black text-2xl text-slate-900">Your Rewards</h2>
          <p class="text-xs text-slate-500 font-semibold">Keep going to unlock more!</p>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div class="text-center p-3 bg-slate-50 rounded-xl">
          <p id="totalUnlocked" class="font-headline font-black text-2xl text-gold">0</p>
          <p class="text-[9px] font-bold text-slate-400 uppercase mt-1">Unlocked</p>
        </div>
        <div class="text-center p-3 bg-slate-50 rounded-xl">
          <p id="totalLocked" class="font-headline font-black text-2xl text-slate-400">0</p>
          <p class="text-[9px] font-bold text-slate-400 uppercase mt-1">Locked</p>
        </div>
        <div class="text-center p-3 bg-gradient-to-br from-gold/10 to-amber-100 rounded-xl border border-gold/20">
          <p id="nextRewardIn" class="font-headline font-black text-2xl text-amber-700">-</p>
          <p class="text-[9px] font-bold text-amber-600 uppercase mt-1">Next In</p>
        </div>
      </div>
    </div>
  </section>

  <!-- FILTER TABS -->
  <section>
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="unlocked">Unlocked</button>
      <button class="filter-btn" data-filter="locked">Locked</button>
      <button class="filter-btn" data-filter="mythic">Mythic</button>
      <button class="filter-btn" data-filter="epic">Epic</button>
    </div>
  </section>

  <!-- REWARDS GRID -->
  <section id="rewardsContainer" class="space-y-4">
    <!-- Rewards will be dynamically loaded here -->
    <div class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-primary"></div>
      <p class="text-sm text-slate-400 mt-3 font-semibold">Loading rewards...</p>
    </div>
  </section>

</main>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 inset-x-0 z-40 bg-white/80 backdrop-blur-[20px] border-t border-slate-100" style="padding-bottom: env(safe-area-inset-bottom);">
  <div class="max-w-lg mx-auto flex items-center justify-around h-16 px-2">
    <a href="index.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">home</span><span class="text-[10px] font-bold">Home</span></a>
    <a href="library.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">auto_stories</span><span class="text-[10px] font-bold">Library</span></a>
    <a href="cause.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">volunteer_activism</span><span class="text-[10px] font-bold">Missions</span></a>
    <a href="impact.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-primary bg-primary/5 rounded-xl"><span class="material-symbols-outlined filled" style="font-size:1.35rem">bar_chart</span><span class="text-[10px] font-bold">Impact</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">person</span><span class="text-[10px] font-bold">Profile</span></a>
  </div>
</nav>

<script>
var supabaseClient = supabase.createClient(
  'https://nhymadutuhpjgkiurify.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM'
);

var currentUser = null;
var userTrophies = [];
var allRewards = [];
var currentFilter = 'all';

// Sample rewards data structure (you'll want to store this in Supabase eventually)
var REWARDS_DATABASE = [
  // Mythic Tier
  {
    id: 'myth_1',
    title: 'First Mythic Trophy',
    description: 'Achieve your first Mythic-tier trophy',
    tier: 'mythic',
    icon: 'military_tech',
    requirement_type: 'mythic_count',
    requirement_value: 1,
    reward_type: 'badge',
    reward_value: 'Mythic Pioneer'
  },
  {
    id: 'myth_5',
    title: 'Mythic Collector',
    description: 'Earn 5 Mythic trophies',
    tier: 'mythic',
    icon: 'trophy',
    requirement_type: 'mythic_count',
    requirement_value: 5,
    reward_type: 'title',
    reward_value: 'Legend'
  },
  
  // Epic Tier
  {
    id: 'epic_3',
    title: 'Epic Achiever',
    description: 'Unlock 3 Epic trophies',
    tier: 'epic',
    icon: 'stars',
    requirement_type: 'epic_count',
    requirement_value: 3,
    reward_type: 'badge',
    reward_value: 'Epic Warrior'
  },
  
  // Rare Tier
  {
    id: 'rare_10',
    title: 'Rare Collector',
    description: 'Collect 10 Rare trophies',
    tier: 'rare',
    icon: 'collections_bookmark',
    requirement_type: 'rare_count',
    requirement_value: 10,
    reward_type: 'badge',
    reward_value: 'Rare Hunter'
  },
  
  // Share-based
  {
    id: 'share_10',
    title: 'First Shares',
    description: 'Share the gospel 10 times',
    tier: 'uncommon',
    icon: 'share',
    requirement_type: 'shares',
    requirement_value: 10,
    reward_type: 'badge',
    reward_value: 'Voice of Truth'
  },
  {
    id: 'share_100',
    title: 'Century Sharer',
    description: 'Share the gospel 100 times',
    tier: 'rare',
    icon: 'campaign',
    requirement_type: 'shares',
    requirement_value: 100,
    reward_type: 'badge',
    reward_value: 'Evangelist'
  },
  
  // Recruit-based
  {
    id: 'recruit_1',
    title: 'First Recruit',
    description: 'Invite your first warrior',
    tier: 'common',
    icon: 'person_add',
    requirement_type: 'recruits',
    requirement_value: 1,
    reward_type: 'badge',
    reward_value: 'Recruiter'
  },
  {
    id: 'recruit_10',
    title: 'Squad Leader',
    description: 'Recruit 10 warriors',
    tier: 'epic',
    icon: 'groups',
    requirement_type: 'recruits',
    requirement_value: 10,
    reward_type: 'title',
    reward_value: 'Captain'
  },
  
  // Nations
  {
    id: 'nations_5',
    title: 'Global Reach',
    description: 'Reach warriors in 5 nations',
    tier: 'rare',
    icon: 'public',
    requirement_type: 'nations',
    requirement_value: 5,
    reward_type: 'badge',
    reward_value: 'Global Ambassador'
  },
  
  // Total Trophies
  {
    id: 'trophy_25',
    title: 'Trophy Hunter',
    description: 'Earn 25 total trophies',
    tier: 'epic',
    icon: 'emoji_events',
    requirement_type: 'total_trophies',
    requirement_value: 25,
    reward_type: 'title',
    reward_value: 'Champion'
  }
];

async function init() {
  var s = await supabaseClient.auth.getSession();
  if (!s.data.session) { 
    window.location.href = 'login.html'; 
    return; 
  }
  currentUser = s.data.session.user;
  
  await loadRewardsData();
  setupFilters();
}

async function loadRewardsData() {
  try {
    // Fetch user profile
    var { data: profile } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    // Fetch user trophies
    var { data: trophies } = await supabaseClient
      .from('user_trophy_progress')
      .select('*')
      .eq('user_id', currentUser.id);

    userTrophies = trophies || [];

    // Fetch recruits count
    var { count: recruitsCount } = await supabaseClient
      .from('profiles')
      .select('id', { count: 'exact', head: true })
      .eq('referred_by', currentUser.id);

    // Fetch nations count
    var { data: nationsData } = await supabaseClient
      .from('profiles')
      .select('country')
      .eq('referred_by', currentUser.id)
      .not('country', 'is', null);

    var uniqueNations = new Set((nationsData || []).map(p => p.country)).size;

    // Calculate trophy tier counts
    var tierCounts = { common: 0, uncommon: 0, rare: 0, epic: 0, mythic: 0 };
    var totalTrophies = 0;

    userTrophies.forEach(t => {
      var level = parseInt(t.current_tier_level || t.current_tier_id || 0);
      if (level > 0) {
        totalTrophies++;
        if (level === 1) tierCounts.common++;
        else if (level === 2) tierCounts.uncommon++;
        else if (level === 3) tierCounts.rare++;
        else if (level === 4) tierCounts.epic++;
        else if (level === 5) tierCounts.mythic++;
      }
    });

    // User stats for checking requirements
    var userStats = {
      shares: profile.total_shares || 0,
      recruits: recruitsCount || 0,
      nations: uniqueNations,
      total_trophies: totalTrophies,
      common_count: tierCounts.common,
      uncommon_count: tierCounts.uncommon,
      rare_count: tierCounts.rare,
      epic_count: tierCounts.epic,
      mythic_count: tierCounts.mythic
    };

    // Process rewards
    allRewards = REWARDS_DATABASE.map(reward => {
      var userValue = userStats[reward.requirement_type] || 0;
      var isUnlocked = userValue >= reward.requirement_value;
      
      return {
        ...reward,
        unlocked: isUnlocked,
        progress: userValue,
        progressPercent: Math.min(100, (userValue / reward.requirement_value) * 100)
      };
    });

    // Update summary
    var unlockedCount = allRewards.filter(r => r.unlocked).length;
    var lockedCount = allRewards.length - unlockedCount;
    
    document.getElementById('totalUnlocked').textContent = unlockedCount;
    document.getElementById('totalLocked').textContent = lockedCount;
    
    // Find next reward
    var nextReward = allRewards
      .filter(r => !r.unlocked)
      .sort((a, b) => (a.requirement_value - a.progress) - (b.requirement_value - b.progress))[0];
    
    if (nextReward) {
      var remaining = nextReward.requirement_value - nextReward.progress;
      document.getElementById('nextRewardIn').textContent = remaining;
    } else {
      document.getElementById('nextRewardIn').textContent = '🎉';
    }

    renderRewards();

  } catch (err) {
    console.error('Error loading rewards:', err);
  }
}

function renderRewards() {
  var container = document.getElementById('rewardsContainer');
  var filtered = allRewards.filter(r => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'unlocked') return r.unlocked;
    if (currentFilter === 'locked') return !r.unlocked;
    return r.tier === currentFilter;
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="text-center py-12">
        <span class="material-symbols-outlined text-slate-300 text-[64px]">search_off</span>
        <p class="text-sm text-slate-400 mt-3 font-semibold">No rewards found</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(reward => `
    <div class="reward-card ${reward.unlocked ? 'unlocked' : 'locked'}">
      <div class="flex items-start gap-4">
        <!-- Icon -->
        <div class="flex-shrink-0 w-14 h-14 rounded-2xl bg-gradient-to-br ${getTierGradient(reward.tier)} flex items-center justify-center ${reward.unlocked ? '' : 'opacity-50'}">
          <span class="material-symbols-outlined text-white text-[28px] ${reward.unlocked ? 'filled' : ''}">${reward.icon}</span>
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2 mb-2">
            <h3 class="font-headline font-bold text-base text-slate-900 leading-tight">${reward.title}</h3>
            ${reward.unlocked ? '<span class="material-symbols-outlined text-gold text-[20px] filled flex-shrink-0">check_circle</span>' : ''}
          </div>
          
          <p class="text-xs text-slate-500 mb-3">${reward.description}</p>

          <!-- Progress Bar -->
          <div class="space-y-1">
            <div class="flex justify-between items-center text-[10px] font-bold">
              <span class="tier-badge tier-${reward.tier}">${reward.tier}</span>
              <span class="text-slate-400">${reward.progress}/${reward.requirement_value}</span>
            </div>
            <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full ${getTierBgClass(reward.tier)} transition-all duration-500" style="width: ${reward.progressPercent}%"></div>
            </div>
          </div>

          <!-- Reward Info -->
          ${reward.unlocked ? `
            <div class="mt-3 p-2 bg-gold/10 border border-gold/20 rounded-lg">
              <p class="text-[10px] font-bold text-gold uppercase">Reward: ${reward.reward_value}</p>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function getTierGradient(tier) {
  var gradients = {
    common: 'from-slate-400 to-slate-500',
    uncommon: 'from-green-500 to-green-600',
    rare: 'from-blue-500 to-blue-600',
    epic: 'from-purple-500 to-purple-600',
    mythic: 'from-amber-500 to-amber-600'
  };
  return gradients[tier] || gradients.common;
}

function getTierBgClass(tier) {
  var classes = {
    common: 'bg-slate-400',
    uncommon: 'bg-green-500',
    rare: 'bg-blue-500',
    epic: 'bg-purple-500',
    mythic: 'bg-amber-500'
  };
  return classes[tier] || classes.common;
}

function setupFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderRewards();
    });
  });
}

init();
</script>

<style>
.filter-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  color: #64748b;
  background: white;
  border: 2px solid #f1f5f9;
  transition: all 0.2s;
  cursor: pointer;
}

.filter-btn.active {
  background: #3d6285;
  color: white;
  border-color: #3d6285;
}

.filter-btn:hover {
  border-color: #cbd5e1;
}
</style>

</body>
</html>
