<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rewards — Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'surface': '#f8fafc', 'primary': '#3d6285', 'gold': '#D4A24C' }, fontFamily: { 'headline': ['Plus Jakarta Sans', 'sans-serif'], 'body': ['Manrope', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { font-family: 'Manrope', sans-serif; background: #f8fafc; color: #0f172a; }
    .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 700; font-size: 14px; color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: #3d6285; border-bottom-color: #3d6285; background: rgba(61, 98, 133, 0.05); }
    
    /* Trophy Card - Square like Image 1 */
    .bold-block { 
      aspect-ratio: 1 / 1; /* Makes it a perfect square */
      border-radius: 1.5rem; /* rounded-3xl */
      overflow: hidden; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 12px; 
      text-align: center; 
      color: white; 
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .bold-block:active { transform: scale(0.96); }
    .bold-block img { max-height: 55%; width: auto; margin-bottom: 8px; object-fit: contain; }
    
    /* Locked State */
    .locked-block { background-color: #cbd5e1 !important; color: #64748b; opacity: 0.8; }
    .locked-block img { filter: grayscale(100%) opacity(0.5); }

    /* Badge Card */
    .badge-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s ease; padding: 10px; }
    .badge-item:active { transform: scale(0.95); }
    .badge-item img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 8px; }
    .badge-item.locked img { filter: grayscale(100%) opacity(0.3); }
    .badge-item p { font-size: 11px; font-weight: 700; color: #475569; text-align: center; line-height: 1.2; }
  </style>
</head>
<body class="pb-32">

<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 pt-[env(safe-area-inset-top)]">
  <div class="max-w-[430px] mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="/images/icon/icon-light-512.png" alt="GSTW" class="w-8 h-8 rounded-lg object-contain">
      <h1 class="font-headline font-extrabold text-lg text-slate-900">Rewards</h1>
    </div>
    <a href="impact.html" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-primary hover:bg-primary hover:text-white transition-colors">
      <span class="material-symbols-outlined text-[20px]">bar_chart</span>
    </a>
  </div>
</header>

<main class="pt-24 px-5 max-w-[430px] mx-auto">
  <div class="flex bg-white rounded-2xl p-1 shadow-sm border border-slate-100 mb-6">
    <button onclick="switchTab('trophies')" id="tab-trophies" class="tab-btn active rounded-xl">Trophies</button>
    <button onclick="switchTab('badges')" id="tab-badges" class="tab-btn rounded-xl">Badges</button>
  </div>

  <div id="section-trophies">
    <div class="grid grid-cols-5 gap-2 mb-6">
      <div class="flex flex-col items-center justify-center py-2 rounded-xl text-white" style="background-color: #94a3b8;"><span class="text-[8px] font-black uppercase">Common</span></div>
      <div class="flex flex-col items-center justify-center py-2 rounded-xl text-white" style="background-color: #16a34a;"><span class="text-[8px] font-black uppercase">Uncommon</span></div>
      <div class="flex flex-col items-center justify-center py-2 rounded-xl text-white" style="background-color: #2563eb;"><span class="text-[8px] font-black uppercase">Rare</span></div>
      <div class="flex flex-col items-center justify-center py-2 rounded-xl text-white" style="background-color: #9333ea;"><span class="text-[8px] font-black uppercase">Epic</span></div>
      <div class="flex flex-col items-center justify-center py-2 rounded-xl text-white" style="background-color: #d97706;"><span class="text-[8px] font-black uppercase">Mythic</span></div>
    </div>

    <h3 class="font-headline font-bold text-lg mb-4 px-1 text-slate-900">Your Collection</h3>
    <div id="unlockedTrophies" class="grid grid-cols-2 gap-4 mb-8"></div>
    <h3 class="font-headline font-bold text-lg mb-4 px-1 text-slate-900">Path to Glory</h3>
    <div id="lockedTrophies" class="grid grid-cols-2 gap-4"></div>
  </div>

  <div id="section-badges" class="hidden">
    <h3 class="font-headline font-bold text-lg mb-4 px-1 text-slate-900">Earned Badges</h3>
    <div id="unlockedBadges" class="grid grid-cols-3 gap-2 mb-8"></div>
    <h3 class="font-headline font-bold text-lg mb-4 px-1 text-slate-900">Future Missions</h3>
    <div id="lockedBadges" class="grid grid-cols-3 gap-2"></div>
  </div>
</main>

<div id="rewardModal" class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-md flex items-end justify-center">
  <div class="bg-white w-full max-w-[430px] rounded-t-3xl p-6 pb-10 relative">
    <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-6"></div>
    <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><span class="material-symbols-outlined text-[20px]">close</span></button>
    <div class="flex flex-col items-center text-center">
      <!-- Darker Blue Background -->
      <div id="modalIconContainer" class="w-32 h-32 flex items-center justify-center mb-4 rounded-2xl shadow-inner" style="background-color: #dbeafe;">
      </div>
      <h3 id="modalTitle" class="font-headline font-black text-2xl text-slate-900 mb-1">Trophy Name</h3>
      <p id="modalTier" class="text-[10px] font-black uppercase tracking-widest mb-4">TIER</p>
      
      <div id="modalProgressBar" class="flex gap-1 w-full max-w-[200px] mb-4"></div>

      <div id="modalDetails" class="w-full bg-slate-50 rounded-2xl p-5 text-left space-y-3 border border-slate-100"></div>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-white/80 backdrop-blur-[20px] border-t border-slate-100" style="padding-bottom: env(safe-area-inset-bottom);">
  <div class="max-w-lg mx-auto flex items-center justify-around h-16 px-2">
    <a href="index.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">home</span><span class="text-[10px] font-bold">Home</span></a>
    <a href="library.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">auto_stories</span><span class="text-[10px] font-bold">Library</span></a>
    <a href="cause.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">volunteer_activism</span><span class="text-[10px] font-bold">Missions</span></a>
    <a href="impact.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">bar_chart</span><span class="text-[10px] font-bold">Impact</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-slate-400"><span class="material-symbols-outlined" style="font-size:1.35rem">person</span><span class="text-[10px] font-bold">Profile</span></a>
  </div>
</nav>

<script>
var supabaseClient = supabase.createClient('https://nhymadutuhpjgkiurify.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeW1hZHV0dWhwamdraXVyaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTI5NzgsImV4cCI6MjA5NTU2ODk3OH0.kC5Ytuoi8Sy97ZTSZ8lEWeH1rngcbeHSxobOMIQahkM');
var currentUser = null, allTiers = [], allTrophies = [], allThresholds = [], userProgress = [], allBadges = [], userBadges = [];

window.switchTab = function(tab) { 
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
  document.getElementById('tab-' + tab).classList.add('active'); 
  document.getElementById('section-trophies').classList.add('hidden'); 
  document.getElementById('section-badges').classList.add('hidden'); 
  document.getElementById('section-' + tab).classList.remove('hidden'); 
};

async function init() {
  var s = await supabaseClient.auth.getSession(); 
  if (!s.data.session) { window.location.href = 'login.html'; return; } 
  currentUser = s.data.session.user;
  
  try {
    var results = await Promise.all([
      supabaseClient.from('trophy_tiers').select('*').order('id'),
      supabaseClient.from('trophy_definitions').select('*'),
      supabaseClient.from('trophy_thresholds').select('*'),
      supabaseClient.from('user_trophy_progress').select('*').eq('user_id', currentUser.id),
      supabaseClient.from('badge_definitions').select('*'),
      supabaseClient.from('profiles').select('badges').eq('id', currentUser.id).single()
    ]);

    allTiers = results[0].data || []; 
    allTrophies = results[1].data || []; 
    allThresholds = results[2].data || []; 
    userProgress = results[3].data || [];
    allBadges = results[4].data || []; 
    userBadges = (results[5].data && results[5].data.badges) ? results[5].data.badges : [];

    renderTrophies();
    renderBadges();
  } catch (err) { console.error("Rewards Page Error:", err); }
}

function renderTrophies() {
  var unlocked = document.getElementById('unlockedTrophies'); 
  var locked = document.getElementById('lockedTrophies');
  if(!unlocked || !locked) return;
  unlocked.innerHTML = ''; locked.innerHTML = '';
  
  allTrophies.forEach(t => {
    var activeThresholds = allThresholds.filter(th => th.trophy_id === t.id && th.is_active !== false).sort((a,b) => a.tier_id - b.tier_id);
    if (activeThresholds.length === 0) return;

    var userProg = userProgress.find(p => p.trophy_id === t.id);
    var currentProgress = userProg ? userProg.current_progress : 0;

    var unlockedTier = null;
    for (var i = activeThresholds.length - 1; i >= 0; i--) {
      if (currentProgress >= activeThresholds[i].threshold_value) { unlockedTier = activeThresholds[i]; break; }
    }

    if (unlockedTier) {
      var color = getTierColor(unlockedTier.tier_id);
      unlocked.innerHTML += `<div class="bold-block" style="background-color: ${color};" onclick="openModal('${t.id}', ${unlockedTier.tier_id}, false)">
        ${t.image_url ? `<img src="${t.image_url}">` : '<span class="material-symbols-outlined text-4xl filled">emoji_events</span>'}
        <p class="font-headline font-bold text-xs leading-tight w-full truncate px-1">${t.name}</p>
      </div>`;
    }

    var nextTier = activeThresholds.find(th => currentProgress < th.threshold_value);
    if (nextTier) {
      locked.innerHTML += `<div class="bold-block locked-block" onclick="openModal('${t.id}', ${nextTier.tier_id}, true)">
        ${t.image_url ? `<img src="${t.image_url}">` : '<span class="material-symbols-outlined text-4xl">lock</span>'}
        <p class="font-headline font-bold text-xs leading-tight w-full truncate px-1">${t.name}</p>
      </div>`;
    }
  });
  if (unlocked.innerHTML === '') unlocked.innerHTML = '<p class="col-span-2 text-center text-slate-400 text-sm py-4">No trophies unlocked yet.</p>';
  if (locked.innerHTML === '') locked.innerHTML = '<p class="col-span-2 text-center text-slate-400 text-sm py-4">All caught up!</p>';
}

function renderBadges() {
  var unlocked = document.getElementById('unlockedBadges'); 
  var locked = document.getElementById('lockedBadges');
  if(!unlocked || !locked) return;
  unlocked.innerHTML = ''; locked.innerHTML = '';
  allBadges.forEach(b => {
    var hasBadge = userBadges.includes(b.id) || userBadges.includes(b.name);
    if (hasBadge) {
      unlocked.innerHTML += `<div class="badge-item" onclick="openBadgeModal('${b.name}')">
        ${b.image_url ? `<img src="${b.image_url}">` : '<span class="material-symbols-outlined text-4xl text-primary">military_tech</span>'}
        <p>${b.name}</p>
      </div>`;
    } else {
      locked.innerHTML += `<div class="badge-item locked">
        ${b.image_url ? `<img src="${b.image_url}">` : '<span class="material-symbols-outlined text-4xl">lock</span>'}
        <p>${b.name}</p>
      </div>`;
    }
  });
  if (unlocked.innerHTML === '') unlocked.innerHTML = '<p class="col-span-3 text-center text-slate-400 text-sm py-4">No badges earned yet.</p>';
  if (locked.innerHTML === '') locked.innerHTML = '<p class="col-span-3 text-center text-slate-400 text-sm py-4">No future missions available.</p>';
}

function getTierColor(tierId) { var t = allTiers.find(x => x.id === tierId); return t ? t.color_hex : '#94a3b8'; }
function getTierName(tierId) { var t = allTiers.find(x => x.id === tierId); return t ? t.name : 'Unknown'; }
function getThreshold(trophyId, tierId) { var th = allThresholds.find(x => x.trophy_id === trophyId && x.tier_id === tierId); return th ? th.threshold_value : 0; }

window.openModal = function(trophyId, tierId, isLocked) {
  var t = allTrophies.find(x => x.id === trophyId); if (!t) return;
  var color = getTierColor(tierId);
  
  document.getElementById('modalTitle').textContent = t.name;
  document.getElementById('modalTier').textContent = isLocked ? 'Locked' : getTierName(tierId);
  document.getElementById('modalTier').style.color = isLocked ? '#94a3b8' : color;
  
  var container = document.getElementById('modalIconContainer');
  container.style.backgroundColor = '#dbeafe'; // Darker blue
  container.innerHTML = t.image_url ? `<img src="${t.image_url}" class="w-20 h-20 object-contain ${isLocked ? 'opacity-50' : ''}">` : '<span class="material-symbols-outlined text-5xl text-primary">emoji_events</span>';

  var currentLevel = isLocked ? 0 : tierId;
  var barHTML = '';
  for(var i=1; i<=5; i++) {
     var isActive = i <= currentLevel;
     barHTML += `<div class="h-2 flex-1 rounded-full ${isActive ? 'bg-primary' : 'bg-slate-200'}"></div>`;
  }
  document.getElementById('modalProgressBar').innerHTML = barHTML;

  // Use description if available, otherwise fallback
  var descText = t.description || `Reach ${getThreshold(trophyId, tierId)} ${t.stat_type || 'points'} to unlock.`;
  if (isLocked) {
     descText = `<strong class="text-slate-900 block mb-1">Requirement</strong>${descText}`;
  } else {
     descText = `<strong class="text-slate-900 block mb-1">${getTierName(tierId)} Tier Unlocked</strong>${descText}`;
  }
  document.getElementById('modalDetails').innerHTML = `<p class="text-sm text-slate-600">${descText}</p>`;
  document.getElementById('rewardModal').classList.remove('hidden');
}

window.openBadgeModal = function(badgeName) {
  var b = allBadges.find(x => x.name === badgeName); if (!b) return;
  document.getElementById('modalTitle').textContent = b.name;
  document.getElementById('modalTier').textContent = 'Badge Earned';
  document.getElementById('modalTier').style.color = '#3d6285';
  var container = document.getElementById('modalIconContainer');
  container.style.backgroundColor = '#dbeafe';
  container.innerHTML = b.image_url ? `<img src="${b.image_url}" class="w-20 h-20 object-contain">` : '<span class="material-symbols-outlined text-5xl text-primary">military_tech</span>';
  document.getElementById('modalProgressBar').innerHTML = '';
  document.getElementById('modalDetails').innerHTML = `<p class="text-sm text-slate-600"><strong class="text-slate-900 block mb-1">Mission Complete</strong>You have successfully earned the ${b.name} badge!</p>`;
  document.getElementById('rewardModal').classList.remove('hidden');
}

window.closeModal = function() { document.getElementById('rewardModal').classList.add('hidden'); }
document.getElementById('rewardModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

init();
</script>
</body>
</html>
