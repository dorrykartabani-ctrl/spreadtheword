  async function initPage() {
    var sessionResult = await supabaseClient.auth.getSession()
    if (!sessionResult.data.session) {
      window.location.href = 'login.html'
      return
    }
    currentUser = sessionResult.data.session.user

    var results = await Promise.allSettled([
      supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single(),
      supabaseClient.from('user_trophy_progress').select('*').eq('user_id', currentUser.id),
      supabaseClient.from('avatar_stages').select('*').order('stage_order', { ascending: true })
    ])

    currentProfile = (results[0].status === 'fulfilled' && results[0].value.data) ? results[0].value.data : {}
    var trophyProgress = (results[1].status === 'fulfilled' && results[1].value.data) ? results[1].value.data : []
    var avatarStages = (results[2].status === 'fulfilled' && results[2].value.data) ? results[2].value.data : []

    // Render rank summary

  }

  // ═══════════════════════════════════════════
  // AVATAR PREVIEW
  // ════════════════════════════════════════════
  function updateAvatarPreview() {
    var name = document.getElementById('inputName').value.trim()
    var initials = '?'
    var imgEl = document.getElementById('avatarImagePreview')
    var textEl = document.getElementById('avatarInitials')

    // If they have a real avatar URL in their profile, show it
    if (currentProfile.avatar_url && currentProfile.avatar_url.length > 5) {
      imgEl.src = currentProfile.avatar_url
      imgEl.classList.remove('hidden')
      textEl.classList.add('hidden')
      return
    }

    // Otherwise show initials
    imgEl.classList.add('hidden')
    textEl.classList.remove('hidden')

    if (name.length >= 2) {
      var parts = name.split(' ')
      if (parts.length >= 2) {
        initials = (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
      } else {
        initials = parts[0].substring(0, 2).toUpperCase()
      }
    }
    textEl.textContent = initials
  }

  // ════════════════════════════════════════════
  // RANK DISPLAY (Read-only, matches profile.html)
  // ════════════════════════════════════════════
  function renderRank(trophyProgress, avatarStages) {
    // Count Mythic Trophies
    var mythicCount = 0
    trophyProgress.forEach(function(p) {
      var level = parseInt(p.current_tier_level || p.current_tier_id || 0)
      if (level === 5) mythicCount++
    })

    // Determine Stage
    var currentStage = avatarStages[0] || { journey_name: 'The Seeker', stage_order: 0, mythic_trophies_required: 0 }
    var nextStage = null

    for (var i = avatarStages.length - 1; i >= 0; i--) {
      if (mythicCount >= (avatarStages[i].mythic_trophies_required || 0)) {
        currentStage = avatarStages[i]
        nextStage = avatarStages[i + 1] || null
        break
      }
    }

    // Update DOM
    var rankTitle = document.getElementById('rankTitle')
    var rankLevel = document.getElementById('rankLevel')
    var rankBar = document.getElementById('rankBar')
    var rankProgress = document.getElementById('rankProgress')
    var rankNext = document.getElementById('rankNext')

    if (rankTitle) rankTitle.textContent = currentStage.journey_name || 'The Seeker'
    if (rankLevel) rankLevel.textContent = 'Stage ' + (currentStage.stage_order || 0)

    if (nextStage) {
      var prevReq = currentStage.mythic_trophies_required || 0
      var range = nextStage.mythic_trophies_required - prevReq
      var progress = mythicCount - prevReq
      var pct = Math.max(0, Math.min(100, (progress / range) * 100))
      
      if (rankProgress) rankProgress.textContent = mythicCount + '/' + nextStage.mythic_trophies_required + ' Mythic'
      if (rankNext) rankNext.textContent = 'Next: ' + nextStage.journey_name
      if (rankBar) setTimeout(function(){ rankBar.style.width = pct + '%' }, 300)
    } else {
      if (rankProgress) rankProgress.textContent = mythicCount + ' Mythic'
      if (rankNext) rankNext.textContent = 'Max Level'
      if (rankBar) setTimeout(function(){ rankBar.style.width = '100%' }, 300)
    }
  }

  // ════════════════════════════════════════════
  // NICKNAME CHECK
  // ════════════════════════════════════════════
  function checkNickname(value) {
    var statusEl = document.getElementById('nickStatus')
    var cleaned = value.replace(/[^a-zA-Z0-9_]/g, '').substring(0, 20)
    document.getElementById('inputNickname').value = cleaned

    if (!cleaned) {
      statusEl.textContent = '2-20 characters, letters, numbers and underscores'
      statusEl.className = 'nick-status text-text-light'
      nicknameValid = true
      return
    }
    if (cleaned.length < 2) {
      statusEl.textContent = 'Too short — minimum 2 characters'
      statusEl.className = 'nick-status text-action'
      nicknameValid = false
      return
    }
    if (cleaned.toLowerCase() === originalNickname.toLowerCase()) {
      statusEl.textContent = '✓ Your current nickname'
      statusEl.className = 'nick-status text-green-600'
      nicknameValid = true
      return
    }

    statusEl.textContent = 'Checking availability...'
    statusEl.className = 'nick-status text-text-muted'

    clearTimeout(nicknameTimer)
    nicknameTimer = setTimeout(async function() {
      var result = await supabaseClient
        .from('profiles')
        .select('id')
        .eq('nickname', cleaned.toLowerCase())
        .neq('id', currentUser.id)

      if (result.data && result.data.length > 0) {
        statusEl.textContent = '❌ @' + cleaned + ' is taken'
        statusEl.className = 'nick-status text-action'
        nicknameValid = false
      } else {
        statusEl.textContent = '✓ @' + cleaned + ' is available'
        statusEl.className = 'nick-status text-green-600'
        nicknameValid = true
      }
    }, 500)
  }

  // ════════════════════════════════════════════
  // COUNTRY & AUTO-DETECT LOGIC
  // ════════════════════════════════════════════
  function renderCountries(filter) {
    var container = document.getElementById('countryList')
    if (!container) return
    container.innerHTML = ''

    if (selectedCountry && !filter) {
      container.classList.add('hidden')
      return
    }
    container.classList.remove('hidden')

    var filtered = filter
      ? countries.filter(function(c) { return c.toLowerCase().includes(filter.toLowerCase()) })
      : countries

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center py-4"><p class="text-text-light text-xs font-bold">No countries found</p></div>'
      return
    }

    filtered.forEach(function(country) {
      var isSelected = country === selectedCountry
      var el = document.createElement('button')
      el.className = 'country-option w-full flex items-center gap-3 px-4 py-2.5 transition-all active:scale-[0.98] '
        + (isSelected ? 'bg-primary/10' : 'hover:bg-surface')
      el.onclick = function() { selectCountry(country) }

      el.innerHTML =
        '<span class="text-lg flex-shrink-0 w-8 text-center">' + getFlag(country) + '</span>'
        + '<span class="font-body font-medium text-sm text-text-dark flex-1 text-left">' + country + '</span>'
        + (isSelected ? '<span class="material-symbols-outlined text-primary text-[18px] filled flex-shrink-0">check_circle</span>' : '')

      container.appendChild(el)
    })
  }

  function filterCountries(query) {
    if (selectedCountry) clearCountry()
    renderCountries(query)
  }

  function selectCountry(country) {
    selectedCountry = country
    
    // AUTO-DETECT Currency and Timezone
    if (countryData[country]) {
      autoCurrency = countryData[country].currency
      autoTimezone = countryData[country].tz
    }

    showSelectedCountry(country)
    document.getElementById('countrySearch').value = ''
    renderCountries()
  }

  function showSelectedCountry(country) {
    var display = document.getElementById('selectedCountryDisplay')
    var flagEl  = document.getElementById('selectedCountryFlag')
    var nameEl  = document.getElementById('selectedCountryName')

    if (display) display.classList.remove('hidden')
    if (flagEl)  flagEl.textContent = getFlag(country)
    if (nameEl)  nameEl.textContent = country

    var list = document.getElementById('countryList')
    if (list) list.classList.add('hidden')
  }

  function clearCountry() {
    selectedCountry = ''
    autoCurrency = ''
    autoTimezone = ''
    var display = document.getElementById('selectedCountryDisplay')
    if (display) display.classList.add('hidden')
    renderCountries()
  }

  // ════════════════════════════════════════════
  // SAVE PROFILE
  // ════════════════════════════════════════════
  async function saveProfile() {
    var name     = document.getElementById('inputName').value.trim()
    var nickname = document.getElementById('inputNickname').value.trim().toLowerCase()
    var gender   = document.getElementById('inputGender').value
    var city     = document.getElementById('inputCity').value.trim()
    
    var btn      = document.getElementById('saveBtn')
    var icon     = document.getElementById('saveIcon')
    var label    = document.getElementById('saveLabel')

    if (!name || name.length < 2) {
      showToast('Please enter your full name')
      return
    }
    if (nickname && !nicknameValid) {
      showToast('Nickname is not available')
      return
    }

    // Loading state
    icon.textContent = 'progress_activity'
    icon.classList.add('spin')
    label.textContent = 'Saving...'
    btn.disabled = true

    var updateData = {
      full_name: name,
      country: selectedCountry || null,
      gender: gender || null,
      city: city || null,
      currency: autoCurrency || null,
      timezone: autoTimezone || null
    }

    if (nickname) {
      updateData.nickname = nickname
    } else if (originalNickname && !nickname) {
      updateData.nickname = null
    }

    var result = await supabaseClient
      .from('profiles')
      .update(updateData)
      .eq('id', currentUser.id)

    if (result.error) {
      console.error('Save error:', result.error)
      showToast('Error saving profile')
      icon.textContent = 'save'
      icon.classList.remove('spin')
      label.textContent = 'Save Changes'
      btn.disabled = false
      return
    }

    // Success
    icon.textContent = 'check_circle'
    icon.classList.remove('spin')
    label.textContent = 'Saved!'
    showToast('Profile updated successfully')
    originalNickname = nickname

    setTimeout(function() {
      window.location.href = 'profile.html'
    }, 1500)
  }

  function goBack() { window.location.href = 'profile.html' }

  function showToast(msg) {
    var existing = document.getElementById('editToast')
    if (existing) existing.remove()
    var t = document.createElement('div')
    t.id = 'editToast'
    t.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-dark/90 backdrop-blur-md text-white text-xs font-bold px-5 py-3 rounded-full shadow-lifted whitespace-nowrap flex items-center gap-2'
    t.innerHTML = '<span class="material-symbols-outlined text-gold text-[14px] filled">check_circle</span> ' + msg
    document.body.appendChild(t)
    setTimeout(function() { if (t.parentNode) t.remove() }, 2500)
  }

  initPage()
</script>
